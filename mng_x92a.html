<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 전용 보안 및 최적화 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">

<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-6 text-gray-800">🛠️ 관리자 보안 및 작업창</h2>
    
    <div class="mb-8 p-4 border bg-red-50 rounded">
        <h3 class="font-bold text-sm mb-2 text-red-800">🚫 IP 차단 관리</h3>
        <input type="text" id="ip-to-block" placeholder="차단할 IP 입력" class="border p-2 text-sm rounded w-full mb-2">
        <button onclick="blockIp()" class="bg-red-600 text-white px-4 py-2 rounded text-sm w-full hover:bg-red-700">차단하기</button>
    </div>

    <div class="p-4 border bg-gray-50 rounded">
        <h3 class="font-bold text-sm mb-2 text-gray-800">🗑️ 데이터 정밀 정리</h3>
        <button onclick="deleteOldFiles()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm w-full mb-2 hover:bg-blue-700">
            30일 지난 파일(URL) 삭제
        </button>
        <button onclick="deleteOldPersonalInfo()" class="bg-purple-600 text-white px-4 py-2 rounded text-sm w-full hover:bg-purple-700">
            1년 지난 개인정보(메시지/IP/주소) 삭제
        </button>
        <button onclick="bulkDeleteStaleOrders()" class="bg-red-600 text-white px-4 py-2 rounded text-sm w-full mt-2 hover:bg-red-700">
            30일 지난 입금대기 + 주문취소건 일괄삭제
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // [추가] 장바구니(01my.html/cart.html) 쪽 주문은 다른 Firebase 프로젝트에 저장됨
    const cartFirebaseConfig = {
        apiKey: "AIzaSyBzHogA2iaUQqOOsNVL55stsdMH8lCQ4Ek",
        authDomain: "ecogr-636c6.firebaseapp.com",
        projectId: "ecogr-636c6",
        storageBucket: "ecogr-636c6.firebasestorage.app",
        messagingSenderId: "95745358447",
        appId: "1:95745358447:web:94cde53f6b36e6be95eb9a"
    };
    const cartDb = getFirestore(initializeApp(cartFirebaseConfig, "cartApp"));

    // Firestore Timestamp든 문자열 날짜든(장바구니 주문 createdAt이 ISO 문자열) 안전하게 Date로 변환
    function toDateSafe(val) {
        if (!val) return null;
        if (typeof val.toDate === 'function') return val.toDate();
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
    }

    // 1. IP 차단 기능
    window.blockIp = async function() {
        const ip = document.getElementById("ip-to-block").value.trim();
        if (!ip) return alert("IP를 입력해주세요.");
        await setDoc(doc(db, "blocked_ips", ip), {
            blockedAt: new Date(),
            reason: "관리자 수동 차단"
        });
        alert(ip + " 차단 완료되었습니다.");
        document.getElementById("ip-to-block").value = "";
    };

    // 2. 30일 지난 파일(URL) 삭제 기능
    // R2 워커 주소 — app.js(게시판 파일 업로드)가 파일을 올릴 때 쓰는 것과 동일한 워커
    const R2_WORKER_URL = "https://r2.ecogr.workers.dev/";

    // file1Url/file2Url 문자열에서 R2에 저장된 실제 파일명(name= 파라미터)을 뽑아냄.
    // 예전 형식(pub-....r2.dev/파일명)으로 저장된 것도 있을 수 있어서, 그 경우엔
    // 주소의 마지막 경로 조각을 파일명으로 대신 사용함.
    function extractR2FileName(url) {
        if (!url) return null;
        try {
            const u = new URL(url);
            const byParam = u.searchParams.get("name");
            if (byParam) return byParam;
            const segments = u.pathname.split("/").filter(Boolean);
            return segments.length ? decodeURIComponent(segments[segments.length - 1]) : null;
        } catch (e) {
            return null;
        }
    }

    // R2에서 실제 파일을 삭제함 (실패해도 조용히 넘어감 — 이미 지워졌거나 다른 저장소일 수 있음)
    async function deleteFromR2(fileUrl) {
        const fileName = extractR2FileName(fileUrl);
        if (!fileName) return;
        try {
            await fetch(`${R2_WORKER_URL}?name=${encodeURIComponent(fileName)}`, { method: "DELETE" });
        } catch (e) {
            console.error("R2 파일 삭제 실패:", fileName, e);
        }
    }

    window.deleteOldFiles = async function() {
        if (!confirm("30일이 경과한 게시물의 파일 정보를 초기화하시겠습니까?\n(R2 저장소의 실제 파일도 함께 삭제되며, 복구 불가합니다)")) return;
        const thirtyDaysAgo = new Date();
        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

        const collections = ["boards", "jjjj"];
        let count = 0;
        for (const colName of collections) {
            const snapshot = await getDocs(collection(db, colName));
            for (const docSnapshot of snapshot.docs) {
                const data = docSnapshot.data();
                if (data.createdAt && data.createdAt.toDate() < thirtyDaysAgo && (data.file1Url || data.file2Url)) {
                    // [추가] Firestore 참조를 지우기 전에, R2에 있는 실제 파일부터 삭제
                    await Promise.all([
                        deleteFromR2(data.file1Url),
                        deleteFromR2(data.file2Url)
                    ]);
                    await setDoc(doc(db, colName, docSnapshot.id), { file1Url: null, file2Url: null }, { merge: true });
                    count++;
                }
            }
        }
        alert(count > 0 ? `${count}개 게시물의 파일(Firestore 참조 + R2 실제 파일)이 삭제되었습니다.` : "삭제할 파일 정보가 없습니다.");
    };

    // 3. 1년 지난 개인정보 삭제 기능
    window.deleteOldPersonalInfo = async function() {
        if (!confirm("1년이 경과한 게시물의 개인정보를 삭제하시겠습니까?")) return;
        const oneYearAgo = new Date();
        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

        const collections = ["boards", "jjjj"];
        let count = 0;
        for (const colName of collections) {
            const snapshot = await getDocs(collection(db, colName));
            for (const docSnapshot of snapshot.docs) {
                const data = docSnapshot.data();
                if (data.createdAt && data.createdAt.toDate() < oneYearAgo) {
                    await setDoc(doc(db, colName, docSnapshot.id), { 
                        message: null, ip: null, address: null 
                    }, { merge: true });
                    count++;
                }
            }
        }
        alert(count > 0 ? `${count}개 게시물의 개인정보가 삭제되었습니다.` : "삭제할 대상이 없습니다.");
    };

    // 4. [추가] 30일 지난 "입금대기"건 + 기간 상관없이 "주문취소"건을 일괄 삭제.
    // 게시판(board-291e3)과 장바구니(ecogr-636c6) 두 프로젝트 전부 대상으로 함께 처리됨.
    window.bulkDeleteStaleOrders = async function() {
        if (!confirm("30일이 지난 '입금대기' 주문과, 기간 상관없이 모든 '주문취소' 주문을 전부 삭제하시겠습니까?\n(게시판 + 장바구니 주문 전부 대상이며, 복구할 수 없습니다)")) return;

        const thirtyDaysAgo = new Date();
        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

        const targets = [
            { targetDb: db, name: "boards" },
            { targetDb: db, name: "jjjj" },
            { targetDb: cartDb, name: "orders" }
        ];

        let deletedCount = 0;
        try {
            for (const t of targets) {
                const snapshot = await getDocs(collection(t.targetDb, t.name));
                for (const docSnapshot of snapshot.docs) {
                    const data = docSnapshot.data();
                    const status = data.status;
                    const createdAtDate = toDateSafe(data.createdAt);

                    const isCancelled = status === '주문취소';
                    const isStalePending = status === '입금대기' && createdAtDate && createdAtDate < thirtyDaysAgo;

                    if (isCancelled || isStalePending) {
                        await deleteDoc(doc(t.targetDb, t.name, docSnapshot.id));
                        deletedCount++;
                    }
                }
            }
            alert(deletedCount > 0 ? `${deletedCount}건 삭제 완료되었습니다.` : "삭제 대상이 없습니다.");
        } catch (e) {
            console.error(e);
            alert("삭제 중 오류가 발생했습니다: " + e.message);
        }
    };
</script>
</body>
</html>
