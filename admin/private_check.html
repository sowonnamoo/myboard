<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>private 문서 존재 확인 도구</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  input { display:block; width:100%; box-sizing:border-box; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:8px; }
  button { padding:12px 20px; background:#1e293b; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
  #result { margin-top:20px; padding:16px; border-radius:8px; font-size:14px; white-space:pre-wrap; }
  .ok { background:#dcfce7; color:#166534; }
  .fail { background:#fee2e2; color:#991b1b; }
</style>
</head>
<body>
<h2>🔍 private 문서 존재 확인</h2>
<p style="color:#666; font-size:13px;">boards 문서 ID, 이름, 전화번호를 넣으면 app.js와 똑같은 방식으로 secretId를 계산해서 private 문서가 실제로 존재하는지 확인합니다. (관리자 로그인 필요 없음, 손님용 페이지와 동일한 권한으로 조회)</p>

<label>boards 문서 ID (Firestore 콘솔에서 복사)</label>
<input id="boardId" placeholder="예: bXELL5m7NMpLqFwr7ITc">

<label>주문자 이름 (author)</label>
<input id="author" placeholder="예: 조정석">

<label>전화번호 (하이픈 없이, 예: 01055555555)</label>
<input id="phone" placeholder="예: 01055555555">

<button onclick="check()">확인하기</button>

<div id="result"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
    authDomain: "board-291e3.firebaseapp.com",
    projectId: "board-291e3",
    storageBucket: "board-291e3.firebasestorage.app",
    messagingSenderId: "25881766316",
    appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let resolveReady;
const readyPromise = new Promise(r => resolveReady = r);
onAuthStateChanged(auth, (user) => {
    if (user) resolveReady(user);
    else signInAnonymously(auth).catch(e => console.error("익명 로그인 실패:", e));
});

async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function normalizeName(name) { return String(name || "").trim(); }
function normalizePhoneLast4(phone) { return String(phone || "").replace(/[^0-9]/g, "").slice(-4); }
async function computeSecretId(boardId, author, phone) {
    const key = `${boardId}::${normalizeName(author)}::${normalizePhoneLast4(phone)}`;
    return sha256Hex(key);
}

window.check = async function() {
    const resultEl = document.getElementById("result");
    resultEl.className = "";
    resultEl.textContent = "확인 중...";

    const boardId = document.getElementById("boardId").value.trim();
    const author = document.getElementById("author").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!boardId || !author || !phone) {
        resultEl.className = "fail";
        resultEl.textContent = "boards 문서 ID, 이름, 전화번호를 모두 입력해주세요.";
        return;
    }

    try {
        await readyPromise;
        const secretId = await computeSecretId(boardId, author, phone);
        const snap = await getDoc(doc(db, "boards", boardId, "private", secretId));

        if (snap.exists()) {
            resultEl.className = "ok";
            resultEl.textContent =
                "✅ private 문서가 실제로 존재합니다!\n\n계산된 secretId: " + secretId +
                "\n\n내용:\n" + JSON.stringify(snap.data(), null, 2);
        } else {
            resultEl.className = "fail";
            resultEl.textContent =
                "❌ private 문서가 존재하지 않습니다.\n\n계산된 secretId: " + secretId +
                "\n\n→ 이 주문을 접수할 때 private 쓰기 단계가 실패했다는 뜻입니다.\n" +
                "(이름/전화번호를 정확히 그때 입력한 값 그대로 넣었는지 다시 확인해보세요. 오타가 있으면 이렇게 '없음'으로 나옵니다.)";
        }
    } catch (e) {
        resultEl.className = "fail";
        resultEl.textContent = "⚠️ 오류 발생: " + e.message + "\n\n(이 오류 메시지를 그대로 캡처해서 보내주세요)";
    }
};
</script>
</body>
</html>
