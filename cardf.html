<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카드전표 신청 시스템</title>
    <style>
        /* 테두리선(border)을 제거하고, 필요에 따라 여백 등을 조정함 */
   .box { width: 450px; height: 600px; margin: 20px auto; padding: 15px 30px 30px 30px; background: white; box-sizing: border-box; display: flex; flex-direction: column; }
    
    input { width: 100%; padding: 12px; margin: 3px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn-main { width: 100%; padding: 12px; margin-top: 5px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
    .btn-group { display: flex; gap: 10px; margin: 20px 0; }
    .btn-tab { flex: 1; padding: 15px 5px; border: 1px solid #333; background: #333; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; font-weight: bold; }
    .btn-tab.right { background: #4a4a4a; border-color: #4a4a4a; }
    .hidden { display: none; }
    .save-btn { background: #9acd32; color: #000; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #applyStatus { font-size: 12px; text-align: center; margin-top: 8px; color: #166534; }
</style>
</head>
<body>

<div class="box">
    <h3>카드전표</h3>

    <div class="btn-group">
        <button class="btn-tab" onclick="printReceipt()">카드결제내역서<br>(즉시발급)</button>
        <button class="btn-tab right" onclick="toggleApplyForm()">카드전표 영수증<br>신청</button>
    </div>

    <div id="applyForm" class="hidden">
        <h3 style="color: #000080; border-bottom: 2px solid #000080; padding-bottom: 5px;">카드전표 이메일 신청</h3>
        <input type="email" id="applyEmail" placeholder="영수증 받으실 이메일주소 입력">
        <p style="font-size: 12px; color: #000080; margin: 15px 0; line-height: 1.5; text-align: center;">
            이 주문 건의 카드전표를<br>
            입력하신 이메일주소로 발행해드립니다.
        </p>
        <button class="save-btn" onclick="saveCardData()">저장 / 수정</button>
        <div id="applyStatus"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 이 카드전표 신청이 어떤 주문건에 대한 것인지 - index.html에서 열 때 URL에 id로 넘어옴
    const urlParams = new URLSearchParams(window.location.search);
    const boardId = urlParams.get('id') || '';

    window.toggleApplyForm = async () => {
        const formEl = document.getElementById('applyForm');
        formEl.classList.toggle('hidden');
        if (!formEl.classList.contains('hidden')) {
            await loadExistingEmail();
        }
    };

    window.printReceipt = () => {
        const date = urlParams.get('date') || '2026-06-11';
        const name = urlParams.get('name') || '상품명';
        const size = urlParams.get('size') || '규격';
        const qty = urlParams.get('qty') || '0';
        const price = urlParams.get('price') || '0';

        const url = `cardh.html?date=${date}&name=${encodeURIComponent(name)}&size=${size}&qty=${qty}&price=${price}`;
        window.open(url, '_blank', 'width=500,height=850');
    };

    // 이미 신청한 이메일이 있으면 미리 채워서 보여줌
    async function loadExistingEmail() {
        if (!boardId) return;
        try {
            const snap = await getDoc(doc(db, "adminOrders", boardId));
            const status = document.getElementById('applyStatus');
            if (snap.exists() && snap.data().cardEmail) {
                document.getElementById('applyEmail').value = snap.data().cardEmail;
                status.textContent = snap.data().cardIssued ? '이미 발행 완료된 신청입니다.' : '신청 접수됨 - 발행 대기중';
            } else {
                status.textContent = '';
            }
        } catch (e) {
            // 조회 실패해도 신청 자체는 계속 가능하도록 조용히 무시
        }
    }

    window.saveCardData = async () => {
        const email = document.getElementById('applyEmail').value.trim();

        if (!boardId) {
            alert('주문 정보를 찾을 수 없습니다. 주문 상세 화면에서 다시 열어주세요.');
            return;
        }
        if (!email) {
            alert('이메일을 입력해주세요.');
            return;
        }

        try {
            // 이 주문(boardId)의 관리자 전용 문서에 이메일만 추가 저장 (기존 필드는 유지 - merge)
            // 새로 신청/수정하는 경우 발행 상태는 항상 '미발행'으로 초기화
            await setDoc(doc(db, "adminOrders", boardId), {
                cardEmail: email,
                cardIssued: false
            }, { merge: true });
            alert('카드전표 신청이 저장되었습니다.');
            await loadExistingEmail();
        } catch (e) {
            alert('저장 중 오류 발생: ' + e.message);
        }
    };
</script>
</body>
</html>
