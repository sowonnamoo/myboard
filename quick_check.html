<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>최근 주문 관리</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
  input { box-sizing:border-box; padding:10px; margin:2px 0; border:1px solid #ccc; border-radius:8px; font-size:14px; }
  input.wide { display:block; width:100%; padding:12px; font-size:16px; margin:8px 0; }
  button { padding:12px 24px; background:#1e293b; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px; }
  table { width:100%; border-collapse: collapse; margin-top:20px; font-size:13px; }
  th, td { border:1px solid #e2e8f0; padding:8px 8px; text-align:left; vertical-align: top; }
  th { background:#f1f5f9; }
  .fail { color:#991b1b; }
  .ok { color:#166534; font-weight:bold; }
  .url-row { display:flex; gap:4px; margin-top:4px; }
  .url-row input { flex:1; width:auto; font-size:12px; padding:6px; }
  .url-row button { padding:6px 10px; font-size:12px; }
  .url-saved { font-size:12px; color:#166534; }
  #loginBox { display:block; }
  #listBox { display:none; }
</style>
</head>
<body>

<h2>📦 최근 주문 관리</h2>

<div id="loginBox">
  <input class="wide" id="email" type="email" placeholder="관리자 이메일">
  <input class="wide" id="pw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인해서 최근 주문 보기</button>
  <div id="loginResult" class="fail" style="margin-top:8px; font-size:14px;"></div>
</div>

<div id="listBox">
  <p class="ok">✅ 로그인됨 — 최근 주문 10건</p>
  <div id="result">불러오는 중...</div>

  <div style="margin-top:20px; padding:16px; background:#f8fafc; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px;">선택된 주문: <b id="selected-name">없음</b></p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="updateStatus('대기')" style="background:#64748b;">대기</button>
      <button onclick="updateStatus('무통장')" style="background:#059669;">무통장</button>
      <button onclick="updateStatus('카드결제')" style="background:#2563eb;">카드결제</button>
      <button onclick="updateStatus('접수에러')" style="background:#dc2626;">접수에러</button>
      <button onclick="updateStatus('주문취소')" style="background:#1e293b;">주문취소</button>
      <button onclick="deleteSelectedOrder()" style="background:#b91c1c;">주문삭제</button>
      <button onclick="window.open('https://sowonnamoo.github.io/myboard/index1', '_blank', 'width=800,height=900')" style="background:#4f46e5;">✏️ 글쓰기</button>
    </div>
  </div>

  <div style="margin-top:20px; padding:16px; background:#fefce8; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px; font-weight:bold;">🧾 현금영수증 최신 신청 목록</p>
    <div id="cashResult">불러오는 중...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const config = {
  apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
  authDomain: "board-291e3.firebaseapp.com",
  projectId: "board-291e3",
  storageBucket: "board-291e3.firebasestorage.app",
  messagingSenderId: "25881766316",
  appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};
const app = initializeApp(config);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  document.getElementById("loginBox").style.display = user ? "none" : "block";
  document.getElementById("listBox").style.display = user ? "block" : "none";
  if (user) { loadRecentOrders(); loadCashRequests(); }
});

window.login = async function() {
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) {
    document.getElementById("loginResult").textContent = "로그인 실패: " + e.message;
  }
};

let currentSelected = { id: "" };
// 주문별 private 서브컬렉션 문서 참조를 캐싱 (운송장URL 저장 시 재사용)
let privateRefCache = {};

window.toggleSelect = (checkbox, id, author) => {
  if (checkbox.checked) {
    currentSelected = { id };
    document.getElementById('selected-name').innerText = author;
    document.querySelectorAll('input[type="checkbox"]').forEach(el => {
      if (el !== checkbox) el.checked = false;
    });
  } else {
    currentSelected = { id: "" };
    document.getElementById('selected-name').innerText = "없음";
  }
};

window.updateStatus = async (value) => {
  if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
  try {
    const docRef = doc(db, "boards", currentSelected.id);
    const updateData = { status: value };
    if (value === '접수에러') updateData.sian = '에러';
    if (value === '무통장' || value === '카드결제') {
      const snap = await getDoc(docRef);
      if (snap.exists() && !snap.data().paidAt) {
        updateData.paidAt = serverTimestamp();
      }
    }
    await updateDoc(docRef, updateData);
    alert("상태 변경 완료: " + value);
    loadRecentOrders();
  } catch (e) {
    alert("업데이트 실패: " + e.message);
  }
};

window.deleteSelectedOrder = async () => {
  if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
  if (!confirm("정말로 이 주문을 삭제하시겠습니까?\n삭제한 주문은 복구할 수 없습니다.")) return;
  try {
    const privSnap = await getDocs(collection(db, "boards", currentSelected.id, "private"));
    await Promise.all(privSnap.docs.map(d => deleteDoc(d.ref)));
    await deleteDoc(doc(db, "adminOrders", currentSelected.id)).catch(() => {});
    await deleteDoc(doc(db, "cardjun1", currentSelected.id)).catch(() => {});
    await deleteDoc(doc(db, "cashReceipt1", currentSelected.id)).catch(() => {});
    await deleteDoc(doc(db, "boards", currentSelected.id));
    alert("주문이 삭제되었습니다.");
    currentSelected = { id: "" };
    document.getElementById('selected-name').innerText = "없음";
    loadRecentOrders();
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
};

// 관리자 전용 phone/address 조회 (기존과 동일, adminOrders 사용)
async function fetchPrivate(docId) {
  try {
    const snap = await getDoc(doc(db, "adminOrders", docId));
    return snap.exists() ? snap.data() : { _err: "adminOrders 문서 없음" };
  } catch (e) {
    return { _err: (e.code || "") + " " + e.message };
  }
}

// 운송장URL은 고객 본인만 볼 수 있는 boards/{id}/private 문서에 저장합니다.
// isAdmin()은 list 권한이 있어서, secretId를 몰라도 그 주문의 private 문서를 찾아올 수 있습니다.
async function fetchPrivateRef(boardId) {
  try {
    const snap = await getDocs(collection(db, "boards", boardId, "private"));
    if (snap.empty) return null;
    const d = snap.docs[0];
    privateRefCache[boardId] = d.ref;
    return d.data();
  } catch (e) {
    return null;
  }
}

window.saveTrackingUrl = async (boardId) => {
  const input = document.getElementById('track-' + boardId);
  const url = input.value.trim();
  if (!url) return alert("운송장 URL을 입력해주세요.");
  const ref = privateRefCache[boardId];
  if (!ref) return alert("이 주문의 개인정보(private) 문서를 찾지 못했습니다. 새로고침 후 다시 시도해주세요.");
  try {
    await updateDoc(ref, { trackingUrl: url });
    alert("운송장 URL이 저장되었습니다. (본인만 조회 가능)");
    loadRecentOrders();
  } catch (e) {
    alert("저장 실패: " + e.message);
  }
};

window.saveCardReceiptUrl = async (boardId) => {
  const input = document.getElementById('card-' + boardId);
  const url = input.value.trim();
  if (!url) return alert("카드전표 URL을 입력해주세요.");
  try {
    await setDoc(doc(db, "cardjun1", boardId), { fileUrl: url }, { merge: true });
    alert("카드전표 URL이 저장되었습니다.");
    loadRecentOrders();
  } catch (e) {
    alert("저장 실패: " + e.message);
  }
};

window.saveCashUrl = async (boardId) => {
  const input = document.getElementById('cashurl-' + boardId);
  const url = input.value.trim();
  if (!url) return alert("전표 jpg URL을 입력해주세요.");
  try {
    await updateDoc(doc(db, "cashReceipt1", boardId), { fileUrl: url });
    alert("현금영수증 URL이 저장되었습니다.");
    loadCashRequests();
  } catch (e) {
    alert("저장 실패: " + e.message);
  }
};

async function loadCashRequests() {
  const el = document.getElementById("cashResult");
  try {
    const q3 = query(collection(db, "cashReceipt1"), orderBy("createdAt", "desc"), limit(20));
    const snap3 = await getDocs(q3);

    if (snap3.empty) {
      el.textContent = "신청 내역이 없습니다.";
      return;
    }

    let html = "<table><tr><th>작성자</th><th>발행희망번호</th><th>상태</th></tr>";
    snap3.forEach(d => {
      const data = d.data();
      let statusCell;
      if (data.fileUrl) {
        statusCell = `<span class="ok">✅ 발행완료</span> <a href="${data.fileUrl}" target="_blank">보기</a>`;
      } else {
        statusCell = `<div class="url-row"><input id="cashurl-${d.id}" placeholder="전표 jpg URL"><button onclick="saveCashUrl('${d.id}')">저장</button></div>`;
      }
      html += `<tr><td>${data.author || '-'}</td><td>${data.cashNumber || '-'}</td><td>${statusCell}</td></tr>`;
    });
    html += "</table>";
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<span class="fail">⚠️ 신청 목록 조회 오류: ${e.code || ''} ${e.message}</span>`;
  }
}

async function loadRecentOrders() {
  const resultEl = document.getElementById("result");
  try {
    const q1 = query(collection(db, "boards"), orderBy("createdAt", "desc"), limit(10));
    const snap1 = await getDocs(q1);

    if (snap1.empty) {
      resultEl.textContent = "주문이 없습니다.";
      return;
    }

    const adminPrivates = await Promise.all(snap1.docs.map(d => fetchPrivate(d.id)));
    const rawPrivates = await Promise.all(snap1.docs.map(d => fetchPrivateRef(d.id)));

    let html = "<table><tr><th></th><th>날짜</th><th>작성자</th><th>연락처</th><th>배송지</th><th>상태</th><th>운송장URL</th><th>카드전표URL</th></tr>";
    snap1.docs.forEach((d, idx) => {
      const data = d.data();
      const adminPriv = adminPrivates[idx];
      const rawPriv = rawPrivates[idx] || {};
      const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('ko-KR') : '-';
      const author = data.author || '-';
      const status = data.status || '대기';

      let phone, address;
      if (adminPriv._err) {
        phone = `<span class="fail">⚠️ ${adminPriv._err}</span>`;
        address = '-';
      } else {
        phone = adminPriv.phone || '<span class="fail">(비어있음)</span>';
        address = adminPriv.address || '<span class="fail">(비어있음)</span>';
      }

      const authorEsc = author.replace(/'/g, "\\'");
      const existingTracking = rawPriv.trackingUrl || '';
      const trackingCell = existingTracking
        ? `<span class="url-saved">✅ 등록됨</span><div class="url-row"><input id="track-${d.id}" value="${existingTracking.replace(/"/g,'&quot;')}"><button onclick="saveTrackingUrl('${d.id}')">수정</button></div>`
        : `<div class="url-row"><input id="track-${d.id}" placeholder="운송장 URL"><button onclick="saveTrackingUrl('${d.id}')">저장</button></div>`;

      // 카드결제 상태일 때만 카드전표 URL 입력칸 표시
      let cardCell = '-';
      if (status === '카드결제') {
        cardCell = `<div class="url-row"><input id="card-${d.id}" placeholder="카드전표 URL"><button onclick="saveCardReceiptUrl('${d.id}')">저장</button></div>`;
      }

      html += `<tr>
        <td><input type="checkbox" onchange="toggleSelect(this, '${d.id}', '${authorEsc}')"></td>
        <td>${date}</td>
        <td>${author}</td>
        <td>${phone}</td>
        <td>${address}</td>
        <td>${status}</td>
        <td>${trackingCell}</td>
        <td>${cardCell}</td>
      </tr>`;
    });
    html += "</table>";
    resultEl.innerHTML = html;
  } catch (e) {
    resultEl.innerHTML = `<span class="fail">⚠️ 목록 조회 오류: ${e.code || ''} ${e.message}</span>`;
  }
}
</script>
</body>
</html>
