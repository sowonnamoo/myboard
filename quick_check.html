<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>최근 주문 연락처 확인</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  input { display:block; width:100%; box-sizing:border-box; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; font-size:16px; }
  button { padding:12px 24px; background:#1e293b; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px; }
  table { width:100%; border-collapse: collapse; margin-top:20px; font-size:14px; }
  th, td { border:1px solid #e2e8f0; padding:8px 10px; text-align:left; }
  th { background:#f1f5f9; }
  .fail { color:#991b1b; }
  .ok { color:#166534; font-weight:bold; }
  .pending { color:#b45309; font-weight:bold; }
  #loginBox { display:block; }
  #listBox { display:none; }
  .card-url-input { display:inline-block; width:140px; padding:4px 6px; margin:2px 4px 2px 0; font-size:12px; }
  .card-url-btn { padding:4px 8px; font-size:12px; }
</style>
</head>
<body>

<h2>📦 최근 주문 연락처/배송지 확인</h2>

<div id="loginBox">
  <input id="email" type="email" placeholder="관리자 이메일">
  <input id="pw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인해서 최근 주문 보기</button>
  <div id="loginResult" class="fail" style="margin-top:8px; font-size:14px;"></div>
</div>

<div id="listBox">
  <p class="ok">✅ 로그인됨 — 최근 주문 10건</p>
  <div id="result">불러오는 중...</div>

  <div style="margin-top:20px; padding:16px; background:#f8fafc; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px;">선택된 주문: <b id="selected-name">없음</b></p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="updateStatus('대기')" style="background:#64748b;">대기</button>
      <button onclick="updateStatus('무통장')" style="background:#059669;">무통장</button>
      <button onclick="updateStatus('카드결제')" style="background:#2563eb;">카드결제</button>
      <button onclick="updateStatus('접수에러')" style="background:#dc2626;">접수에러</button>
      <button onclick="updateStatus('주문취소')" style="background:#1e293b;">주문취소</button>
      <button onclick="deleteSelectedOrder()" style="background:#b91c1c;">주문삭제</button>
      <button onclick="window.open('https://sowonnamoo.github.io/myboard/index1', '_blank', 'width=800,height=900')" style="background:#4f46e5;">✏️ 글쓰기</button>
    </div>
  </div>

  <div style="margin-top:20px; padding:16px; background:#eff6ff; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px; font-weight:bold;">📋 발행 신청 목록 (카드전표 / 현금영수증 / 세금계산서)</p>
    <div id="requestResult">불러오는 중...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const config = {
  apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
  authDomain: "board-291e3.firebaseapp.com",
  projectId: "board-291e3",
  storageBucket: "board-291e3.firebasestorage.app",
  messagingSenderId: "25881766316",
  appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};
const app = initializeApp(config);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  document.getElementById("loginBox").style.display = user ? "none" : "block";
  document.getElementById("listBox").style.display = user ? "block" : "none";
  if (user) {
    loadRecentOrders();
    loadRequestList();
  }
});

window.login = async function() {
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) {
    document.getElementById("loginResult").textContent = "로그인 실패: " + e.message;
  }
};

let currentSelected = { id: "" };

window.toggleSelect = (checkbox, id, author) => {
  if (checkbox.checked) {
    currentSelected = { id };
    document.getElementById('selected-name').innerText = author;
    document.querySelectorAll('input[type="checkbox"]').forEach(el => {
      if (el !== checkbox) el.checked = false;
    });
  } else {
    currentSelected = { id: "" };
    document.getElementById('selected-name').innerText = "없음";
  }
};

window.updateStatus = async (value) => {
  if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
  try {
    const docRef = doc(db, "boards", currentSelected.id);
    const updateData = { status: value };
    if (value === '접수에러') updateData.sian = '에러';
    if (value === '무통장' || value === '카드결제') {
      const snap = await getDoc(docRef);
      if (snap.exists() && !snap.data().paidAt) {
        updateData.paidAt = serverTimestamp();
      }
    }
    await updateDoc(docRef, updateData);
    alert("상태 변경 완료: " + value);
    loadRecentOrders();
  } catch (e) {
    alert("업데이트 실패: " + e.message);
  }
};

// 카드전표 jpg URL 저장 (cardjun1 문서 ID = boardId)
window.saveCardUrl = async (id) => {
  const input = document.getElementById('cardurl-' + id);
  const url = input.value.trim();
  if (!url) return alert("전표 URL을 입력해주세요.");
  try {
    await updateDoc(doc(db, "cardjun1", id), { fileUrl: url });
    alert("전표 URL이 저장되었습니다.");
    loadRequestList();
  } catch (e) {
    alert("저장 실패: " + e.message);
  }
};

window.deleteSelectedOrder = async () => {
  if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
  if (!confirm("정말로 이 주문을 삭제하시겠습니까?\n삭제한 주문은 복구할 수 없습니다.")) return;
  try {
    // private 서브컬렉션 + adminOrders 문서까지 같이 정리 (고아 데이터 방지)
    const privSnap = await getDocs(collection(db, "boards", currentSelected.id, "private"));
    await Promise.all(privSnap.docs.map(d => deleteDoc(d.ref)));
    await deleteDoc(doc(db, "adminOrders", currentSelected.id)).catch(() => {});
    await deleteDoc(doc(db, "boards", currentSelected.id));
    alert("주문이 삭제되었습니다.");
    currentSelected = { id: "" };
    document.getElementById('selected-name').innerText = "없음";
    loadRecentOrders();
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
};

async function fetchPrivate(docId) {
  try {
    const snap = await getDoc(doc(db, "adminOrders", docId));
    return snap.exists() ? snap.data() : { _err: "adminOrders 문서 없음" };
  } catch (e) {
    return { _err: (e.code || "") + " " + e.message };
  }
}

async function loadRecentOrders() {
  const resultEl = document.getElementById("result");
  try {
    const q1 = query(collection(db, "boards"), orderBy("createdAt", "desc"), limit(10));
    const snap1 = await getDocs(q1);
    const privates = await Promise.all(snap1.docs.map(d => fetchPrivate(d.id)));

    if (snap1.empty) {
      resultEl.textContent = "주문이 없습니다.";
      return;
    }

    let html = "<table><tr><th></th><th>날짜</th><th>작성자</th><th>연락처</th><th>배송지</th></tr>";
    snap1.docs.forEach((d, idx) => {
      const data = d.data();
      const priv = privates[idx];
      const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('ko-KR') : '-';
      const author = data.author || '-';
      let phone, address;
      if (priv._err) {
        phone = `<span class="fail">⚠️ ${priv._err}</span>`;
        address = '-';
      } else {
        phone = priv.phone || '<span class="fail">(비어있음)</span>';
        address = priv.address || '<span class="fail">(비어있음)</span>';
      }
      const authorEsc = author.replace(/'/g, "\\'");
      html += `<tr><td><input type="checkbox" onchange="toggleSelect(this, '${d.id}', '${authorEsc}')"></td><td>${date}</td><td>${author}</td><td>${phone}</td><td>${address}</td></tr>`;
    });
    html += "</table>";
    resultEl.innerHTML = html;
  } catch (e) {
    resultEl.innerHTML = `<span class="fail">⚠️ 목록 조회 오류: ${e.code || ''} ${e.message}</span>`;
  }
}

// 카드전표(+ 차후 현금영수증/세금계산서) 신청을 한곳에 모아 보여주는 목록.
// 현재는 cardjun1(문서 ID = boardId)만 대상. 나중에 현금영수증/세금계산서용 컬렉션이
// 생기면 아래에 같은 방식으로 쿼리를 추가해서 items 배열에 합치면 됨.
async function loadRequestList() {
  const el = document.getElementById("requestResult");
  try {
    const q2 = query(collection(db, "cardjun1"), orderBy("createdAt", "desc"), limit(20));
    const snap2 = await getDocs(q2);

    const items = [];
    for (const d of snap2.docs) {
      const data = d.data();
      let author = '-';
      try {
        const boardSnap = await getDoc(doc(db, "boards", d.id));
        author = boardSnap.exists() ? (boardSnap.data().author || '-') : '-';
      } catch (e) { /* 조회 실패해도 목록은 계속 표시 */ }
      items.push({ type: '카드전표', boardId: d.id, author, fileUrl: data.fileUrl });
    }

    // TODO: 현금영수증/세금계산서 신청 컬렉션이 생기면 여기서 조회해서 items에 push

    if (items.length === 0) {
      el.textContent = "신청 내역이 없습니다.";
      return;
    }

    let html = "<table><tr><th>종류</th><th>작성자</th><th>상태</th></tr>";
    items.forEach(it => {
      let statusCell;
      if (it.fileUrl) {
        statusCell = `<span class="ok">✅ 발행완료</span> <a href="${it.fileUrl}" target="_blank">보기</a>`;
      } else {
        statusCell = `<span class="pending">🟡 신청중</span><br>
          <input type="text" id="cardurl-${it.boardId}" class="card-url-input" placeholder="전표 jpg URL">
          <button class="card-url-btn" onclick="saveCardUrl('${it.boardId}')">저장</button>`;
      }
      html += `<tr><td>${it.type}</td><td>${it.author}</td><td>${statusCell}</td></tr>`;
    });
    html += "</table>";
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<span class="fail">⚠️ 신청 목록 조회 오류: ${e.code || ''} ${e.message}</span>`;
  }
}
</script>
</body>
</html>
