<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>최근 주문 관리</title>
<style>
  body { font-family: sans-serif; max-width: 1600px; margin: 40px auto; padding: 0 20px; }
  input { box-sizing:border-box; padding:10px; margin:2px 0; border:1px solid #ccc; border-radius:8px; font-size:14px; }
  input.wide { display:block; width:100%; padding:12px; font-size:16px; margin:8px 0; }
  button { padding:12px 24px; background:#1e293b; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px; }
  .table-wrap { overflow-x:auto; margin-top:20px; }
  table { width:100%; min-width:1200px; border-collapse: collapse; font-size:14px; }
  th, td { border:1px solid #e2e8f0; padding:10px 10px; text-align:left; vertical-align: top; white-space:normal; }
  th { background:#f1f5f9; font-size:13px; white-space:nowrap; }
  tbody tr:nth-child(even) { background:#fafbfc; }
  tbody tr:hover { background:#f0f9ff; }
  .fail { color:#991b1b; }
  .ok { color:#166534; font-weight:bold; }
  .author { font-weight:700; }
  .url-row { display:flex; gap:4px; margin-top:4px; }
  .url-row input { flex:0 1 50%; max-width:150px; width:auto; font-size:12px; padding:6px; }
  .url-row button { padding:6px 10px; font-size:12px; white-space:nowrap; }
  .url-saved { font-size:12px; color:#166534; }
  .file-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:12px; white-space:nowrap; }
  .file-row a { color:#2563eb; text-decoration:underline; }
  .small-btn { padding:3px 8px; font-size:11px; background:#dc2626; border-radius:6px; }
  #loginBox { display:block; }
  #listBox { display:none; }
  #ip-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:999; }
  #ip-modal-box { background:#fff; border-radius:10px; padding:20px; width:100%; max-width:280px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  #ip-modal-value { display:block; width:100%; text-align:left; font-family:monospace; font-size:14px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; padding:10px 12px; margin:8px 0 6px; cursor:pointer; word-break:break-all; }
  #ip-modal-copied { display:none; font-size:12px; color:#166534; text-align:center; margin-bottom:8px; }
  #ip-modal-box .close-btn { width:100%; background:#fff; color:#334155; border:1px solid #cbd5e1; padding:8px; font-size:13px; }
  #ip-modal-block-btn { width:100%; background:#dc2626; padding:10px; font-size:13px; margin-bottom:6px; }
  #ip-modal-block-btn.blocked { background:#f8fafc; color:#dc2626; border:1px solid #fca5a5; }
  #ip-modal-status.blocked { color:#dc2626; font-weight:bold; }
  #ip-modal-status.ok { color:#64748b; }
</style>
</head>
<body>

<h2>📦 최근 주문 관리</h2>

<div id="loginBox">
  <input class="wide" id="email" type="email" placeholder="관리자 이메일">
  <input class="wide" id="pw" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인해서 최근 주문 보기</button>
  <div id="loginResult" class="fail" style="margin-top:8px; font-size:14px;"></div>
</div>

<div id="listBox">

  <div id="result">불러오는 중...</div>

  <div style="margin-top:20px; padding:16px; background:#f8fafc; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px;">선택된 주문: <b id="selected-name">없음</b></p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="updateStatus('대기')" style="background:#64748b;">대기</button>
      <button onclick="updateStatus('무통장')" style="background:#059669;">무통장</button>
      <button onclick="updateStatus('카드결제')" style="background:#2563eb;">카드결제</button>
      <button onclick="updateStatus('접수에러')" style="background:#dc2626;">접수에러</button>
      <button onclick="updateStatus('주문취소')" style="background:#1e293b;">주문취소</button>
      <button onclick="deleteSelectedOrder()" style="background:#b91c1c;">주문삭제</button>
      <button onclick="window.open('https://sowonnamoo.github.io/myboard/index1', '_blank', 'width=800,height=900')" style="background:#4f46e5;">✏️ 글쓰기</button>
    </div>
  </div>

  <div style="margin-top:20px; padding:16px; background:#fefce8; border-radius:10px;">
    <p style="margin:0 0 10px; font-size:14px; font-weight:bold;">🧾 현금영수증 최신 신청 목록</p>
    <div id="cashResult">불러오는 중...</div>
  </div>
</div>

<div id="ip-modal-overlay">
  <div id="ip-modal-box">
    <p style="font-size:12px; color:#64748b; margin:0 0 2px;">작성자 IP</p>
    <button id="ip-modal-value" onclick="copyIpValue()"></button>
    <p id="ip-modal-copied">✅ 복사되었습니다</p>
    <p id="ip-modal-status" style="font-size:12px; text-align:center; margin:0 0 8px; display:none;"></p>
    <button id="ip-modal-block-btn" onclick="toggleBlockIp()">🚫 이 IP 차단하기</button>
    <button class="close-btn" onclick="closeIpModal()">닫기</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const config = {
  apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
  authDomain: "board-291e3.firebaseapp.com",
  projectId: "board-291e3",
  storageBucket: "board-291e3.firebasestorage.app",
  messagingSenderId: "25881766316",
  appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};
const app = initializeApp(config);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  document.getElementById("loginBox").style.display = user ? "none" : "block";
  document.getElementById("listBox").style.display = user ? "block" : "none";
  if (user) { loadRecentOrders(); loadCashRequests(); }
});

window.login = async function() {
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) {
    document.getElementById("loginResult").textContent = "로그인 실패: " + e.message;
  }
};

let currentSelected = { id: "" };
// 주문별 private 서브컬렉션 문서 참조를 캐싱 (운송장URL 저장 시 재사용)
let privateRefCache = {};
// 주문 id -> 원본 컬렉션("boards" 일반주문 / "jjjj" 재주문) 매핑 (재주문건도 같이 다루기 위함)
let orderColMap = {};

// 세금계산서(segum1) 문서 ID 계산 - app.js/segum.html과 완전히 동일한 방식이어야
// 같은 사람이면 같은 ID가 나옴 (이름 + 전화번호 전체자리 해싱)
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function normalizeName(name) { return String(name || "").trim(); }
function normalizePhoneFull(phone) { return String(phone || "").replace(/[^0-9]/g, ""); }
async function computeSegumId(name, phone) {
  return sha256Hex(`segum::${normalizeName(name)}::${normalizePhoneFull(phone)}`);
}
async function fetchSegumMatch(author, phone) {
  try {
    const segumId = await computeSegumId(author, phone);
    const snap = await getDoc(doc(db, "segum1", segumId));
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    return null;
  }
}
// boardId -> segum1 등록 정보 캐시 (아이콘 클릭 시 재조회 없이 바로 보여주기 위함)
let taxDataMap = {};
// boardId -> 이 주문건의 세금계산서 발행 여부 캐시 (버튼 토글/정렬에 사용)
let taxIssuedMap = {};
// boardId -> boards/{id}/private 문서 데이터 캐시 (세금계산서 버튼을 나중에 눌렀을 때 taxIssued 조회용)
let rawPrivDataMap = {};
// boardId -> 주문서(메모장 텍스트) 생성에 필요한 데이터 캐시
let orderSheetDataMap = {};
// boardId -> 접수 시 첨부된 원본 파일 URL들 (boards/{boardId}.file1Url / file2Url)
let attachedFileMap = {};
// boardId -> 고객이 재첨부한 파일 목록 [{id, fileUrl}] (boards/{boardId}/hanjool/*)
let hanjoolMap = {};

// 상태값별 표시 색상
function statusColor(status) {
  switch (status) {
    case '대기': return '#64748b';
    case '무통장': return '#059669';
    case '카드결제': return '#2563eb';
    case '접수에러': return '#dc2626';
    case '주문취소': return '#1e293b';
    default: return '#334155';
  }
}

// 날짜를 "2026 8/16 12:48" 형식으로 변환 (0-padding 없이 그대로)
function formatOrderSheetDate(d) {
  if (!d) return '-';
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${y} ${m}/${day} ${hh}:${mi}`;
}

// 주문서(메모장) 다운로드
window.downloadOrderSheet = (boardId) => {
  const o = orderSheetDataMap[boardId];
  if (!o) { alert('주문 정보를 찾을 수 없습니다.'); return; }

  const priceDigits = String(o.price || '').replace(/[^0-9]/g, '') || '0';
  const messageLine = (o.message && o.message.trim()) ? o.message.trim() : '-';

  const content = [
    `${o.author}${o.phone}`,
    o.address || '-',
    `상품: ${o.productName} / 사이즈: ${o.size} / 수량: ${o.quantity}`,
    `금액: ${priceDigits}원`,
    `접수일: ${formatOrderSheetDate(o.createdAtDate)}`,
    `[메시지]`,
    messageLine
  ].join('\r\n');

  // 윈도우 메모장에서 한글이 안 깨지도록 UTF-8 BOM을 붙임
  const blob = new Blob(["\ufeff" + content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  const dateCode = o.createdAtDate
    ? `${o.createdAtDate.getFullYear()}${String(o.createdAtDate.getMonth()+1).padStart(2,'0')}${String(o.createdAtDate.getDate()).padStart(2,'0')}_${String(o.createdAtDate.getHours()).padStart(2,'0')}${String(o.createdAtDate.getMinutes()).padStart(2,'0')}`
    : 'unknown';
  a.download = `주문서_${o.author}_${dateCode}.txt`;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
window.showTaxInfo = (boardId) => {
  const t = taxDataMap[boardId];
  if (!t) return;
  alert(
    `📋 세금계산서 등록 정보\n\n` +
    `상호명: ${t.bizName || '-'}\n` +
    `사업자등록번호: ${t.bizNum || '-'}\n` +
    `업태/종목: ${t.bizType || '-'} / ${t.bizItem || '-'}\n` +
    `이메일: ${t.email || '-'}\n` +
    `담당자: ${t.manager || '-'} (${t.managerPhone || '-'})`
  );
};

// ============= 작성자 IP 확인/복사/차단 모달 =============
// index1(고객 글쓰기)의 app.js가 접속 시 이 컬렉션(blocked_ips, 문서ID=IP)을 조회해서
// 차단된 IP면 접수하기 버튼을 숨기고, 클릭해도 저장을 막습니다. 여기서는 그 목록에 추가/제거만 합니다.
let currentModalIp = '';

window.showIpModal = async (ip) => {
  const overlay = document.getElementById('ip-modal-overlay');
  const valueBtn = document.getElementById('ip-modal-value');
  const copiedText = document.getElementById('ip-modal-copied');
  const statusText = document.getElementById('ip-modal-status');
  const blockBtn = document.getElementById('ip-modal-block-btn');

  currentModalIp = ip || '';
  valueBtn.textContent = ip || '(IP 정보 없음)';
  copiedText.style.display = 'none';
  overlay.style.display = 'flex';

  if (!ip) {
    blockBtn.style.display = 'none';
    statusText.style.display = 'none';
    return;
  }
  blockBtn.style.display = 'block';
  blockBtn.disabled = true;
  blockBtn.textContent = '확인 중...';
  statusText.style.display = 'none';

  try {
    const snap = await getDoc(doc(db, "blocked_ips", ip));
    renderBlockState(snap.exists());
  } catch (e) {
    blockBtn.disabled = false;
    blockBtn.textContent = '🚫 이 IP 차단하기';
    statusText.textContent = '차단 상태 확인 실패: ' + e.message;
    statusText.className = '';
    statusText.style.display = 'block';
  }
};

function renderBlockState(isBlocked) {
  const statusText = document.getElementById('ip-modal-status');
  const blockBtn = document.getElementById('ip-modal-block-btn');
  blockBtn.disabled = false;
  if (isBlocked) {
    blockBtn.textContent = '✅ 차단 해제하기';
    blockBtn.classList.add('blocked');
    statusText.textContent = '⚠️ 현재 차단된 IP입니다 — 이 IP는 글쓰기(접수하기)가 불가능합니다.';
    statusText.className = 'blocked';
  } else {
    blockBtn.textContent = '🚫 이 IP 차단하기';
    blockBtn.classList.remove('blocked');
    statusText.textContent = '현재 차단되어 있지 않습니다.';
    statusText.className = 'ok';
  }
  statusText.style.display = 'block';
}

window.toggleBlockIp = async () => {
  const ip = currentModalIp;
  if (!ip) return;
  const blockBtn = document.getElementById('ip-modal-block-btn');
  const isCurrentlyBlocked = blockBtn.classList.contains('blocked');

  if (isCurrentlyBlocked) {
    if (!confirm(`이 IP(${ip})의 차단을 해제하시겠습니까?\n해제하면 이 IP에서 다시 글쓰기(접수)가 가능해집니다.`)) return;
    blockBtn.disabled = true;
    try {
      await deleteDoc(doc(db, "blocked_ips", ip));
      renderBlockState(false);
    } catch (e) {
      alert('차단 해제 실패: ' + e.message);
      blockBtn.disabled = false;
    }
  } else {
    if (!confirm(`⚠️ 경고\n이 IP(${ip})를 차단하시겠습니까?\n\n차단하면 이 IP로 접속한 사용자는 글쓰기(접수하기) 버튼이 사라지고, 새 주문을 접수할 수 없게 됩니다.\n같은 IP를 쓰는 다른 사용자(예: 회사/공용 와이파이)도 함께 막힐 수 있으니 신중히 진행해주세요.`)) return;
    blockBtn.disabled = true;
    try {
      await setDoc(doc(db, "blocked_ips", ip), {
        blockedAt: serverTimestamp(),
        blockedBy: auth.currentUser ? (auth.currentUser.email || '') : ''
      });
      renderBlockState(true);
    } catch (e) {
      alert('차단 실패: ' + e.message);
      blockBtn.disabled = false;
    }
  }
};

window.copyIpValue = async () => {
  const valueBtn = document.getElementById('ip-modal-value');
  const ip = valueBtn.textContent;
  if (!ip || ip === '(IP 정보 없음)') return;
  try {
    await navigator.clipboard.writeText(ip);
    document.getElementById('ip-modal-copied').style.display = 'block';
  } catch (e) {
    alert('복사에 실패했습니다. 직접 선택해서 복사해주세요.');
  }
};
window.closeIpModal = () => {
  document.getElementById('ip-modal-overlay').style.display = 'none';
};

// 세금계산서 발행 여부는 (운송장URL과 동일하게) 이 주문의 private 문서에 저장 - 관리자만 수정 가능
// 목록 전체를 다시 불러오지 않고, 해당 셀만 즉시 갱신합니다 (읽기 절약).
window.toggleTaxIssued = async (boardId) => {
  const ref = privateRefCache[boardId];
  if (!ref) return alert("이 주문의 개인정보(private) 문서를 찾지 못했습니다. 새로고침 후 다시 시도해주세요.");
  const newVal = !taxIssuedMap[boardId];
  try {
    await updateDoc(ref, { taxIssued: newVal });
    taxIssuedMap[boardId] = newVal;
    renderTaxCell(boardId);
  } catch (e) {
    alert("상태 변경 실패: " + e.message);
  }
};

// 세금계산서 매칭 확인 버튼을 눌렀을 때만 segum1을 조회합니다 (읽기 절약 - 예전엔 목록 로딩 시 10건 전부 자동 조회했음)
window.checkTaxMatch = async (boardId) => {
  const cell = document.getElementById('tax-cell-' + boardId);
  if (!cell) return;
  cell.innerHTML = '<span style="font-size:11px; color:#94a3b8;">확인 중...</span>';

  const o = orderSheetDataMap[boardId];
  if (!o) { cell.innerHTML = '<span style="font-size:11px; color:#dc2626;">확인 실패</span>'; return; }

  try {
    const tax = await fetchSegumMatch(o.author, o.phone);
    if (!tax) {
      cell.innerHTML = '<span style="font-size:11px; color:#94a3b8;">등록 정보 없음</span>';
      return;
    }
    taxDataMap[boardId] = tax;
    const rawPriv = rawPrivDataMap[boardId] || {};
    taxIssuedMap[boardId] = !!rawPriv.taxIssued;
    renderTaxCell(boardId);
  } catch (e) {
    cell.innerHTML = '<span style="font-size:11px; color:#dc2626;">확인 실패</span>';
  }
};

// 🧾 아이콘 + 발행상태 버튼을 tax-cell-{boardId}에 그려주는 공통 헬퍼
function renderTaxCell(boardId) {
  const cell = document.getElementById('tax-cell-' + boardId);
  if (!cell) return;
  const issued = !!taxIssuedMap[boardId];
  const btnLabel = issued ? '✅ 발행완' : '🔴 미발행';
  const btnStyle = issued ? 'background:#166534;' : 'background:#dc2626;';
  cell.innerHTML = `<span style="cursor:pointer; font-size:16px;" title="세금계산서 신청됨 - 클릭해서 정보 보기" onclick="showTaxInfo('${boardId}')">🧾</span>
    <button onclick="toggleTaxIssued('${boardId}')" style="${btnStyle} padding:3px 6px; font-size:11px; margin-left:4px;">${btnLabel}</button>`;
}

// 표를 5개까지만 먼저 보여주고, 나머지는 "펼쳐보기" 버튼으로 펼치게 만드는 공통 헬퍼
function buildExpandableTable(headerRowHtml, rowsHtml, keyPrefix) {
  const visible = rowsHtml.slice(0, 5).join('');
  const rest = rowsHtml.slice(5);
  let html = `<div class="table-wrap"><table><thead>${headerRowHtml}</thead><tbody>${visible}</tbody>`;
  if (rest.length > 0) {
    html += `<tbody id="${keyPrefix}-more" style="display:none">${rest.join('')}</tbody>`;
  }
  html += `</table></div>`;
  if (rest.length > 0) {
    html += `<button id="${keyPrefix}-toggle-btn" data-label="펼쳐보기 (${rest.length}건 더보기)" onclick="toggleMore('${keyPrefix}')" style="margin-top:8px; background:#e2e8f0; color:#1e293b; padding:8px 16px; font-size:13px;">펼쳐보기 (${rest.length}건 더보기)</button>`;
  }
  return html;
}

window.toggleMore = (keyPrefix) => {
  const more = document.getElementById(keyPrefix + '-more');
  const btn = document.getElementById(keyPrefix + '-toggle-btn');
  if (!more || !btn) return;
  const isHidden = more.style.display === 'none';

};

window.toggleSelect = (checkbox, id, author) => {

// 관리자 전용 phone/address 조회 (기존과 동일, adminOrders 사용)
async function fetchPrivate(docId) {
  try {
    const snap = await getDoc(doc(db, "adminOrders", docId));
    return snap.exists() ? snap.data() : { _err: "adminOrders 문서 없음" };

}

// 운송장URL은 고객 본인만 볼 수 있는 boards/{id}/private 문서에 저장합니다.
// isAdmin()은 list 권한이 있어서, secretId를 몰라도 그 주문의 private 문서를 찾아올 수 있습니다.
async function fetchPrivateRef(boardId, col) {
  try {
    const snap = await getDocs(collection(db, col || "boards", boardId, "private"));
    if (snap.empty) return null;
    const d = snap.docs[0];
    privateRefCache[boardId] = d.ref;
    return d.data();
  } catch (e) {
    return null;
  }
}

// R2 워커는 업로드 후 `.../?name=파일명` 형태(쿼리스트링)의 URL을 돌려줌.
// 삭제도 같은 워커에 DELETE + ?name=파일명으로 요청함 (워커 코드로 확인 완료).
async function deleteFromR2(fileUrl) {
  try {
    const key = new URL(fileUrl).searchParams.get('name');
    if (!key) return;
    await fetch(`https://r2.ecogr.workers.dev/?name=${encodeURIComponent(key)}`, { method: 'DELETE' });
  } catch (e) {
    console.error('R2 파일 삭제 시도 실패(무시하고 계속 진행):', e);
  }
}

// 고객이 index2에서 파일을 첨부하면 boards/{id}.fileLocked = true 로 잠김.
// 관리자가 카페24에 새 시안을 등록한 뒤 여기서 눌러야, 이전 수정요청(첨부파일/텍스트)이
// R2/파이어베이스 양쪽에서 삭제되고, 고객 화면에는 "재업로드 되었습니다" 안내가 뜨며,
// 파일 재첨부도 다시 가능해짐.
window.unlockFileUpload = async (boardId) => {
  if (!confirm("새 시안을 등록하셨나요?\n확인을 누르면 고객이 남긴 첨부파일/수정요청 내용이 삭제되고, 다시 파일을 첨부할 수 있게 됩니다.")) return;
  try {
    const col = orderColMap[boardId] || "boards";
    const hanjoolSnap = await getDocs(collection(db, col, boardId, "hanjool"));
    // 1. R2에 올라간 실제 파일 삭제 시도 (best-effort)
    await Promise.all(hanjoolSnap.docs.map(d => {
      const data = d.data();
      return data.fileUrl ? deleteFromR2(data.fileUrl) : Promise.resolve();
    }));
    // 2. 파이어베이스의 수정요청(텍스트/파일 참조) 문서 삭제
    await Promise.all(hanjoolSnap.docs.map(d => deleteDoc(d.ref)));
    // 3. 잠금 해제 + "재업로드 되었습니다" 안내를 위한 시각 기록
    await updateDoc(doc(db, col, boardId), { fileLocked: false, sianRefreshedAt: serverTimestamp() });
    loadRecentOrders();
  } catch (e) {
    alert("잠금 해제 실패: " + e.message);
  }
};

// 접수 시 올라온 원본 첨부파일 삭제 (R2 파일 + boards.file1Url/file2Url 필드)
window.deleteAttachedFile = async (boardId, slot) => {
  const files = attachedFileMap[boardId] || {};
  const field = slot === 1 ? 'file1Url' : 'file2Url';
  const fileUrl = files[field];
  if (!fileUrl) return alert("삭제할 첨부파일이 없습니다.");
  if (!confirm(`첨부파일 ${slot}을(를) 삭제하시겠습니까?\n삭제한 파일은 복구할 수 없습니다.`)) return;
  try {
    const col = orderColMap[boardId] || "boards";
    await deleteFromR2(fileUrl);
    await updateDoc(doc(db, col, boardId), { [field]: deleteField() });
    loadRecentOrders();
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
};

// 고객이 재첨부한 파일 삭제 (R2 파일 + hanjool 문서). 마지막 재첨부 파일까지 지우면
// 자동으로 fileLocked를 해제해서 고객이 다시 첨부할 수 있게 함.
window.deleteHanjoolFile = async (boardId, memoId) => {
  const items = hanjoolMap[boardId] || [];
  const item = items.find(it => it.id === memoId);
  if (!confirm("재첨부된 파일을 삭제하시겠습니까?\n삭제한 파일은 복구할 수 없습니다.")) return;
  try {
    const col = orderColMap[boardId] || "boards";
    if (item && item.fileUrl) await deleteFromR2(item.fileUrl);
    await deleteDoc(doc(db, col, boardId, "hanjool", memoId));

      await updateDoc(doc(db, col, boardId), { fileLocked: false, sianRefreshedAt: serverTimestamp() });

};

// 목록(boards+jjjj 기본 문서)만 조회해서 정렬해둔 캐시. 펼쳐보기 시 여기서 잘라서 씁니다.
let orderBaseItems = [];
// "펼쳐보기"를 눌러 나머지 항목의 상세정보(private/adminOrders/hanjool)를 이미 조회했는지 여부.
// 한 번 조회한 뒤에는 접었다 펼쳐도 재조회하지 않습니다.
let orderMoreLoaded = false;
const ORDERS_INITIAL_COUNT = 5;

async function loadRecentOrders() {
  const resultEl = document.getElementById("result");
  try {
    // 1단계: boards(일반 주문) + jjjj(재주문/재구입) 기본 문서만 조회해서 합친 뒤 작성일 기준 정렬합니다.
    // 여기서는 아직 개별 항목의 private/adminOrders/hanjool 같은 상세 조회는 하지 않습니다 (읽기 절약).
    const q1 = query(collection(db, "boards"), orderBy("createdAt", "desc"), limit(500));
    const q2 = query(collection(db, "jjjj"), orderBy("createdAt", "desc"), limit(500));
    const [snap1, snap2] = await Promise.all([getDocs(q1), getDocs(q2)]);

    // 어드민 라이트(admin-write.js)에서 등록한 글(createdByAdmin: true)은
    // 퀵체크 목록에서 제외합니다. (접수오류건 시안 페이지에서만 관리)
    const combined = [
      ...snap1.docs.filter(d => !d.data().createdByAdmin).map(d => ({ doc: d, col: "boards", isJajoo: false })),
      ...snap2.docs.map(d => ({ doc: d, col: "jjjj", isJajoo: true }))
    ];
    combined.sort((a, b) => {
      const ta = a.doc.data().createdAt?.toDate ? a.doc.data().createdAt.toDate() : new Date(0);
      const tb = b.doc.data().createdAt?.toDate ? b.doc.data().createdAt.toDate() : new Date(0);
      return tb - ta;
    });
    orderBaseItems = combined.slice(0, 500);
    orderMoreLoaded = false;

    if (orderBaseItems.length === 0) {
      resultEl.textContent = "주문이 없습니다.";
      return;
    }

    // 2단계: 화면에 바로 보일 상위 5건에 대해서만 상세정보를 조회해서 행을 만듭니다.
    // 나머지(최대 495건)는 아래 "펼쳐보기" 버튼을 실제로 눌렀을 때만 그 시점에 조회합니다.
    const firstItems = orderBaseItems.slice(0, ORDERS_INITIAL_COUNT);
    const firstRows = await buildOrderRows(firstItems);

    if (firstRows.length === 0) {
      resultEl.textContent = "표시할 주문이 없습니다.";
      return;
    }

    const restCount = orderBaseItems.length - firstItems.length;
    let html = `<div class="table-wrap"><table><thead>
      <tr><th>상태</th><th></th><th>주문서</th><th>첨부파일</th><th>날짜</th><th>작성자</th><th>연락처</th><th>배송지</th><th>운송장URL</th><th>카드전표URL</th><th>IP</th></tr>
      </thead><tbody id="orders-body">${firstRows.join('')}</tbody>
      <tbody id="orders-body-more" style="display:none"></tbody>
      </table></div>`;
    if (restCount > 0) {
      html += `<button id="orders-toggle-btn" data-label="펼쳐보기 (${restCount}건 더보기)" onclick="toggleMoreOrders()" style="margin-top:8px; background:#e2e8f0; color:#1e293b; padding:8px 16px; font-size:13px;">펼쳐보기 (${restCount}건 더보기)</button>`;
    }
    resultEl.innerHTML = html;
  } catch (e) {
    resultEl.innerHTML = `<span class="fail">⚠️ 목록 조회 오류: ${e.code || ''} ${e.message}</span>`;
  }
}

// 펼쳐보기 버튼: 처음 클릭했을 때만 나머지 항목들의 상세정보를 조회하고, 이후에는 접기/펼치기만 토글합니다.
window.toggleMoreOrders = async () => {
  const btn = document.getElementById('orders-toggle-btn');
  const moreBody = document.getElementById('orders-body-more');
  if (!btn || !moreBody) return;

  if (!orderMoreLoaded) {
    btn.disabled = true;
    btn.textContent = '불러오는 중...';
    try {
      const restItems = orderBaseItems.slice(ORDERS_INITIAL_COUNT);
      const restRows = await buildOrderRows(restItems);
      moreBody.innerHTML = restRows.join('');
      orderMoreLoaded = true;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '펼쳐보기 (다시 시도)';
      alert('추가 목록 조회 실패: ' + e.message);
      return;
    }
  }

  const isHidden = moreBody.style.display === 'none';
  moreBody.style.display = isHidden ? 'table-row-group' : 'none';
  btn.disabled = false;
  btn.textContent = isHidden ? '접기' : btn.dataset.label;
};

// 주문 항목 배열(items)을 받아 private/adminOrders/hanjool 상세정보를 조회하고 <tr> HTML 배열을 만듭니다.
// 이 함수가 호출되는 시점에만 개별 문서 조회가 발생하므로, 처음 5건 / 펼쳐보기 클릭 시 나머지 건에만 각각 호출됩니다.
async function buildOrderRows(items) {
  if (items.length === 0) return [];

  // adminOrders는 일반 주문(boards)에만 존재하므로, 재주문(jjjj)건은 이 조회를 건너뜁니다.
  const adminPrivates = await Promise.all(items.map(it => it.col === "boards" ? fetchPrivate(it.doc.id) : Promise.resolve({})));
  const rawPrivates = await Promise.all(items.map(it => fetchPrivateRef(it.doc.id, it.col)));
  // 각 주문의 재첨부(hanjool) 파일 목록도 함께 조회
  // jjjj(재주문)에는 hanjool 서브컬렉션 보안규칙이 없어서(재주문건은 재첨부 기능 대상이 아님)
  // 조회 시도 자체가 permission-denied를 일으킵니다. boards건만 조회합니다.
  const hanjoolSnaps = await Promise.all(items.map(it =>
    it.col === "boards" ? getDocs(collection(db, it.col, it.doc.id, "hanjool")) : Promise.resolve({ docs: [] })
  ));
  // 세금계산서(segum1) 매칭은 더 이상 여기서 자동 조회하지 않습니다.
  // 예전엔 목록 로딩 시 전부 미리 조회해서 미발행 건을 상단 고정했지만,
  // 지금은 각 행의 "🧾 확인" 버튼을 눌렀을 때만 조회합니다 (checkTaxMatch 참고).

  const rows = [];
  items.forEach((it, idx) => {
    const d = it.doc;
    const col = it.col;
    orderColMap[d.id] = col;
    const adminPriv = adminPrivates[idx];
    const data = d.data();
    const rawPriv = rawPrivates[idx] || {};
    const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('ko-KR') : '-';
    const author = data.author || '-';
    const status = data.status || '대기';

    // 고객이 "배송지 수정하기"로 boards/{id}.phone/address를 직접 고쳤을 수 있으므로,
    // 그 값이 있으면 최우선으로 쓰고, 없으면 adminOrders → boards/private 순으로 대체합니다.
    let phone, address;
    let rawAddressVal = '';
    if (data.phone || data.address) {
      phone = data.phone || '<span class="fail">(비어있음)</span>';
      rawAddressVal = data.address || '';
      address = rawAddressVal || '<span class="fail">(비어있음)</span>';
    } else {
      // 재주문(jjjj)건은 adminOrders가 없으므로 private 서브컬렉션(rawPriv)에서 바로 가져옵니다.
      // adminOrders 문서 자체가 없는 경우(adminPriv._err)도 에러 문구를 띄우지 않고
      // rawPriv로 대체 조회하며, 그래도 주소가 없으면 아래에서 목록에서 제외됩니다.
      const fallback = (col === 'boards' && !adminPriv._err) ? adminPriv : rawPriv;
      phone = fallback.phone || '<span class="fail">(비어있음)</span>';
      rawAddressVal = fallback.address || '';
      address = rawAddressVal || '<span class="fail">(비어있음)</span>';
    }

    // 배송지가 비어있는 주문(adminOrders/private 어디에도 address가 없는 경우)은 목록에서 제외
    if (!rawAddressVal) return;

    // 주문서(메모장) 다운로드용 원본 데이터 저장 (boards 직접수정 > adminOrders > boards/private 순으로 대체)
    const sheetPhone = data.phone || ((!adminPriv._err && adminPriv.phone) ? adminPriv.phone : (rawPriv.phone || ''));
    const sheetAddress = data.address || ((!adminPriv._err && adminPriv.address) ? adminPriv.address : (rawPriv.address || ''));
    const sheetMessage = (!adminPriv._err && adminPriv.message) ? adminPriv.message : (rawPriv.message || '');
    orderSheetDataMap[d.id] = {
      author,
      phone: sheetPhone,
      address: sheetAddress,
      message: sheetMessage,
      productName: data.productName || '-',
      size: data.size || '-',
      quantity: data.quantity || '-',
      price: data.price || '',
      createdAtDate: data.createdAt?.toDate ? data.createdAt.toDate() : null
    };

    const authorEsc = author.replace(/'/g, "\\'");
    const existingTracking = rawPriv.trackingUrl || '';
    const trackingCell = existingTracking
      ? `<span class="url-saved">✅ 등록됨</span><div class="url-row"><input id="track-${d.id}" value="${existingTracking.replace(/"/g,'&quot;')}"><button onclick="saveTrackingUrl('${d.id}')">수정</button></div>`
      : `<div class="url-row"><input id="track-${d.id}" placeholder="운송장 URL"><button onclick="saveTrackingUrl('${d.id}')">저장</button></div>`;

    // 카드결제 상태일 때만 카드전표 URL 입력칸 표시
    let cardCell = '-';
    if (status === '카드결제') {
      cardCell = `<div class="url-row"><input id="card-${d.id}" placeholder="카드전표 URL"><button onclick="saveCardReceiptUrl('${d.id}')">저장</button></div>`;
    }

    // 세금계산서 확인/발행상태 버튼 - "🧾 확인" 클릭 시에만 segum1을 조회합니다 (checkTaxMatch).
    rawPrivDataMap[d.id] = rawPriv;
    const taxIconCell = `<span id="tax-cell-${d.id}"><button onclick="checkTaxMatch('${d.id}')" style="padding:3px 6px; font-size:11px; background:#64748b; color:white; border:none; border-radius:4px; cursor:pointer;">🧾 확인</button></span>`;

    const authorCell = `<span class="author">${it.isJajoo ? '📦 재주문 ' : ''}${author}</span>`;

    // 원본 첨부파일(접수 시 boards.file1Url/file2Url) + 재첨부 파일(hanjool) 목록으로 다운로드/삭제 버튼 구성
    attachedFileMap[d.id] = { file1Url: data.file1Url || '', file2Url: data.file2Url || '' };
    const hanjoolItems = hanjoolSnaps[idx].docs.map(hd => ({ id: hd.id, fileUrl: hd.data().fileUrl || '' })).filter(it => it.fileUrl);
    hanjoolMap[d.id] = hanjoolItems;

    let attachHtml = '';
    if (it.isJajoo && data.imgCode) {
      // 재주문건은 새로 첨부한 파일이 아니라 기존 주문의 이미지 번호(designNo)를 그대로 재사용합니다.
      // photo1.html 같은 뷰어 페이지로 보내는 대신, 실제 이미지 파일(cafe24)로 바로 연결해서
      // 버튼 클릭 한 번으로 다운로드/저장할 수 있게 합니다. (삭제 버튼 없음)
      const jajooImgUrl = `https://sowonnamoo1005.cafe24.com/1/${encodeURIComponent(data.imgCode)}.jpg`;
      attachHtml += `<div class="file-row">🖼️ <a href="${jajooImgUrl}" target="_blank" download="재주문_${data.imgCode}.jpg" class="small-btn" style="background:#2563eb; color:#fff; text-decoration:none; display:inline-block;">재주문 이미지 다운로드</a></div>`;
    }
    if (data.file1Url) {
      attachHtml += `<div class="file-row">📎 <a href="${data.file1Url}" target="_blank">첨부파일1 다운로드</a> <button class="small-btn" onclick="deleteAttachedFile('${d.id}',1)">삭제</button></div>`;
    }
    if (data.file2Url) {
      attachHtml += `<div class="file-row">📎 <a href="${data.file2Url}" target="_blank">첨부파일2 다운로드</a> <button class="small-btn" onclick="deleteAttachedFile('${d.id}',2)">삭제</button></div>`;
    }
    hanjoolItems.forEach((item, i) => {
      const label = hanjoolItems.length > 1 ? `재첨부${i + 1}` : '재첨부';
      attachHtml += `<div class="file-row">🔁 <a href="${item.fileUrl}" target="_blank">${label} 다운로드</a> <button class="small-btn" onclick="deleteHanjoolFile('${d.id}','${item.id}')">삭제</button></div>`;
    });
    // app2.js의 자동 재업로드 감지(checkImageRefreshAndCleanup)는 cafe24가
    // Last-Modified/ETag 헤더를 CORS로 내려줄 때만 동작하고, 대부분의 정적 서버는
    // 이 헤더를 막고 있어서 조용히 실패합니다. 그래서 여기 수동 버튼을 항상 노출해서
    // 확실하게 처리할 수 있게 합니다. (수정요청/첨부파일이 있거나 fileLocked 상태일 때만)
    if (col === "boards" && (hanjoolItems.length > 0 || data.fileLocked)) {
      attachHtml += `<div class="file-row"><button class="small-btn" style="background:#f97316;" onclick="unlockFileUpload('${d.id}')">🔓 새 시안 등록함(수정요청 삭제)</button></div>`;
    }
    if (!attachHtml) attachHtml = '<span style="color:#94a3b8;">-</span>';

    const statusCellHtml = `<span style="color:${statusColor(status)}; font-weight:700;">${status}</span>`;

    rows.push(`<tr${it.isJajoo ? ' style="background:#fff7ed;"' : ''}>
      <td>${statusCellHtml}<br>${taxIconCell}</td>
      <td><input type="checkbox" onchange="toggleSelect(this, '${d.id}', '${authorEsc}')"></td>
      <td><button onclick="downloadOrderSheet('${d.id}')" style="padding:3px 8px; font-size:11px; background:#334155; color:white; border:none; border-radius:4px; cursor:pointer;">📄 주문서</button></td>
      <td>${attachHtml}</td>
      <td>${date}</td>
      <td>${authorCell}</td>
      <td>${phone}</td>
      <td>${address}</td>
      <td>${trackingCell}</td>
      <td>${cardCell}</td>
      <td><button onclick="showIpModal('${(data.ip || '').replace(/'/g, "\\'")}')" style="padding:5px 10px; font-size:11px; background:#334155; color:white; border:none; border-radius:6px; cursor:pointer;">IP</button></td>
    </tr>`);
  });

  return rows;
}
</script>
</body>
</html>
