<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 min-h-screen flex items-center justify-center text-white">
    <h2 id="status-text" class="text-xl font-bold">결제가 완료되었습니다!</h2>

    <script>
        // ---- 안내 및 자동 닫기 전용 화면 ----
        // 실제 주문 상태(대기 → 카드결제) 변경은 더 이상 여기서 하지 않습니다.
        // payment.html이 결제 성공 직후 window.opener로 postMessage('PAYMENT_SUCCESS')를 보내고,
        // 그걸 app.js가 받아서 "지금 보고 있던 그 주문(currentViewId)"만 정확히 업데이트합니다.
        // (여기서 가격만 보고 아무 '대기' 주문이나 골라 바꾸던 기존 방식은 오매칭 위험이 있어 제거했습니다.)
        //
        // 이 페이지는 결제창(payment.html)이 최상위 창을 이동시키면서 잠깐 보여주는
        // "결제 완료" 안내 화면 역할만 하고, 잠시 후 스스로 닫힙니다.
        setTimeout(() => {
            window.close();
        }, 1500);
    </script>
</body>
</html>
