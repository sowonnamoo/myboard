<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<title>간이영수증</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @page { size: 90mm 200mm; margin: 0; }
        body { margin: 0; padding: 5px; font-family: sans-serif; }
        
        .receipt-box { 
            width: 85mm; height: 195mm; 
            border: 3px solid #1e40af; 
            padding: 10px; display: flex; flex-direction: column;
        }
        
        .receipt-table { border-collapse: collapse; width: 100%; border: 2px solid #1e40af; }
        .receipt-table th, .receipt-table td { border: 1px solid #1e40af; padding: 8px 4px; text-align: center; font-size: 11px; }
        .header-bg { background-color: #eff6ff; }
    </style>
</head>
<body>

    <div class="receipt-box">
        <div class="text-center mb-4">
            <h1 class="text-3xl font-bold text-blue-900 border-b-2 border-blue-900 pb-2">간이영수증</h1>
        </div>
      <table class="receipt-table mb-4">
    <tr>
        <th class="header-bg w-1/4">사업자번호</th>
        <td colspan="3">411-13-76734</td>
    </tr>
    <tr>
        <th class="header-bg w-1/4">상호</th>
        <td class="w-1/4">에코그래픽스</td>
        <th class="header-bg w-1/4">대표</th>
        <td class="w-1/4">최대환</td>
    </tr>
    <tr>
        <th class="header-bg w-[15%]">업태</th>
        <td class="w-[30%]">기술서비스</td>
        <th class="header-bg w-[15%]">종목</th>
        <td class="relative w-[40%]">
            <div class="flex items-center">
                <span>광고, 인쇄대행</span>
                <img src="https://sowonnamoo1005.cafe24.com/1/26060110.png?456" alt="인감" 
                     class="h-24 w-24 object-contain absolute right-2 -top-10 opacity-90">
            </div>
        </td>
    </tr>
</table>

        <div id="item-table-wrap" class="flex-grow mb-4" style="overflow:hidden;">
        <table class="receipt-table" id="item-table">
            <thead class="header-bg font-bold">
                <tr>
                    <th class="w-[20%]">월일</th> <th class="w-[30%]">품명</th>
                    <th class="w-[15%]">규격</th>
                    <th class="w-[15%]">수량</th>
                    <th class="w-[20%]">금액</th>
                </tr>
            </thead>
            <tbody id="print-tbody">
                </tbody>
        </table>
        </div>

        <div class="mt-auto">
            <div class="text-right text-lg font-bold border-t-2 border-blue-900 pt-3">
                합계 ₩ <span id="total-price">0</span>원
            </div>
            <p class="text-[10px] text-center mt-4">발행/ <span id="print-date"></span></p>
        </div>
    </div>

  <script>
        const params = new URLSearchParams(window.location.search);
        const product = params.get('product') || '-';
        const size = params.get('size') || '-';
        const qty = params.get('qty') || '1';
        const price = parseInt(params.get('price')) || 0;
        
        // URL에서 날짜 정보 가져오기 (없으면 오늘 날짜 사용)
        const dateStr = params.get('date') || `${new Date().getFullYear()}년 ${new Date().getMonth() + 1}월 ${new Date().getDate()}일`;

        // 발행일 및 테이블 날짜 적용
        document.getElementById('print-date').innerText = dateStr;
        document.getElementById('total-price').innerText = price.toLocaleString();
        
        const tbody = document.getElementById('print-tbody');
        tbody.innerHTML = `
            <tr class="h-10">
                <td>${dateStr}</td> 
                <td class="font-bold">${product}</td>
                <td>${size}</td>
                <td>${qty}</td>
                <td class="font-bold">${price.toLocaleString()}</td>
            </tr>
        `;

        for(let i=0; i<8; i++) {
            tbody.innerHTML += `<tr class="h-10"><td></td><td></td><td></td><td></td><td></td></tr>`;
        }

        // 내용(특히 '규격' 칸처럼 텍스트가 길어지는 항목)이 많아지면 품목 표가 넘쳐서
        // 박스(195mm) 아래로 밀려나던 문제 해결.
        // 제목/상단 정보표/합계는 원래 크기 그대로 두고, 품목 표(item-table-wrap) 부분만
        // "박스 전체 높이 - 나머지 요소들 높이"로 계산한 실제 남는 공간에 맞춰 세로로만 축소합니다.
        // 이렇게 하면 바깥 굵은 테두리와 합계 위치는 항상 박스 맨 아래(195mm)에 그대로 유지됩니다.
        function outerHeight(el) {
            const s = getComputedStyle(el);
            return el.offsetHeight + parseFloat(s.marginTop || 0) + parseFloat(s.marginBottom || 0);
        }

        function fitItemTableToRemainingSpace() {
            const box = document.querySelector('.receipt-box');
            const wrap = document.getElementById('item-table-wrap');
            const table = document.getElementById('item-table');

            // 재계산 대비 초기화
            table.style.transform = 'none';
            wrap.style.height = 'auto';

            // 품목 표(wrap)를 제외한 나머지 요소(제목, 상단 정보표, 합계)가 차지하는 높이 합산
            let usedHeight = 0;
            Array.from(box.children).forEach(child => {
                if (child !== wrap) usedHeight += outerHeight(child);
            });
            const wrapMargin = parseFloat(getComputedStyle(wrap).marginBottom || 0);
            const availableHeight = box.clientHeight - usedHeight - wrapMargin;

            wrap.style.height = Math.max(availableHeight, 0) + 'px';

            const neededHeight = table.scrollHeight;
            if (neededHeight > availableHeight && availableHeight > 0) {
                const scale = availableHeight / neededHeight;
                table.style.transformOrigin = 'top';
                table.style.transform = `scaleY(${scale})`;
            }
        }

        window.onload = () => {
            setTimeout(() => {
                fitItemTableToRemainingSpace();
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
