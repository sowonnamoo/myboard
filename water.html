<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상세 이미지 확인</title>
    <style>
        body { margin: 0; background: white; display: flex; justify-content: center; }
        
        #container { 
            position: relative; 
            width: 744px; 
            background-color: white; 
            transition: transform 0.3s ease; 
            transform-origin: top center; 
        }
        
        #main-img { 
            width: 100%; 
            display: block; 
            cursor: pointer; 
            /* [추가] 이미지 드래그 방지 */
            user-select: none; 
            -webkit-user-drag: none; 
        }
        
        .watermark-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: url('https://sowonnamoo1005.cafe24.com/web/1new/watermark2.png?345543');
            background-size: 200px; opacity: 0.3; z-index: 10;
        }

        #zoom-controls {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 100;
        }

        .zoom-btn {
            width: 60px; height: 60px; background: #333; color: white;
            border-radius: 50%; border: none; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
        }

        .zoom-btn:disabled {
            background: #999; cursor: default;
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

    <div id="container">
        <img id="main-img" src="" alt="시안" onclick="window.close()">
        <div class="watermark-overlay"></div>
    </div>

    <div id="zoom-controls">
        <button id="zoom-in-btn" class="zoom-btn">🔍+</button>
        <button id="zoom-out-btn" class="zoom-btn">🔍−</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('main-img').src = params.get('url');

        const container = document.getElementById('container');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');

        // 확대 배율 단계. 기존엔 1.5(기본)/2.0(버튼 클릭 시 최대)만 있었는데,
        // 이제 처음부터 기존 최대 배율(2.0)로 보여주고, 그보다 더 확대할 수 있는
        // 단계(2.5 / 3.0)를 추가로 열어둡니다.
        const zoomLevels = [1.5, 2.0, 2.5, 3.0];
        let zoomIndex = 1; // 1 = 2.0배, 처음 화면부터 기존 최대 배율로 시작

        function applyZoom() {
            container.style.transform = `scale(${zoomLevels[zoomIndex]})`;
            zoomOutBtn.disabled = zoomIndex === 0;
            zoomInBtn.disabled = zoomIndex === zoomLevels.length - 1;
        }

        zoomInBtn.onclick = () => {
            if (zoomIndex < zoomLevels.length - 1) {
                zoomIndex++;
                applyZoom();
            }
        };

        zoomOutBtn.onclick = () => {
            if (zoomIndex > 0) {
                zoomIndex--;
                applyZoom();
            }
        };

        applyZoom();
    </script>
</body>
</html>
