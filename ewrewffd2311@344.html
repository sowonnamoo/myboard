<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>주문작성 및 공지게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white" oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <div class="w-[744px] mx-auto min-h-screen">
        
        <header class="w-full flex justify-center pb-4">           
            <img src="https://sowonnamoo1005.cafe24.com/web/1new/26062901.jpg" width="744" height="68" border="0" usemap="#Map" class="object-cover" onerror="this.style.display='none';">
            <map name="Map">
                <area shape="rect" coords="0,-1,211,57" href="https://sowonnamoo.github.io/myboard" target="_self">
                <area shape="rect" coords="211,-1,383,55" href="https://sowonnamoo.github.io/myboard/index2" target="_self">
                <area shape="rect" coords="383,-1,572,58" href="https://sowonnamoo.github.io/myboard/index5" target="_self">
                <area shape="rect" coords="572,-3,742,58" href="https://sowonnamoo.github.io/myboard/index6" target="_self">
            </map>
        </header>

        <div class="py-0">
            <!-- 목록 화면 -->
            <section id="view-list" class="space-y-4">
                <div class="border p-3 bg-gray-50 text-sm text-gray-600 rounded">
                    🎁 <strong>공지사항 및 VIP 비밀글 접수게시판</strong> &nbsp;
                </div>

                <table class="w-full text-sm border-t-2 border-gray-400 border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 border-b">
                            <th class="py-3 px-4 text-left">제목</th>
                            <th class="py-3 w-28 text-center">작성자</th>
                            <th class="py-3 w-32 text-center">작성일</th>
                        </tr>
                    </thead>
                    <tbody id="list-body" class="divide-y"></tbody>
                </table>

                <div id="pagination" class="flex justify-center items-center space-x-2 py-4 text-sm font-medium text-gray-600"></div>

                <div class="flex justify-between items-center py-4 border-t border-gray-100 w-full">
                    <div class="flex items-center space-x-2 whitespace-nowrap">
                        <button onclick="window.open('https://sowonnamoo.github.io/myboard/search', '_blank', 'width=800,height=800')" 
                                class="bg-gray-600 text-white text-sm px-4 py-2 rounded font-bold hover:bg-gray-700 transition">
                            내 주문조회
                        </button>
                    </div>

                    <!-- 글쓰기 버튼 -->
                    <button id="go-write-btn" 
                            class="flex-shrink-0 bg-blue-600 text-white font-bold text-lg px-12 py-2.5 rounded-full hover:bg-blue-700 transition shadow">
                        글쓰기
                    </button>
                </div>
            </section>

            <!-- 글쓰기 화면 -->
            <section id="view-write" class="hidden w-full">
                <h2 class="text-xl font-bold text-gray-800 mb-6">🔹 공지 / VIP 글 작성</h2>                
                <table class="w-full text-sm border-collapse">
                    <tr class="form-row">
                        <td class="w-28 font-bold text-gray-700 py-3">구입 제품명 <span class="text-red-500">*</span></td>
                        <td><input type="text" id="product-name" class="form-input" placeholder="제품명을 입력하세요"></td>
                    </tr>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">수량 <span class="text-red-500">*</span></td>
                        <td><input type="text" id="quantity" class="form-input" placeholder="수량 입력"></td>
                    </tr>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">사이즈 <span class="text-red-500">*</span></td>
                        <td><input type="text" id="size" class="form-input" placeholder="사이즈 입력"></td>
                    </tr>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">결제금액 <span class="text-red-500">*</span></td>
                        <td><input type="text" id="price" class="form-input" placeholder="숫자만 입력하세요" oninput="this.value = this.value.replace(/[^0-9]/g, '')"></td>
                    </tr>                  
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">파일1 (필수) <span class="text-red-500">*</span></td>
                        <td><input type="file" id="file-1"></td>
                    </tr>
                    <tr class="form-row" id="file-2-wrap">
                        <td class="font-bold text-gray-700 py-3">파일2</td>
                        <td><input type="file" id="file-2"></td>
                    </tr>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3 align-top">작업메시지</td>
                        <td><textarea id="message" rows="4" class="form-input resize-none" placeholder="내용을 입력하세요"></textarea></td>
                    </tr>
                    <tr class="form-row">
                        <td class="w-28 font-bold text-gray-700 py-3">작성자명 <span class="text-red-500">*</span></td>
                        <td><input type="text" id="input-author" class="form-input" placeholder="이름 또는 관리자명"></td>
                    </tr>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">접수자핸드폰 <span class="text-red-500">*</span></td>
                        <td>
                            <input type="text" id="phone" class="form-input" placeholder="010-XXXX-XXXX" 
                                   maxlength="11" 
                                   oninput="this.value = this.value.replace(/[^0-9-]/g, '')">
                        </td>
                    </tr>
                    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
                    <tr class="form-row">
                        <td class="font-bold text-gray-700 py-3">배송지 <span class="text-red-500">*</span></td>
                        <td class="space-y-2">
                            <div class="flex items-center space-x-2 flex-nowrap">
                                <input type="text" id="address" class="form-input flex-grow" placeholder="주소" readonly>
                                <button type="button" onclick="execDaumPostcode()" class="bg-gray-500 text-white px-2 py-2 rounded text-sm whitespace-nowrap">주소찾기</button>
                            </div>
                            <input type="text" id="address-detail" class="form-input w-full" placeholder="상세주소 입력">
                        </td>
                    </tr>
                </table>

                <div class="flex justify-between items-center mt-6">
                    <button onclick="switchView('list')" class="border px-4 py-1.5 text-sm rounded bg-gray-50 hover:bg-gray-100">목록</button>
                    <button id="save-btn" class="bg-gray-600 text-white font-semibold px-8 py-1.5 text-sm rounded hover:bg-gray-700">접수하기</button>
                </div>
            </section>

            <!-- 상세 화면 -->
            <section id="view-detail" class="hidden w-full space-y-5">
                <!-- 상세 내용 영역 (app.js 연동) -->
            </section>
        </div>
    </div>

    <!-- 입력 잠금 방지 및 기능 안정화 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 글쓰기 진입 시 입력창이 잠기는(readonly) 현상을 강제로 해제하는 안전장치
            const targetIds = ['product-name', 'quantity', 'size', 'price', 'input-author', 'phone', 'address', 'address-detail', 'message'];
            
            const unlockFields = () => {
                targetIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.readOnly = false;
                        el.disabled = false;
                        el.style.backgroundColor = '#ffffff';
                    }
                });
            };

            // 페이지 로드 직후 및 글쓰기 버튼 클릭 시 강제 해제 적용
            unlockFields();

            const writeBtn = document.getElementById("go-write-btn");
            if (writeBtn) {
                writeBtn.addEventListener("click", function() {
                    setTimeout(unlockFields, 50); // 뷰 전환 직후 필드 활성화 보장
                });
            }
        });
    </script>

    <!-- 기존 외부 앱 로직 연동 -->
    <script type="module" src="app.js"></script>
</body>
</html>
