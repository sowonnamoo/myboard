<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, getDoc, setDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 팝업 열기 함수 추가
        window.openPopup = (url) => {
            window.open(url, '_blank', 'width=590,height=830,scrollbars=yes');
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
            authDomain: "board-291e3.firebaseapp.com",
            projectId: "board-291e3",
            storageBucket: "board-291e3.firebasestorage.app",
            messagingSenderId: "25881766316",
            appId: "1:25881766316:web:c03e118cf26d3fff11b209"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ---- 개인정보 조회키(secretId) 계산 ----
        // app.js / app2.js / index3.js와 반드시 동일한 방식으로 계산해야 같은 secretId가 나옵니다.
        // boards/{id}, jjjj/{id} 공개 문서에는 더 이상 phone/address/message가 들어있지 않고,
        // boards/{id}/private/{secretId}, jjjj/{id}/private/{secretId} 문서에만 들어있으므로
        // 이름+뒷4자리로 secretId를 "정확히" 계산해낼 수 있는 사람만 그 문서를 열어볼 수 있습니다.
        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }
        function normalizeName(name) { return String(name || "").trim(); }
        function normalizePhoneLast4(phone) { return String(phone || "").replace(/[^0-9]/g, "").slice(-4); }
        async function computeSecretId(boardId, author, phone) {
            const key = `${boardId}::${normalizeName(author)}::${normalizePhoneLast4(phone)}`;
            return sha256Hex(key);
        }

        // ---- 세금계산서/현금영수증 상호배타 판별용 ID (segum.html / app.js와 완전히 동일한 방식) ----
        // 문서 ID = "segum::이름::전화번호전체" 해시값. 이 값이 같으면 같은 사람으로 판단해서
        // 세금계산서(segum1)와 현금영수증(cashSecret) 중 하나만 신청 가능하도록 서로 확인합니다.
        function normalizePhoneFull(phone) { return String(phone || "").replace(/[^0-9]/g, ""); }
        // data-name/data-phone 등 HTML 속성값에 안전하게 넣기 위한 이스케이프 (따옴표로 인한 마크업 깨짐 방지)
        function escapeAttr(str) {
            return String(str || '')
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        async function computeSegumId(name, phone) {
            return sha256Hex(`segum::${normalizeName(name)}::${normalizePhoneFull(phone)}`);
        }

        // ---- 방문자 익명 로그인 (현금영수증 신청 시 uid가 필요해서 index.html/app.js와 동일하게 부여) ----
        const auth = getAuth(app);
        let resolveAuthReady;
        const authReadyPromise = new Promise((resolve) => { resolveAuthReady = resolve; });
        onAuthStateChanged(auth, (user) => {
            if (user) {
                resolveAuthReady(user);
            } else {
                signInAnonymously(auth).catch((e) => console.error("익명 로그인 실패:", e));
            }
        });
        function ensureAnonymousLogin() {
            return authReadyPromise;
        }

        // ---- 세금계산서 버튼: index.html의 openSegumPage와 동일하게, 이름/전화번호를 넘겨서
        //      segum.html이 열리자마자 "이미 신청돼 있는지"를 바로 확인해 보여줄 수 있게 함 ----
        window.openSegumPageFor = (name, phone) => {
            const n = encodeURIComponent(name || '');
            const p = encodeURIComponent(phone || '');
            openPopup(`https://sowonnamoo.github.io/myboard/segum?name=${n}&phone=${p}`);
        };

        // ---- 현금영수증 버튼: index.html/app.js의 openCashPage와 동일한 로직 ----
        window.openCashPageFor = async (boardId, name, phone) => {
            if (!boardId || !name || !phone) {
                alert('주문 정보를 찾을 수 없습니다.');
                return;
            }

            // 1. 세금계산서가 이미 등록된 이름+전화번호면 현금영수증 신청 자체를 막습니다.
            try {
                const segumId = await computeSegumId(name, phone);
                const segumSnap = await getDoc(doc(db, "segum1", segumId));
                if (segumSnap.exists()) {
                    alert('이미 세금계산서 신청이 등록되셔서 현금영수증 신청은 되지 않습니다.');
                    return;
                }
            } catch (e) {
                alert('확인 중 오류가 발생했습니다: ' + e.message);
                return;
            }

            const cashRef = doc(db, "cashReceipt1", boardId);
            let snap;
            try {
                snap = await getDoc(cashRef);
            } catch (e) {
                alert('조회 중 오류가 발생했습니다: ' + e.message);
                return;
            }

            if (snap.exists()) {
                const data = snap.data();
                if (data.fileUrl) {
                    window.open(data.fileUrl, '_blank');
                } else {
                    alert('현금영수증이 신청되셨습니다.\n택배 발송후 1~2일후 본 버튼을 다시 눌러주시면 우클릭 다운로드 가능합니다.');
                }
                return;
            }

            // 2. 최초 신청: 발행희망번호(사업자번호 또는 전화번호) 입력받기
            const cashNumber = prompt('현금영수증 발행희망 번호를 입력해주세요.\n(사업자등록번호 또는 전화번호 중 1개)');
            if (!cashNumber || !cashNumber.trim()) return;

            try {
                const user = await ensureAnonymousLogin();
                await setDoc(cashRef, {
                    boardId, author: name, cashNumber: cashNumber.trim(),
                    fileUrl: '', createdAt: serverTimestamp(), uid: user.uid
                });
                // 이름+전화번호 기반 식별자로도 기록 -> segum.html에서 "이미 현금영수증 신청됨"을 확인할 수 있게 함
                const cashSecretId = await computeSegumId(name, phone);
                await setDoc(doc(db, "cashSecret", cashSecretId), {
                    boardId, createdAt: serverTimestamp()
                }, { merge: true });
                const segumBtnNow = document.getElementById('segum-btn-' + boardId);
                if (segumBtnNow) segumBtnNow.style.display = 'none';
                alert('현금영수증이 신청되셨습니다.\n택배 발송후 1~2일후 본 버튼을 다시 눌러주시면 우클릭 다운로드 가능합니다.');
            } catch (e) {
                alert('신청 중 오류가 발생했습니다: ' + e.message);
            }
        };

        // ---- 카드전표 버튼: index.html/app.js의 openCardPage와 동일한 로직 ----
        // 고객이 직접 신청하는 절차는 없고, 관리자가 택배 발송 후 fileUrl을 등록해두면 열람 가능합니다.
        window.openCardPageFor = async (boardId) => {
            if (!boardId) {
                alert('주문 정보를 찾을 수 없습니다.');
                return;
            }
            try {
                const snap = await getDoc(doc(db, "cardjun1", boardId));
                if (snap.exists() && snap.data().fileUrl) {
                    window.open(snap.data().fileUrl, '_blank');
                } else {
                    alert('택배물 발송후 등록됩니다.');
                }
            } catch (e) {
                alert('택배물 발송후 등록됩니다.');
            }
        };

        // ---- 세금계산서 ↔ 현금영수증 상호배타 상태를 화면에 즉시 반영 ----
        // index.html 상세화면에서 하던 것과 동일하게, 이 주문의 현금영수증(cashReceipt1)이 이미
        // 등록돼 있으면 세금계산서 버튼을 숨기고, 이 이름+전화번호로 세금계산서(segum1)가 이미
        // 등록돼 있으면 현금영수증 버튼을 숨깁니다.
        async function syncTaxCashButtons(d) {
            const segumBtn = document.getElementById('segum-btn-' + d.id);
            const cashBtn = document.getElementById('cash-btn-' + d.id);
            if (segumBtn) {
                try {
                    const cashSnap = await getDoc(doc(db, "cashReceipt1", d.id));
                    if (cashSnap.exists()) segumBtn.style.display = 'none';
                } catch (e) { /* 조회 실패해도 버튼은 그대로 둠 */ }
            }
            if (cashBtn) {
                try {
                    const segumId = await computeSegumId(d.author, d.phone);
                    const segumSnap = await getDoc(doc(db, "segum1", segumId));
                    if (segumSnap.exists()) cashBtn.style.display = 'none';
                } catch (e) { /* 조회 실패해도 버튼은 그대로 둠 */ }
            }
        }

document.getElementById('search-btn').addEventListener('click', async () => {
    // 봇 방지: 이름/뒷4자리를 10회 이상 틀리면 3시간 동안 조회를 막습니다. (app.js / app2.js와 동일한 방식)
    const blockUntil = localStorage.getItem('searchBlockUntil');
    const nowTime = new Date().getTime();
    if (blockUntil && nowTime < parseInt(blockUntil)) {
        const remainingSec = Math.ceil((parseInt(blockUntil) - nowTime) / 1000);
        const min = Math.floor(remainingSec / 60);
        const sec = remainingSec % 60;
        alert(`너무 많이 틀려 ${min}분 ${sec}초 동안 조회가 제한됩니다.`);
        return;
    }

    const name = document.getElementById('search-name').value.trim();
    const phoneInput = document.getElementById('search-phone');
    const phone = phoneInput.value.trim();
    const resultsDiv = document.getElementById('results');

    function registerFail() {
        let failCount = parseInt(localStorage.getItem('searchFailCount') || '0') + 1;
        if (failCount >= 10) {
            localStorage.setItem('searchBlockUntil', (nowTime + (3 * 60 * 60 * 1000)).toString());
            localStorage.setItem('searchFailCount', '0');
            alert("이름/전화번호를 10회 틀려 3시간 동안 조회가 제한됩니다.");
        } else {
            localStorage.setItem('searchFailCount', failCount.toString());
        }
    }

    if (!name || phone.length !== 4) {
        registerFail();
        alert("이름과 전화번호 뒷 4자리를 정확히 입력해주세요.");
        return;
    }

    resultsDiv.innerHTML = "조회 중...";

    try {
        // 1. 이름으로 공개 문서만 먼저 조회합니다. (공개 문서에는 phone/address/message가 없으므로
        //    이 목록 조회 자체는 개인정보를 노출하지 않습니다)
        const qBoards = query(collection(db, "boards"), where("author", "==", name));
        const qJjjj = query(collection(db, "jjjj"), where("author", "==", name));

        const [snapBoards, snapJjjj] = await Promise.all([getDocs(qBoards), getDocs(qJjjj)]);

        const candidates = [
            ...snapBoards.docs.map(d => ({ data: d.data(), id: d.id, isJajoo: false, col: "boards" })),
            ...snapJjjj.docs.map(d => ({ data: d.data(), id: d.id, isJajoo: true, col: "jjjj" }))
        ];

        // 2. 후보 각각에 대해 입력한 이름+뒷4자리로 secretId를 계산하고,
        //    그 private 문서가 "실제로 존재하는지"로 본인 여부를 검증합니다.
        //    (이름은 같지만 전화번호가 다른 사람의 주문은 secretId가 달라서 문서가 없으므로 자동으로 걸러집니다)
        const verified = await Promise.all(candidates.map(async (c) => {
            const secretId = await computeSecretId(c.id, name, phone);
            const privateSnap = await getDoc(doc(db, c.col, c.id, "private", secretId));
            if (!privateSnap.exists()) return null;
            return { ...c.data, ...privateSnap.data(), id: c.id, isJajoo: c.isJajoo, secretId };
        }));

        const filteredData = verified.filter(Boolean);

        if(filteredData.length === 0) {
            registerFail();
            resultsDiv.innerHTML = "해당하는 주문 정보를 찾을 수 없습니다."; 
            return; 
        }

        // 성공 시 실패 횟수 초기화
        localStorage.setItem('searchFailCount', '0');

        
filteredData.sort((a, b) => {
    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
    return dateB - dateA;
});

        
        resultsDiv.innerHTML = "";
        if(filteredData.length === 0) { 
            resultsDiv.innerHTML = "해당하는 주문 정보를 찾을 수 없습니다."; 
            return; 
        }

        filteredData.forEach(d => {
            // [4] 날짜 및 이미지 번호 로직
            const dateObj = d.createdAt?.toDate ? d.createdAt.toDate() : new Date(d.createdAt);
            const phoneFull = (d.phone || "").replace(/[^0-9]/g, "");
            const phonePrefix = phoneFull.slice(0, -4); // 뒷4자리(=비밀번호)가 이미지번호로 노출되지 않도록 뒷4자리를 제외
            const year = dateObj.getFullYear().toString().slice(-2);
            const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            const day = dateObj.getDate().toString().padStart(2, '0');
            const hours = dateObj.getHours().toString().padStart(2, '0');
            const minutes = dateObj.getMinutes().toString().padStart(2, '0');
            
            const designNo = d.imgCode || `${phonePrefix}${year}${month}${day}${hours}${minutes}`;
            const dateStr = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;

            // [5] 재구입 버튼 노출 로직 (재주문 건이면 버튼 숨김)
            const reOrderBtn = d.isJajoo ? "" : `
                <button onclick="openPopup('index3.html?productName=${encodeURIComponent(d.author + '님 (' + (d.productName || '상품명') + '/' + (d.quantity || '0') + '/' + (d.size || '0') + ') ' + (d.price || '0') + '원')}&imgCode=${designNo}')" 
                class="bg-black text-white px-6 py-2 rounded font-bold">재구입</button>
            `;

const isPending = d.status === '대기';
const isBankTransfer = d.status === '무통장';
const isCardPay = d.status === '카드결제';
let statusLabel = (d.status === '대기') ? '(접수전/결제확인중)' : 
                  (d.status === '접수에러') ? '(제작보류)' : '(접수완료)';

// [추가된 로직] 시안 완료/출고 상태에 따른 문구 자동 변경
if (d.status !== '대기' && d.status !== '접수에러') {

// ---- 접수에러 상태에서 '파일재업로드' 클릭 시: 팝업(upload.html) 없이 바로 파일선택창을 띄우고,
//      고른 파일을 즉시 R2에 업로드한 뒤 해당 주문의 file1Url을 새 파일로 교체합니다. ----
window.triggerFileReupload = function(btn) {
    if (!btn || btn.disabled) return;

    const docId = btn.dataset.docId;
    const col = btn.dataset.col;
    const authorName = btn.dataset.author || '재업로드';

    const tempInput = document.createElement('input');
    tempInput.type = 'file';
    tempInput.style.display = 'none';
    document.body.appendChild(tempInput);

    tempInput.addEventListener('change', async () => {
        const file = tempInput.files && tempInput.files[0];
        if (!file) { document.body.removeChild(tempInput); return; }

        // 500MB 용량 제한
        const MAX_SIZE = 500 * 1024 * 1024;
        if (file.size > MAX_SIZE) {
            alert("⚠️ 파일 용량이 500MB를 넘습니다. 500MB 미만의 파일로 다시 접수해주세요.");
            document.body.removeChild(tempInput);
            return;
        }

        if (!confirm('선택한 파일로 다시 접수하시겠습니까?')) {
            document.body.removeChild(tempInput);
            return;
        }

        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        btn.textContent = '업로드 중...';

        try {
            await ensureAnonymousLogin();
            const newUrl = await uploadFileToR2(file, authorName);

            await updateDoc(doc(db, col, docId), {
                file1Url: newUrl,
                reuploadedAt: new Date()
            });

            // 버튼을 "수정파일 접수완료(접수시간)"으로 바꾸고 비활성화 상태를 유지
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} `
                + `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            btn.textContent = `수정파일 접수완료(${timeStr})`;
            btn.classList.remove('bg-red-600', 'hover:bg-red-700', 'border-red-700', 'opacity-50', 'cursor-not-allowed');
            btn.classList.add('bg-gray-400', 'cursor-not-allowed', 'border', 'border-gray-400');
            btn.disabled = true;

            const msgEl = document.getElementById('reupload-msg-' + docId);
            if (msgEl) msgEl.classList.add('hidden');

            // 파일 1 다운로드 링크도 새 파일 주소로 즉시 갱신
            const fileLink = document.getElementById('file1-link-' + docId);
            if (fileLink) fileLink.href = newUrl;

        } catch (e) {
            if (e.code === 'permission-denied') {
                alert('본인이 작성한 글만 파일을 재업로드할 수 있습니다. (다른 기기/브라우저에서 작성한 글이거나, 브라우저 데이터를 지운 경우 본인 글로 인식되지 않을 수 있습니다.)');
            } else {
                alert('재업로드 중 오류가 발생했습니다: ' + e.message);
            }
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            btn.textContent = '파일재업로드';
        } finally {
            document.body.removeChild(tempInput);
        }
    });

    tempInput.click();
};

// [R2 업로드 함수] app.js의 uploadToR2와 동일한 방식(용량/확장자 검사 포함)이되,
// 파일 input을 미리 화면에 둘 필요 없이 File 객체를 바로 넘겨 업로드합니다.
function uploadFileToR2(file, authorName) {
    return new Promise((resolve, reject) => {
        const allowedExtensions = ['jpg', 'jpeg', 'png', 'pdf', 'ai', 'psd', 'zip', 'hwp', 'eps', 'gif', 'HEIC', 'WEBP', 'xlsx'];
        const ext = file.name.split('.').pop().toLowerCase();
        if (!allowedExtensions.includes(ext)) {
            reject(new Error("허용되지 않는 파일 형식입니다."));
            return;
        }

        const uniqueFileName = `${authorName}_${Date.now()}_${file.name}`;
        const WORKER_URL = "https://r2.ecogr.workers.dev/";

        const xhr = new XMLHttpRequest();
        xhr.open("PUT", `${WORKER_URL}?name=${encodeURIComponent(uniqueFileName)}`, true);
        xhr.setRequestHeader("Content-Type", file.type);
        xhr.setRequestHeader("X-File-Size", file.size);

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const result = JSON.parse(xhr.responseText);
                    resolve(result.url);
                } catch (e) {
                    reject(new Error("업로드 응답을 처리하지 못했습니다."));
                }
            } else {
                reject(new Error("업로드 실패: " + xhr.statusText));
            }
        };
        xhr.onerror = () => reject(new Error("업로드 중 네트워크 오류가 발생했습니다."));
        xhr.send(file);
    });
}
