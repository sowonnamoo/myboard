<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 min-h-screen flex items-center justify-center text-white">
    <h2 id="status-text" class="text-xl font-bold">결제 처리 중...</h2>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- 익명 로그인 ----
    // jjjj 문서의 status 업데이트는 규칙상 auth가 있어야 통과됩니다.
    // 같은 브라우저(같은 origin)에서 index3.html 단계에서 이미 로그인된 세션이 있으면
    // 여기서 새로 로그인하지 않고 그 세션을 그대로 이어받습니다.
    const auth = getAuth(app);
    let resolveAuthReady;
    const authReadyPromise = new Promise((resolve) => { resolveAuthReady = resolve; });
    onAuthStateChanged(auth, (user) => {
        if (user) resolveAuthReady(user);
        else signInAnonymously(auth).catch((e) => console.error("익명 로그인 실패:", e));
    });
    function ensureAnonymousLogin() { return authReadyPromise; }

    async function processPaymentStatus() {
        const statusText = document.getElementById("status-text");
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        if (!orderId) {
            statusText.innerText = "결제 정보 오류 (ID 누락)";
            return;
        }

        try {
            // 1. 상태 업데이트 전에 로그인 세션(같은 브라우저에서 이어받은 익명 계정)이 준비될 때까지 대기
            await ensureAnonymousLogin();

            // [수정] 오직 'jjjj' 컬렉션만 참조
            const docRef = doc(db, "jjjj", orderId);
            const docSnap = await getDoc(docRef);

           if (docSnap.exists()) {
    await updateDoc(docRef, { status: "카드결제" });
    statusText.innerText = "결제가 완료되었습니다!";
    
    // 1. 부모창(jaecard.html) 닫기
    if (window.opener && !window.opener.closed) {
        window.opener.close(); 
    }
    
    // 2. 만약 관리자 페이지(최초 주문 페이지)까지 새로고침해야 한다면 
    // 아래 코드를 사용하세요 (window.opener.opener는 관리자 페이지입니다)
    if (window.opener && window.opener.opener && !window.opener.opener.closed) {
        window.opener.opener.location.reload();
    }

    // 3. 1.5초 후 success5 창 스스로 닫기
    setTimeout(() => window.close(), 1500);

            } else {
                statusText.innerText = "주문 정보를 찾을 수 없습니다 (jjjj 컬렉션 데이터 확인 필요)";
                console.error("해당 ID로 jjjj 컬렉션에서 문서를 찾지 못했습니다:", orderId);
            }

        } catch (err) {
            console.error("업데이트 에러:", err);
            if (err.code === "permission-denied") {
                // 다른 브라우저/시크릿창 등으로 세션이 끊겨 본인 확인이 안 된 경우
                statusText.innerText = "결제는 완료되었으나 상태 반영에 실패했습니다. 관리자에게 문의해주세요. (주문번호: " + orderId + ")";
            } else {
                statusText.innerText = "오류 발생: " + err.message;
            }
        }
    }

    processPaymentStatus();
</script>
</body>
</html>
