<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>빠른 재구입</title>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .box { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; border: 1px solid #ddd; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        input[readonly] { background: #f0f0f0; }
        #price, #address { background: #fff; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-group button { flex: 1; padding: 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; color: white; }
    </style>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px;">
    <h2 style="margin: 0; font-size: 18px; color: #333;">재주문</h2>
    <p style="margin: 0; font-size: 12px; color: #d32f2f; font-weight: bold;">※ 재주문건은 결제 즉시 제작 시작됩니다.</p>
</div>
<div class="box">
    <div class="input-group"><label>제품명</label><input type="text" id="productName" readonly></div>
    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;"><label>수량</label><input type="text" id="quantity" readonly></div>
        <div class="input-group" style="flex: 1;"><label>사이즈</label><input type="text" id="size" readonly></div>
    </div>
    <div class="input-group"><label>결제금액</label><input type="text" id="price" placeholder="상품가격+배송비 금액을 정확히 입력 (오류시 제작보류) 해주세요." inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')"></div>
    <div class="input-group"><label>이미지 번호</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="imgCode" readonly>
            <button type="button" onclick="openImage()" style="width:100px; background:#555; color:white; border:none; cursor:pointer; border-radius:4px;">이미지 보기</button>
        </div>
    </div>
    <div class="input-group"><label>작성자명</label><input type="text" id="name" placeholder="필수 입력"></div>
    <div class="input-group"><label>핸드폰 번호</label><input type="text" id="phone" placeholder="숫자 11자리 입력" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')"></div>
    <div class="input-group">
        <label>주소</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="address" placeholder="주소 검색 버튼 클릭" readonly>
            <button type="button" onclick="execDaumPostcode()" style="width:100px; background:#444; color:white; border:none; cursor:pointer; border-radius:4px;">주소검색</button>
        </div>
    </div>
    <div class="input-group"><label>상세주소</label><input type="text" id="addressDetail" placeholder="상세주소 입력"></div>
    
    <input type="hidden" id="message">
    <input type="hidden" id="file1Url">
    <input type="hidden" id="file2Url">

    <div class="btn-group">
        <button onclick="submitOrder('무통장')" style="background-color: #15803d;">무통장결제</button>
        <button onclick="submitOrder('카드')" style="background-color: #1e3a8a;">카드결제</button>
    </div>
</div>

<!-- 카드결제 성공 안내 모달 (기본 숨김) -->
<div id="pay-success-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:9999;">
    <div style="background:white; padding:30px; border-radius:10px; max-width:320px; width:90%; text-align:center;">
        <div style="font-size:40px; margin-bottom:10px;">✅</div>
        <h3 style="margin:0 0 8px; font-size:16px; color:#333;">결제 성공</h3>
        <p style="margin:0 0 20px; font-size:13px; color:#666;">재주문이 정상적으로 접수되었습니다.</p>
        <button id="pay-success-goto-btn" style="width:100%; padding:12px; background:#1e3a8a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">주문조회 바로가기</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- 익명 로그인 ----
    // 규칙에서 jjjj 컬렉션 create를 request.auth != null 로 막아뒀기 때문에
    // (예전엔 로그인 없이도 그냥 써졌지만, 이제는 auth가 있어야 저장이 됩니다)
    const auth = getAuth(app);
    let resolveAuthReady;
    const authReadyPromise = new Promise((resolve) => { resolveAuthReady = resolve; });
    onAuthStateChanged(auth, (user) => {
        if (user) resolveAuthReady(user);
        else signInAnonymously(auth).catch((e) => console.error("익명 로그인 실패:", e));
    });
    function ensureAnonymousLogin() { return authReadyPromise; }

    // 카드결제 팝업(payment.html)이 성공 메시지를 보낼 때 어느 주문을 업데이트할지 알기 위한 값
    let currentOrderId = null;
    let paymentHandled = false; // 메시지가 중복으로 와도 한 번만 처리되도록

    // ---- payment.html에서 보내는 결제 성공 메시지 수신 ----
    // payment.html과 index3.html은 실제로는 같은 origin(sowonnamoo.github.io)이라
    // 경로(myjs vs myboard)가 달라도 postMessage가 그대로 전달됩니다.
    window.addEventListener('message', async (event) => {
        if (event.origin !== 'https://sowonnamoo.github.io') return;
        if (!event.data || event.data.type !== 'PAYMENT_SUCCESS') return;
        if (!currentOrderId || paymentHandled) return;
        paymentHandled = true;

        try {
            await ensureAnonymousLogin();
            await updateDoc(doc(db, "jjjj", currentOrderId), { status: '카드결제' });
        } catch (e) {
            console.error('재주문 상태 업데이트 실패:', e);
            alert('결제는 완료되었으나 주문 상태 반영 중 오류가 발생했습니다. 관리자에게 문의해주세요.');
        }

        document.getElementById('pay-success-modal').style.display = 'flex';
    });

    document.getElementById('pay-success-goto-btn').onclick = () => {
        // index3는 index2에서 팝업으로 열렸으므로, 원래 창(index2)을 index5로 이동시키고
        // 이 팝업(index3)은 닫습니다. (팝업이 아니라 opener가 없으면 이 창 자체를 이동)
        if (window.opener && !window.opener.closed) {
            window.opener.location.href = 'https://sowonnamoo.github.io/myboard/index5';
            window.close();
        } else {
            window.location.href = 'https://sowonnamoo.github.io/myboard/index5';
        }
    };

    // ---- 개인정보 조회키(secretId) 계산 - app.js/app2.js와 반드시 동일한 방식 ----
    async function sha256Hex(text) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function normalizeName(name) { return String(name || "").trim(); }
    function normalizePhoneLast4(phone) { return String(phone || "").replace(/[^0-9]/g, "").slice(-4); }
    async function computeSecretId(boardId, author, phone) {
        const key = `${boardId}::${normalizeName(author)}::${normalizePhoneLast4(phone)}`;
        return sha256Hex(key);
    }

    window.execDaumPostcode = () => {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById("address").value = data.address;
                document.getElementById("addressDetail").focus();
            }
        }).open();
    };

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const fullTitle = params.get('productName');
        if (fullTitle) {
            const contentMatch = fullTitle.match(/\((.*?)\)/);
            if (contentMatch) {
                const parts = contentMatch[1].split('/');
                document.getElementById('productName').value = parts[0]?.trim() || '';
                document.getElementById('quantity').value = parts[1]?.trim() || '';
                document.getElementById('size').value = parts[2]?.trim() || '';
            }
        }
        if (params.get('imgCode')) document.getElementById('imgCode').value = params.get('imgCode');
        if (params.get('message')) document.getElementById('message').value = params.get('message');
        if (params.get('file1Url')) document.getElementById('file1Url').value = params.get('file1Url');
        if (params.get('file2Url')) document.getElementById('file2Url').value = params.get('file2Url');
        // 작성자명/전화번호는 이전 페이지(index2)에서 넘겨준 값을 그대로 채워둡니다.
        // 결제금액은 매번 달라지므로 여기서 채우지 않고 직접 입력하게 둡니다.
        if (params.get('author')) document.getElementById('name').value = params.get('author');
        if (params.get('phone')) document.getElementById('phone').value = params.get('phone');
    };

    window.openImage = () => {
        const imgCode = document.getElementById('imgCode').value;
        if (!imgCode) { alert("이미지 번호가 없습니다."); return; }
        window.open(`photo1.html?designNo=${imgCode}`, '_blank', 'width=744,height=600,scrollbars=yes');
    };

    window.submitOrder = async (type) => {
        const name = document.getElementById('name').value.trim();
        const phoneInput = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const addressDetail = document.getElementById('addressDetail').value.trim();
        const price = document.getElementById('price').value;
        
        const phoneRegex = /^01([0|1|6|7|8|9])([0-9]{3,4})([0-9]{4})$/;
        
        if (!name || !address || !addressDetail) {
            alert("작성자명, 주소, 상세주소는 필수 입력 항목입니다.");
            return;
        }

        if (!price || parseInt(price, 10) <= 0) {
            alert("상품가격+배송비 금액을 정확히 입력 (오류시 제작보류) 해주세요.");
            return;
        }
        
        if (!phoneRegex.test(phoneInput)) {
            alert("핸드폰 번호를 정확히 11자리 숫자로 입력해주세요.");
            return;
        }

        // 저장 전에 익명 로그인이 끝났는지 확인 (uid 확정 대기)
        const currentUser = await ensureAnonymousLogin();

        // 문서 ID를 먼저 발급받고, 그 ID로 조회키(secretId)를 계산합니다.
        const orderRef = doc(collection(db, "jjjj"));
        const orderId = orderRef.id;
        const secretId = await computeSecretId(orderId, name, phoneInput);

        const fullAddress = address + " " + addressDetail;
        const messageVal = document.getElementById('message').value;

        // 공개 문서: 개인정보(phone/address/message/password) 절대 포함하지 않음
        const orderData = {
            productName: document.getElementById('productName').value,
            quantity: document.getElementById('quantity').value,
            size: document.getElementById('size').value,
            price: price,
            imgCode: document.getElementById('imgCode').value,
            author: name,
            file1Url: document.getElementById('file1Url').value,
            file2Url: document.getElementById('file2Url').value,
type: (type === '카드') ? '재주문' : type,
            createdAt: new Date(),
            status: '대기',
            uid: currentUser.uid
        };

try {
            // 주문서 저장 (공개 문서 + 개인정보 private 문서를 함께 기록)
            await setDoc(orderRef, orderData);
            await setDoc(doc(db, "jjjj", orderId, "private", secretId), {
                phone: phoneInput,
                address: fullAddress,
                message: messageVal,
                uid: currentUser.uid
            });
            // 관리자 페이지 전용 조회용으로, 동일한 개인정보를 adminOrders/{orderId}에도 저장.
            // 문서 ID가 orderId 그대로라 관리자가 secretId 계산 없이 바로 조회할 수 있고,
            // Rules상 isAdmin()만 읽을 수 있어 고객/비관리자에게는 노출되지 않습니다.
            await setDoc(doc(db, "adminOrders", orderId), {
                phone: phoneInput,
                address: fullAddress,
                message: messageVal,
                uid: currentUser.uid
            });
            
            if (type === '무통장') {
                // 무통장 결제: 기존 로직 유지
                window.location.href = `https://sowonnamoo.github.io/myboard/mooto?price=${encodeURIComponent(price)}`;
            } else {
                // 카드결제: payment.html을 팝업으로 열고, 이 창은 그대로 열어둔 채 결제 완료 메시지를 기다립니다.
                currentOrderId = orderId;
                paymentHandled = false;
                const paymentUrl = `https://sowonnamoo.github.io/myjs/payment?price=${encodeURIComponent(price)}`;
                window.open(paymentUrl, 'paymentWindow', 'width=811,height=649,scrollbars=yes,resizable=yes');
            }
        } catch (e) { alert('오류: ' + e.message); }
    };
</script>
</body>
</html>
