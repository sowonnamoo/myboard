<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 통합 관리 페이지</title>
    <!-- 검색엔진 및 크롤러 수집 차단: 잘 만들어진(정직한) 봇들은 이 지시를 따름 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="bingbot" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        #orders-tbody tr:nth-child(even) { background-color: #fafbfc; }
        #orders-tbody tr:hover { background-color: #eff6ff; }
        .badge { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px; }
    </style>
</head>
<body class="p-4 sm:p-8 bg-slate-100 min-h-screen">

<!-- 로그인 화면: 인증 전에는 이 화면만 보이고 아래 관리자 콘텐츠는 숨겨져 있음 -->
<div id="login-screen" class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 mb-1 text-center">🔒 관리자 로그인</h1>
        <p class="text-xs text-slate-400 mb-6 text-center">관리자 계정으로 로그인해야 페이지를 이용할 수 있습니다.</p>
        <form id="login-form" class="space-y-3">
            <input id="login-email" type="email" autocomplete="username" required placeholder="이메일" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-slate-500">
            <input id="login-password" type="password" autocomplete="current-password" required placeholder="비밀번호" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-slate-500">
            <button id="login-submit-btn" type="submit" class="w-full bg-slate-900 hover:bg-slate-700 text-white py-3 rounded-xl text-sm font-semibold transition">로그인</button>
        </form>
        <p id="login-error" class="text-xs text-red-500 mt-3 text-center hidden"></p>
    </div>
</div>

<div id="admin-content" class="max-w-[1600px] mx-auto hidden">

    <div class="flex flex-wrap justify-between items-center mb-5">
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">📦 주문 통합 관리</h1>
        <div class="flex gap-2 items-center">
            <span id="last-refreshed-at" class="text-xs text-slate-400"></span>
            <button onclick="refreshOrdersKeepView()" class="bg-white border border-slate-300 text-slate-600 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-50 transition shadow-sm">🔄 새로고침</button>
            <a href="https://sowonnamoo.github.io/myboard/mng_x92a" target="_blank" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-700 transition shadow-sm">🛡️ 보안/차단</a>
            <button onclick="adminLogout()" class="bg-white border border-slate-300 text-slate-600 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-50 transition shadow-sm">로그아웃</button>
        </div>
    </div>

    <div class="overflow-x-auto bg-white shadow-md rounded-2xl border border-slate-200">
        <table class="w-full text-xs">
            <thead>
                <tr class="bg-slate-800 text-white">
                    <th class="p-3 font-semibold">선택</th>
                    <th class="p-3 font-semibold">날짜</th>
                    <th class="p-3 font-semibold">구분</th>
                    <th class="p-3 font-semibold">작성자</th>
                    <th class="p-3 font-semibold">연락처</th>
                    <th class="p-3 font-semibold">상품명/수량/사이즈</th>
                    <th class="p-3 font-semibold">배송지</th>
                    <th class="p-3 font-semibold">금액</th>
                    <th class="p-3 font-semibold">상태</th>
                    <th class="p-3 font-semibold">파일</th>
                    <th class="p-3 font-semibold">주문서</th>
                    <th class="p-3 font-semibold">운송장URL</th>
                    <th class="p-3 font-semibold">관리</th>
                </tr>
            </thead>
            <tbody id="orders-tbody" class="divide-y divide-slate-100"></tbody>
        </table>
    </div>

    <div class="text-center mt-5 mb-6">
        <button id="more-btn" onclick="loadMoreOrders()" class="bg-white border border-slate-300 text-slate-700 px-8 py-2.5 rounded-xl font-semibold text-sm hover:bg-slate-50 shadow-sm transition">더 보기 ▾</button>
    </div>

    <!-- 선택한 주문의 상태를 바꾸는 컨트롤 — 위 표에서 체크박스로 고른 행에 그대로 적용됨 -->
    <div class="max-w-3xl mx-auto bg-white p-5 rounded-2xl shadow-md border border-slate-200 mb-10 sticky bottom-4">
        <p class="mb-3 text-sm text-slate-500">선택된 주문 &nbsp;<span id="selected-name" class="font-bold text-slate-800">없음</span></p>
        <div class="flex gap-2 flex-wrap">
            <button onclick="updateStatus('대기')" class="bg-slate-500 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">대기</button>
            <button onclick="updateStatus('무통장')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">무통장</button>
            <button onclick="updateStatus('카드결제')" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">카드결제</button>
            <button onclick="updateStatus('접수에러')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">접수에러</button>
            <button onclick="updateStatus('주문취소')" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">주문취소</button>
            <button onclick="deleteSelectedOrder()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">주문삭제</button>
            <button onclick="window.open('https://sowonnamoo.github.io/myboard/index1', '_blank', 'width=800,height=900')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">✏️ 글쓰기</button>
        </div>
    </div>

    <!-- 세금계산서/현금영수증/카드전표 신청 목록 — 주문은 예전에 했어도, 나중에 신청한 건까지 다 보임 -->
    <div class="max-w-3xl mx-auto bg-white p-5 rounded-2xl shadow-md border border-slate-200 mb-10">
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-bold text-base text-slate-800">🧾 계산서/영수증/카드전표 신청 목록</h2>
            <button onclick="loadReceiptListPanel()" class="text-xs text-slate-500 hover:text-slate-700 underline">새로고침</button>
        </div>
        <p class="text-xs text-slate-400 mb-3">최근 3일 이내 신규 신청은 <span class="text-red-500 font-bold">NEW</span> 표시됩니다. 아이콘을 누르면 신청 내용을 다운로드합니다. <b>검색은 최근 것만이 아니라 등록된 전체 내역에서 찾습니다.</b></p>
        <div class="flex gap-2 mb-3">
            <input id="receipt-search-name" type="text" oninput="filterReceipts()" placeholder="이름으로 검색" class="flex-1 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-slate-400">
            <input id="receipt-search-phone" type="text" oninput="filterReceipts()" placeholder="전화번호로 검색" class="flex-1 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-slate-400">
        </div>
        <div id="receipt-list-panel" class="text-sm text-slate-600 space-y-2"></div>
        <div class="text-center mt-4">
            <button id="receipt-more-btn" onclick="showMoreReceipts()" class="hidden bg-white border border-slate-300 text-slate-700 px-6 py-2 rounded-xl text-xs font-semibold hover:bg-slate-50 transition">더 보기 ▾</button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getFirestore, collection, getDocs, deleteDoc, updateDoc, doc, query, orderBy, limit, getDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import {
        getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ---- Firebase 연결 (board-291e3 프로젝트 하나만 사용) ----
    const firebaseConfig = {
        apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };
    const boardApp = initializeApp(firebaseConfig);
    const db = getFirestore(boardApp);
    const auth = getAuth(boardApp);

    // ---- 관리자 로그인 처리 (board-291e3 프로젝트 하나만 로그인하면 됨) ----
    const loginScreenEl = document.getElementById('login-screen');
    const adminContentEl = document.getElementById('admin-content');
    const loginFormEl = document.getElementById('login-form');
    const loginErrorEl = document.getElementById('login-error');
    const loginSubmitBtnEl = document.getElementById('login-submit-btn');

    let appStarted = false;

    function tryShowAdmin() {
        if (!appStarted) {
            appStarted = true;
            loginScreenEl.classList.add('hidden');
            adminContentEl.classList.remove('hidden');
            startApp();
        }
    }

    onAuthStateChanged(auth, (user) => {
        const wasStarted = appStarted;
        if (!user) {
            if (wasStarted) location.reload(); // 세션 종료 시 로그인 화면으로 복귀
            return;
        }
        tryShowAdmin();
    });

    loginFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginErrorEl.classList.add('hidden');
        loginSubmitBtnEl.disabled = true;
        loginSubmitBtnEl.textContent = '로그인 중...';
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            // 로그인 성공하면 onAuthStateChanged가 자동으로 화면 전환함
        } catch (err) {
            console.error('로그인 실패:', err);
            loginErrorEl.textContent = '로그인에 실패했습니다. 이메일/비밀번호를 확인해주세요.';
            loginErrorEl.classList.remove('hidden');
            signOut(auth).catch(() => {});
        } finally {
            loginSubmitBtnEl.disabled = false;
            loginSubmitBtnEl.textContent = '로그인';
        }
    });

    window.adminLogout = function() {
        signOut(auth).catch(() => {});
        location.reload();
    };

    // 하이픈 등 형식이 섞여 있어도 숫자만 비교하도록 정규화
    function normalizePhone(s) {
        return String(s || '').replace(/[^0-9]/g, '');
    }

    // [추가] 세금계산서/현금영수증(segum1)·카드전표(cardjun1) 등록 여부 + 실제 내용 — 전화번호 기준
    // 1회 등록(매월/매주 자동발행 신청)이라 페이지 로드 시 한 번만 통째로 불러와서 캐시해둠
    let taxByPhone = new Map();   // phone -> segum1 데이터(type='tax')
    let cashByPhone = new Map();  // phone -> segum1 데이터(type='cash')
    let cardByPhone = new Map();  // phone -> cardjun1 데이터

    async function loadReceiptRegistrations() {
        try {
            const [segumSnap, cardSnap] = await Promise.all([
                getDocs(collection(db, "segum1")),
                getDocs(collection(db, "cardjun1"))
            ]);
            segumSnap.forEach(d => {
                const v = d.data();
                const p = normalizePhone(v.phone);
                if (!p) return;
                if (v.type === 'tax') taxByPhone.set(p, v);
                else if (v.type === 'cash') cashByPhone.set(p, v);
            });
            cardSnap.forEach(d => {
                const v = d.data();
                const p = normalizePhone(v.phone);
                if (p) cardByPhone.set(p, v);
            });
        } catch (e) {
            console.error('영수증 등록 정보 로드 실패:', e);
        }
    }

    // 아이콘 클릭 시 신청 내용을 메모장(txt)으로 다운로드
    window.downloadReceiptInfo = function(kind, phone) {
        const p = normalizePhone(phone);
        let title = '', v = null;

        if (kind === 'tax') { title = '세금계산서 신청내용'; v = taxByPhone.get(p); }
        else if (kind === 'cash') { title = '현금영수증 신청내용'; v = cashByPhone.get(p); }
        else if (kind === 'card') { title = '카드전표 신청내용'; v = cardByPhone.get(p); }

        if (!v) { alert('신청 내용을 찾을 수 없습니다.'); return; }

        let lines = [`[${title}]`, `성함: ${v.name || '-'}`, `전화번호: ${v.phone || '-'}`, ''];
        if (kind === 'tax') {
            lines.push(
                `사업자등록번호: ${v.bizNum || '-'}`,
                `업태: ${v.bizType || '-'}`,
                `종목: ${v.bizItem || '-'}`,
                `상호명: ${v.bizName || '-'}`,
                `발행 이메일: ${v.email || '-'}`,
                `담당자: ${v.manager || '-'}`,
                `담당자 연락처: ${v.managerPhone || '-'}`
            );
        } else if (kind === 'cash') {
            lines.push(
                `현금영수증 발행번호(사업자/전화번호): ${v.cashNumber || '-'}`,
                `발행 이메일: ${v.email || '-'}`
            );
        } else if (kind === 'card') {
            lines.push(`영수증 수령 이메일: ${v.email || '-'}`);
        }

        const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${title}_${v.name || ''}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
    };

    // Firestore Timestamp든(게시판 주문) 문자열 날짜든(장바구니 주문 — createdAt이 ISO 문자열로
    // 저장되어 있음) 상관없이 안전하게 Date로 변환
    function toDateSafe(val) {
        if (!val) return null;
        if (typeof val.toDate === 'function') return val.toDate();
        const d = new Date(val);
        return isNaN(d.getTime()) ? null : d;
    }

    // ---- 주문 문서를 화면에서 쓰기 좋은 형태로 통일 (게시판형: boards/jjjj) ----
    function normalizeDoc(id, data, source, dbKind, typeLabel) {
        return {
            id, source, dbKind, typeLabel,
            author: data.author || '-',
            phone: data.phone || '-',
            productName: data.productName || '-',
            quantity: data.quantity || '-',
            size: data.size || '-',
            finishings: data.finishings || '',
            address: data.address || '-',
            message: data.message || '-',
            price: data.price || 0,
            images: [data.file1Url, data.file2Url]
                .filter(u => u && typeof u === 'string')
                .map((u, i) => ({ url: u, label: `파일${i + 1}` })),
            status: data.status,
            woonso1: data.woonso1 || '',
            ip: data.ip,
            createdAt: data.createdAt,
            raw: data
        };
    }

    // 주문 내용을 메모장(txt)으로 다운로드 — 게시판형/장바구니형 둘 다 동일하게 동작
    window.downloadOrder = function(data, dateStr) {
        const text = `${data.author}님 ${data.phone}\n${data.address}\n상품: ${data.productName} / 사이즈: ${data.size} / 수량: ${data.quantity}${data.finishings ? `\n후가공: ${data.finishings}` : ''}\n금액: ${data.price}원\n접수일: ${dateStr}\n\n[메시지]\n${data.message}`;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${data.author}_주문서.txt`;
        a.click();
    };

    // boards 주문을 삭제할 때, 남겨두면 개인정보만 고아로 남는 private 서브컬렉션도 함께 지웁니다.
    // (boards/jjjj 둘 다 동일한 구조 - source를 그대로 컬렉션명으로 사용)
    async function cleanupPrivateData(source, docId) {
        try {
            const privSnap = await getDocs(collection(db, source, docId, "private"));
            await Promise.all(privSnap.docs.map(d => deleteDoc(d.ref)));
        } catch (e) {
            console.error('개인정보(private) 삭제 실패:', source, docId, e);
        }
    }

    window.deleteDocById = async function(id, source, dbKind) {
        if (confirm("정말 삭제하시겠습니까?")) {
            if (source === 'boards' || source === 'jjjj') await cleanupPrivateData(source, id);
            await deleteDoc(doc(db, source, id));
            loadAllOrders();
        }
    };

    // 다른 도메인(R2/카페24 등) 파일은 <a download> 속성이 브라우저에서 무시되고
    // 그냥 새 탭에 열려버리는 경우가 많아서, 파일을 직접 받아와(blob) 강제로 다운로드시킴
    window.downloadFile = async function(url, filename) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('파일을 불러오지 못했습니다');
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
        } catch (e) {
            console.error('다운로드 실패:', e);
            alert('직접 다운로드에 실패해서 새 탭에서 열어드립니다. 열린 화면에서 우클릭 → 다른 이름으로 저장 해주세요.');
            window.open(url, '_blank');
        }
    };

    // ---- R2 파일 삭제 ----
    // 업로드 때 쓰는 것과 같은 Worker(r2.ecogr.workers.dev)를 사용합니다.
    // 이 워커의 다운로드/삭제 URL은 "?name=파일명" 형태의 쿼리파라미터를 씁니다.
    const R2_WORKER_URL = "https://r2.ecogr.workers.dev/";

    // 다운로드 URL에서 R2에 저장된 실제 파일명(name 파라미터)을 뽑아냅니다.
    // 예: https://r2.ecogr.workers.dev/?name=홍길동_1719999999_원본.jpg -> 홍길동_1719999999_원본.jpg
    function getR2KeyFromUrl(url) {
        try {
            const u = new URL(url);
            return u.searchParams.get("name");
        } catch (e) {
            return null;
        }
    }

    // "삭제" 버튼: 누르면 바로 R2에서 파일을 지웁니다. (복구 불가)
    window.deleteR2File = async function(url, label, btnEl) {
        const key = getR2KeyFromUrl(url);
        if (!key) { alert('파일 경로를 확인할 수 없습니다.'); return; }
        if (!confirm(`"${label}" 파일을 지금 바로 삭제하시겠습니까?\n삭제하면 복구할 수 없습니다.`)) return;

        try {
            const res = await fetch(`${R2_WORKER_URL}?name=${encodeURIComponent(key)}`, {
                method: 'DELETE'
            });
            if (!res.ok) throw new Error(await res.text().catch(() => res.statusText));
            alert('파일이 삭제되었습니다.');
            if (btnEl) {
                const row = btnEl.closest('.flex');
                if (row) row.remove(); else { btnEl.textContent = '삭제됨'; btnEl.disabled = true; }
            }
        } catch (e) {
            console.error('파일 삭제 실패:', e);
            alert('파일 삭제에 실패했습니다.');
        }
    };


    window.copyIp = function(ip) {
        if (!ip) { alert("IP 정보가 없습니다."); return; }
        navigator.clipboard.writeText(ip).then(() => alert("IP 복사 완료: " + ip));
    };

    let currentPage = 1;
    let currentSelected = { id: "", collection: "", dbKind: "" };
    let cachedDocs = [];
    let visibleCount = 5;

    async function fetchOrders() {
        const limitCount = currentPage * 10;
        const q1 = query(collection(db, "boards"), orderBy("createdAt", "desc"), limit(limitCount));
        const q2 = query(collection(db, "jjjj"), orderBy("createdAt", "desc"), limit(limitCount));

        const [snapshot1, snapshot2] = await Promise.all([getDocs(q1), getDocs(q2)]);

        // 개인정보는 이제 관리자 전용 컬렉션 adminOrders/{boardId}에 문서 ID로 바로 저장됩니다.
        // (boards/jjjj/{id}/private/{secretId}는 고객용 조회 그대로 유지되고, 관리자 페이지는 이걸 건드리지 않습니다.)
        // 문서 ID가 boardId 그대로라 secretId 계산이나 list 조회 없이 getDoc 단건으로 바로 가져옵니다.
        async function fetchPrivateData(docId) {
            try {
                const snap = await getDoc(doc(db, "adminOrders", docId));
                return snap.exists() ? snap.data() : {};
            } catch (e) {
                // 관리자 권한이 아니거나(admins 컬렉션 미등록) 규칙 미배포 시 여기로 옴
                console.error('개인정보(phone/address) 조회 실패 - admins 컬렉션에 계정이 등록돼 있는지 확인하세요:', docId, e);
                return {};
            }
        }

        const [boardPrivates, jjjjPrivates] = await Promise.all([
            Promise.all(snapshot1.docs.map(d => fetchPrivateData(d.id))),
            Promise.all(snapshot2.docs.map(d => fetchPrivateData(d.id)))
        ]);

        let allDocs = [];
        snapshot1.forEach((d, idx) => {
            const merged = { ...d.data(), ...boardPrivates[idx] };
            allDocs.push(normalizeDoc(d.id, merged, 'boards', 'board', '일반'));
        });
        snapshot2.forEach((d, idx) => {
            const merged = { ...d.data(), ...jjjjPrivates[idx] };
            allDocs.push(normalizeDoc(d.id, merged, 'jjjj', 'board', '재주문'));
        });

        allDocs = allDocs.filter(data => toDateSafe(data.createdAt) !== null);
        allDocs = allDocs.filter(data => !data.raw.hasOwnProperty('test') && data.raw.isDeleted !== true);
        allDocs = allDocs.filter(data => data.status !== '주문취소');
        allDocs.sort((a, b) => toDateSafe(b.createdAt) - toDateSafe(a.createdAt));

        cachedDocs = allDocs;
    }

    async function renderVisible() {
        const tbody = document.getElementById("orders-tbody");
        tbody.innerHTML = "";

        const visibleDocs = cachedDocs.slice(0, visibleCount);

        visibleDocs.forEach(data => {
            // 상태 아이콘
            let statusIcon = "";
            if (data.status === "카드결제" || data.status === "결제완료") {
                statusIcon = `<span class="bg-blue-500 text-white text-[9px] px-1.5 rounded-full mr-1">카</span>`;
            } else if (data.status === "무통장") {
                statusIcon = `<span class="bg-emerald-500 text-white text-[9px] px-1.5 rounded-full mr-1">무</span>`;
            } else if (data.status === "입금대기") {
                statusIcon = `<span class="bg-amber-500 text-white text-[9px] px-1.5 rounded-full mr-1">대</span>`;
            }

            const d = toDateSafe(data.createdAt);
            const dateStr = `${d.getFullYear()} ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

            let fileButtons = "";
            const author = data.author || '주문';
            data.images.forEach((img, idx) => {
                const safeLabel = String(img.label || '').replace(/'/g, "\\'");
                fileButtons += `
                    <div class="flex gap-1 mb-1">
                        <button type="button" onclick="downloadFile('${img.url}', '${author}_${img.label}')" class="flex-1 bg-orange-50 text-orange-600 px-1.5 py-1 rounded-lg text-center font-medium hover:bg-orange-100 transition truncate" title="${img.label}">${img.label}</button>
                        <button type="button" onclick="deleteR2File('${img.url}', '${safeLabel}', this)" title="R2에서 즉시 삭제" class="shrink-0 bg-red-50 text-red-600 px-1.5 py-1 rounded-lg font-medium hover:bg-red-100 transition">삭제</button>
                    </div>`;
            });

            const typeBadgeColor = data.typeLabel === '재주문' ? 'bg-slate-100 text-slate-600' : 'bg-gray-100 text-gray-600';

            const woonsoButton = data.woonso1
                ? `<a href="${data.woonso1}" target="_blank" class="block mt-1 bg-purple-500 text-white text-[9px] px-1.5 py-1 rounded-lg w-full text-center font-medium hover:bg-purple-600 transition">🚚 보기</a>`
                : '';
            const woonsoMsg = data.woonso1 ? '<span class="text-emerald-600 font-bold text-[9px] block mt-0.5">송장등록완</span>' : '';

            // [추가] 이 고객(전화번호)이 세금계산서/현금영수증/카드전표를 등록해뒀으면 아이콘으로 표시
            // (셋 다 동시에 등록된 경우도 있어서, 텍스트 배지 대신 작은 아이콘으로 압축).
            // 클릭하면 신청 내용을 메모장(txt)으로 다운로드함.
            const custPhone = normalizePhone(data.phone);
            const receiptBadges = [
                taxByPhone.has(custPhone) ? `<button type="button" onclick="downloadReceiptInfo('tax', '${custPhone}')" title="세금계산서 신청내용 다운로드" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-[11px] hover:bg-indigo-200 transition">📋</button>` : '',
                cashByPhone.has(custPhone) ? `<button type="button" onclick="downloadReceiptInfo('cash', '${custPhone}')" title="현금영수증 신청내용 다운로드" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-teal-100 text-teal-700 text-[11px] hover:bg-teal-200 transition">🧾</button>` : '',
                cardByPhone.has(custPhone) ? `<button type="button" onclick="downloadReceiptInfo('card', '${custPhone}')" title="카드전표 신청내용 다운로드" class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-pink-100 text-pink-700 text-[11px] hover:bg-pink-200 transition">💳</button>` : ''
            ].filter(Boolean).join('');

            tbody.innerHTML += `
                <tr class="text-center transition">
                    <td class="p-3">
                        <input type="checkbox" class="w-4 h-4 cursor-pointer accent-blue-600" onchange="toggleSelect(this, '${data.id}', '${(data.author || '').replace(/'/g, '')}', '${data.source}', '${data.dbKind}')">
                    </td>
                    <td class="p-3 text-slate-500 whitespace-nowrap">${dateStr}</td>
                    <td class="p-3"><span class="badge ${typeBadgeColor}">${data.typeLabel}</span></td>
                    <td class="p-3 font-bold text-left text-slate-800">
                        ${statusIcon}${data.author || "-"}
                        ${receiptBadges ? `<div class="mt-1 flex flex-wrap gap-1">${receiptBadges}</div>` : ''}
                    </td>
                    <td class="p-3 text-slate-600">${data.phone || "-"}</td>
                    <td class="p-3 text-slate-600 text-left">
                        ${data.productName || "-"}/${data.quantity || "-"}/${data.size || "-"}
                        ${data.finishings ? `<div class="text-xs text-amber-600 font-medium mt-0.5">🔧 후가공: ${data.finishings}</div>` : ''}
                    </td>
                    <td class="p-3 text-left text-slate-600">${data.address || "-"}</td>
                    <td class="p-3 font-semibold text-slate-700">${(data.price || 0).toLocaleString ? (data.price || 0).toLocaleString() : (data.price || 0)}</td>
                    <td class="p-3 font-bold text-blue-600">${data.status || '대기'}${woonsoMsg}</td>
                    <td class="p-3 min-w-[150px] max-w-[210px]">${fileButtons || "-"}</td>
                    <td class="p-3"><button onclick="downloadOrder(${JSON.stringify(data).replace(/"/g, "'")}, '${dateStr}')" class="bg-emerald-50 text-emerald-700 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-emerald-100 transition">다운</button></td>
                    <td class="p-3 min-w-[110px]">
                        <input type="text" id="url-${data.id}" value="${data.woonso1 || ''}" class="w-full border border-slate-200 rounded-lg p-1.5 text-[10px] mb-1 outline-none focus:border-blue-400" placeholder="URL 입력">
                        <button onclick="saveWoonso('${data.id}', '${data.source}', '${data.dbKind}')" class="bg-slate-800 text-white px-2 py-1 text-[10px] rounded-lg hover:bg-slate-900 transition w-full font-medium">저장</button>
                        ${woonsoButton}
                    </td>
                    <td class="p-3">
                        <button onclick="copyIp('${data.ip || ''}')" class="text-blue-600 font-bold block w-full hover:underline">IP</button>
                        <button onclick="deleteDocById('${data.id}', '${data.source}', '${data.dbKind}')" class="text-red-500 font-bold block w-full mt-1.5 hover:underline">삭제</button>
                    </td>
                </tr>
            `;
        });

        // 더 보여줄 게 있으면(캐시에 남은 게 있거나, 이번에 꽉 채워서 가져와서 더 있을 수도 있으면) 버튼 노출
        const mightHaveMore = visibleCount < cachedDocs.length || cachedDocs.length === currentPage * 10;
        document.getElementById('more-btn').style.display = mightHaveMore ? 'inline-block' : 'none';
    }

    window.loadAllOrders = async function() {
        currentPage = 1;
        visibleCount = 5;
        await fetchOrders();
        await renderVisible();
        const stamp = document.getElementById('last-refreshed-at');
        if (stamp) {
            const now = new Date();
            stamp.textContent = `마지막 갱신: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }
    };

    // 새로 작성된 글(익명 로그인 포함)을 반영하기 위한 새로고침.
    // loadAllOrders()와 달리 currentPage/visibleCount(= "더 보기"로 펼쳐 놓은 상태)는 그대로 유지한 채
    // 목록만 최신으로 다시 불러옵니다.
    window.refreshOrdersKeepView = async function() {
        try {
            await fetchOrders();
            await renderVisible();
            const stamp = document.getElementById('last-refreshed-at');
            if (stamp) {
                const now = new Date();
                stamp.textContent = `마지막 갱신: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            }
        } catch (e) {
            console.error('주문 목록 새로고침 실패:', e);
        }
    };



    window.loadMoreOrders = async function() {
        visibleCount += 5;
        // 캐시에 남은 게 부족하고, 이전에 가져온 게 꽉 찬 상태였으면(더 있을 가능성) 추가로 불러옴
        if (visibleCount > cachedDocs.length && cachedDocs.length === currentPage * 10) {
            currentPage++;
            await fetchOrders();
        }
        await renderVisible();
    };

    // 운송장 URL만 별도로 저장 (표 안 입력창에서 바로)
    window.saveWoonso = async (id, source, dbKind) => {
        const url = document.getElementById(`url-${id}`).value;
        try {
            await updateDoc(doc(db, source, id), { woonso1: url });
            alert("운송장 URL이 저장되었습니다.");
            loadAllOrders();
        } catch (e) {
            alert("저장 실패: " + e.message);
        }
    };

    // 표에서 체크박스로 고른 행을 하단 상태변경 버튼의 대상으로 지정
    window.toggleSelect = (checkbox, id, author, source, dbKind) => {
        if (checkbox.checked) {
            currentSelected = { id, collection: source, dbKind };
            document.getElementById('selected-name').innerText = `${author} (${source})`;
            document.querySelectorAll('input[type="checkbox"]').forEach(el => {
                if (el !== checkbox) el.checked = false;
            });
        } else {
            currentSelected = { id: "", collection: "", dbKind: "" };
            document.getElementById('selected-name').innerText = "없음";
        }
    };

    // 체크된 주문의 상태를 변경 — 게시판형/장바구니형 상관없이 동일하게 적용
    window.updateStatus = async (value) => {
        if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
        try {
            const docRef = doc(db, currentSelected.collection, currentSelected.id);
            const updateData = { status: value };
            if (value === '접수에러') updateData.sian = '에러';

            // [추가] 결제 확정 상태(무통장/카드결제)로 처음 바뀌는 시점의 시각을 paidAt으로 기록.
            // 포토 후기 작성 가능 기간(결제 후 30일, 이후 자동 블라인드)의 기준 시각으로 search.html에서 사용됨.
            // 이미 기록돼 있으면 덮어쓰지 않음 — 상태를 여러 번 바꿔도 활성기간이 다시 늘어나지 않게 함.
            if (value === '무통장' || value === '카드결제') {
                const snap = await getDoc(docRef);
                if (snap.exists() && !snap.data().paidAt) {
                    updateData.paidAt = serverTimestamp();
                }
            }

            await updateDoc(docRef, updateData);
            alert("상태 변경 완료: " + value);
            loadAllOrders();
        } catch (e) {
            alert("업데이트 실패: " + e.message);
        }
    };

    // 체크된 주문을 파이어베이스에서 완전히 삭제 (상태변경이 아니라 문서 자체를 삭제)
    window.deleteSelectedOrder = async () => {
        if (!currentSelected.id) return alert("표에서 주문을 체크해주세요.");
        if (!confirm("정말로 이 주문을 삭제하시겠습니까?\n삭제한 주문은 복구할 수 없습니다.")) return;

        try {
            if (currentSelected.collection === 'boards' || currentSelected.collection === 'jjjj') {
                await cleanupPrivateData(currentSelected.collection, currentSelected.id);
            }
            await deleteDoc(doc(db, currentSelected.collection, currentSelected.id));
            alert("주문이 삭제되었습니다.");

            currentSelected = { id: "", collection: "", dbKind: "" };
            document.getElementById('selected-name').innerText = "없음";

            loadAllOrders();
        } catch (e) {
            alert("삭제 실패: " + e.message);
        }
    };


    // ---------------- 계산서/영수증/카드전표 신청 목록 (예전 주문 + 나중 신청 케이스 대응) ----------------
    // 위 주문 표의 아이콘은 "지금 화면에 보이는 주문"에만 붙어서, 예전에 주문하고
    // 나중에서야 계산서/영수증을 신청한 고객은 놓칠 수 있음. 그래서 segum1/cardjun1을
    // 통째로 별도 목록으로 보여줘서, 주문 표를 안 스크롤해도 신청 전체를 다 확인 가능하게 함.
    function receiptDateStr(v) {
        const dt = v.createdAt?.toDate ? v.createdAt.toDate() : null;
        if (!dt) return { text: '(등록시각 기록 이전)', isNew: false };
        const text = `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
        const isNew = (Date.now() - dt.getTime()) < 3 * 24 * 60 * 60 * 1000; // 3일 이내면 NEW
        return { text, isNew, sortValue: dt.getTime() };
    }

    let receiptItemsCache = [];
    let receiptVisibleCount = 5;
    let receiptSearchName = '';
    let receiptSearchPhone = '';
    const RECEIPT_PAGE_SIZE = 5;

    window.filterReceipts = function() {
        receiptSearchName = document.getElementById('receipt-search-name').value.trim();
        receiptSearchPhone = normalizePhone(document.getElementById('receipt-search-phone').value);
        receiptVisibleCount = RECEIPT_PAGE_SIZE; // 검색하면 페이지도 처음부터 다시
        renderReceiptPanel();
    };

    function renderReceiptPanel() {
        const panelEl = document.getElementById('receipt-list-panel');
        const moreBtn = document.getElementById('receipt-more-btn');

        const hasSearch = receiptSearchName || receiptSearchPhone;
        const filtered = hasSearch
            ? receiptItemsCache.filter(it =>
                (!receiptSearchName || (it.name || '').includes(receiptSearchName)) &&
                (!receiptSearchPhone || normalizePhone(it.phone).includes(receiptSearchPhone))
              )
            : receiptItemsCache;

        if (filtered.length === 0) {
            panelEl.innerHTML = `<div class="text-slate-400">${hasSearch ? '검색 결과가 없습니다.' : '신청 내역이 없습니다.'}</div>`;
            moreBtn.classList.add('hidden');
            return;
        }

        const kindMeta = {
            tax: { icon: '📋', label: '세금계산서', color: 'indigo' },
            cash: { icon: '🧾', label: '현금영수증', color: 'teal' },
            card: { icon: '💳', label: '카드전표', color: 'pink' }
        };

        panelEl.innerHTML = filtered.slice(0, receiptVisibleCount).map(it => {
            const m = kindMeta[it.kind];
            return `
                <div class="flex items-center justify-between border border-slate-200 rounded-xl px-3.5 py-2.5 ${it.issued ? 'opacity-50' : ''}">
                    <div class="flex items-center gap-2.5">
                        <button type="button" onclick="downloadReceiptInfo('${it.kind}', '${normalizePhone(it.phone)}')"
                            class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-${m.color}-100 text-${m.color}-700 text-sm hover:bg-${m.color}-200 transition"
                            title="${m.label} 신청내용 다운로드">${m.icon}</button>
                        <div>
                            <div class="font-semibold text-slate-800">${it.name || '-'} <span class="font-normal text-slate-400">(${it.phone || '-'})</span></div>
                            <div class="text-xs text-slate-400">${m.label} · ${it.text}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${it.isNew && !it.issued ? '<span class="text-[10px] font-bold text-red-500 bg-red-50 px-2 py-1 rounded-full">NEW</span>' : ''}
                        ${it.issued
                            ? `<button type="button" onclick="toggleReceiptIssued('${it.docCollection}', '${it.id}')" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full hover:bg-emerald-100 transition">✅ 발행완료</button>`
                            : `<button type="button" onclick="toggleReceiptIssued('${it.docCollection}', '${it.id}')" class="text-[10px] font-semibold text-slate-500 border border-slate-300 px-2 py-1 rounded-full hover:bg-slate-50 transition">발행완료 체크</button>`}
                    </div>
                </div>`;
        }).join('');

        moreBtn.classList.toggle('hidden', receiptVisibleCount >= filtered.length);
    }

    window.showMoreReceipts = function() {
        receiptVisibleCount += RECEIPT_PAGE_SIZE;
        renderReceiptPanel();
    };

    // 발행완료를 다시 누르면 해제됨(토글) — 실수로 체크했을 때 되돌릴 수 있게
    window.toggleReceiptIssued = async function(docCollection, id) {
        const it = receiptItemsCache.find(x => x.docCollection === docCollection && x.id === id);
        if (!it) return;
        const nextState = !it.issued;
        try {
            await updateDoc(doc(db, docCollection, id), nextState
                ? { issued: true, issuedAt: serverTimestamp() }
                : { issued: false }
            );
            it.issued = nextState;
            renderReceiptPanel();
        } catch (e) {
            alert('처리 실패: ' + e.message);
        }
    };

    window.loadReceiptListPanel = async function() {
        const panelEl = document.getElementById('receipt-list-panel');
        panelEl.innerHTML = '불러오는 중...';
        try {
            const [segumSnap, cardSnap] = await Promise.all([
                getDocs(collection(db, "segum1")),
                getDocs(collection(db, "cardjun1"))
            ]);

            let items = [];
            segumSnap.forEach(d => {
                const v = d.data();
                items.push({
                    id: d.id, docCollection: 'segum1',
                    kind: v.type === 'tax' ? 'tax' : 'cash',
                    name: v.name, phone: v.phone, issued: !!v.issued,
                    ...receiptDateStr(v)
                });
            });
            cardSnap.forEach(d => {
                const v = d.data();
                items.push({
                    id: d.id, docCollection: 'cardjun1',
                    kind: 'card',
                    name: v.name, phone: v.phone, issued: !!v.issued,
                    ...receiptDateStr(v)
                });
            });

            // 최신 등록순 (등록시각 없는 예전 데이터는 맨 뒤로)
            items.sort((a, b) => (b.sortValue || 0) - (a.sortValue || 0));

            receiptItemsCache = items;
            receiptVisibleCount = RECEIPT_PAGE_SIZE;
            receiptSearchName = '';
            receiptSearchPhone = '';
            document.getElementById('receipt-search-name').value = '';
            document.getElementById('receipt-search-phone').value = '';
            renderReceiptPanel();
        } catch (e) {
            console.error(e);
            panelEl.innerHTML = '<div class="text-red-500">불러오는 중 오류가 발생했습니다.</div>';
        }
    };
    // ---------------- 계산서/영수증/카드전표 신청 목록 끝 ----------------


    // 로그인(두 프로젝트 인증 완료) 후 tryShowAdmin()에서 호출됨. 페이지 로드 시 바로 실행되지 않음.
    async function startApp() {
        await loadReceiptRegistrations(); // 먼저 불러와야 첫 렌더링부터 배지가 정확히 뜸
        loadAllOrders();
        loadReceiptListPanel();
    }
</script>
</body>
</html>
