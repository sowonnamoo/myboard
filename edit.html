<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주문정보 수정</title>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<style>
body{ font-family:sans-serif; margin:0; padding:15px; }
h3{ margin-top:0; }
input{ width:100%; box-sizing:border-box; padding:8px; margin-bottom:10px; }
button{ width:100%; height:40px; cursor:pointer; margin-bottom:5px; }
.addr-btn { background-color: #f0f0f0; border: 1px solid #ccc; }
</style>
</head>
<body>

<h3>주문정보 수정</h3>

<input id="author" placeholder="성함">
<input id="phone" placeholder="연락처">

<button type="button" class="addr-btn" onclick="execDaumPostcode()">우편번호 찾기</button>
<input id="address" placeholder="주소">
<input id="address-detail" placeholder="상세주소">

<button id="saveBtn">수정완료</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
    authDomain: "board-291e3.firebaseapp.com",
    projectId: "board-291e3",
    storageBucket: "board-291e3.firebasestorage.app",
    messagingSenderId: "25881766316",
    appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// index1.html(부모 창)에서 이미 구글 로그인을 했다면, 이 페이지의 Auth 인스턴스도
// 잠시 후 같은 로그인 상태를 인식하게 됩니다(브라우저에 저장된 로그인 정보를 읽어오는 데
// 약간의 시간이 걸리므로, 저장 버튼을 누르면 그 로그인 확인이 끝날 때까지 기다립니다).
function waitForAuthReady() {
    return new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
            unsubscribe();
            resolve(user);
        });
    });
}

// 주소 찾기 함수
window.execDaumPostcode = function() {
    new daum.Postcode({
        oncomplete: function(data) {
            document.getElementById("address").value = data.address;
            document.getElementById("address-detail").focus(); // 상세주소로 포커스 이동
        }
    }).open();
}

const params = new URLSearchParams(location.search);
const id = params.get("id");

document.getElementById("author").value = decodeURIComponent(params.get("author") || "");
document.getElementById("phone").value = decodeURIComponent(params.get("phone") || "");

// 저장된 주소값이 "주소 + 상세주소" 형태이므로 분리 로직 필요 (필요 시)
const fullAddress = decodeURIComponent(params.get("address") || "");
// 간단하게 띄어쓰기 기준으로 나누거나, 상세주소를 직접 수정하게 설계
document.getElementById("address").value = fullAddress; 

document.getElementById("saveBtn").onclick = async () => {
    try {
        // 로그인 상태가 아직 확인 중일 수 있으므로, 확인이 끝날 때까지 기다립니다.
        const user = await waitForAuthReady();
        if (!user) {
            alert("로그인 정보가 확인되지 않습니다. 이 창을 닫고 목록 화면에서 다시 로그인 후 수정 버튼을 눌러주세요.");
            return;
        }

        const fullAddr = document.getElementById("address").value.trim() + " " + document.getElementById("address-detail").value.trim();
        
        await updateDoc(doc(db, "boards", id), {
            author: document.getElementById("author").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: fullAddr
        });
        alert("수정 완료");
        if (window.opener) { window.opener.location.reload(); }
        window.close();
    } catch (e) {
        console.error(e);
        alert("수정 실패 : " + e.message);
    }
};
</script>

</body>
</html>
