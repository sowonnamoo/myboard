<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주문정보 수정</title>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<style>
body{ font-family:sans-serif; margin:0; padding:15px; }
h3{ margin-top:0; }
input{ width:100%; box-sizing:border-box; padding:8px; margin-bottom:10px; }
button{ width:100%; height:40px; cursor:pointer; margin-bottom:5px; }
.addr-btn { background-color: #f0f0f0; border: 1px solid #ccc; }
</style>
</head>
<body>

<h3>주문정보 수정</h3>

<input id="author" placeholder="성함">
<input id="phone" placeholder="연락처">

<button type="button" class="addr-btn" onclick="execDaumPostcode()">우편번호 찾기</button>
<input id="address" placeholder="주소">
<input id="address-detail" placeholder="상세주소">

<button id="saveBtn">수정완료</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
    authDomain: "board-291e3.firebaseapp.com",
    projectId: "board-291e3",
    storageBucket: "board-291e3.firebasestorage.app",
    messagingSenderId: "25881766316",
    appId: "1:25881766316:web:c03e118cf26d3fff11b209"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// 글쓴이 창(index1.html)에서 이미 익명 로그인이 되어 있다면 이 창도 같은 uid를 이어받고,
// 혹시 아직 로그인 전이라면 여기서 익명 로그인을 한 번 더 시도합니다.
function waitForAuthReady() {
    return new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
            if (user) {
                unsubscribe();
                resolve(user);
            } else {
                signInAnonymously(auth).catch((e) => console.error("익명 로그인 실패:", e));
            }
        });
    });
}

// 주소 찾기 함수
window.execDaumPostcode = function() {
    new daum.Postcode({
        oncomplete: function(data) {
            document.getElementById("address").value = data.address;
            document.getElementById("address-detail").focus(); // 상세주소로 포커스 이동
        }
    }).open();
}

const params = new URLSearchParams(location.search);
const id = params.get("id");
const key = params.get("key"); // secretId - boards/{id}/private/{key} 문서를 직접 조회하기 위한 키

document.getElementById("author").value = decodeURIComponent(params.get("author") || "");

// phone/address는 더 이상 URL로 전달되지 않으므로(개인정보 노출 방지),
// key(secretId)를 이용해 boards/{id}/private/{key} 문서를 직접 읽어와 폼을 채웁니다.
// (Firestore 규칙상 private 문서는 get이 누구나 가능하지만, secretId를 모르면 애초에 경로를 알 수 없습니다)
async function loadPrivateData() {
    if (!id || !key) {
        console.error("id 또는 key(secretId)가 URL에 없습니다.");
        return;
    }
    try {
        const snap = await getDoc(doc(db, "boards", id, "private", key));
        if (snap.exists()) {
            const p = snap.data();
            document.getElementById("phone").value = p.phone || "";
            document.getElementById("address").value = p.address || "";
        } else {
            alert("주문 정보를 찾을 수 없습니다. 창을 닫고 다시 시도해주세요.");
        }
    } catch (e) {
        console.error("개인정보 조회 실패:", e);
        alert("주문 정보를 불러오지 못했습니다: " + e.message);
    }
}
loadPrivateData();

document.getElementById("saveBtn").onclick = async () => {
    try {
        // 익명 로그인이 끝날 때까지 기다립니다.
        await waitForAuthReady();

        const fullAddr = document.getElementById("address").value.trim() + " " + document.getElementById("address-detail").value.trim();
        
        await updateDoc(doc(db, "boards", id), {
            author: document.getElementById("author").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: fullAddr
        });
        alert("수정 완료");
        if (window.opener) { window.opener.location.reload(); }
        window.close();
    } catch (e) {
        console.error(e);
        if (e.code === "permission-denied") {
            alert("본인이 작성한 글만 수정할 수 있습니다. (다른 기기/브라우저에서 작성한 글이거나, 브라우저 데이터를 지운 경우 본인 글로 인식되지 않을 수 있습니다.)");
        } else {
            alert("수정 실패 : " + e.message);
        }
    }
};
</script>

</body>
</html>
