<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세금계산서 등록</title>
<style>
    body { font-family: sans-serif; padding: 20px; background: #fff; }
    .box { max-width: 450px; margin: 0 auto; padding: 0; border: none; background: white; }
    input { width: 100%; padding: 8px; margin: 3px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 12px; background: #03c75a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .notice { font-size: 12px; color: #444; line-height: 1.6; background: #f5f5f5; padding: 12px; border-radius: 6px; margin: 15px 0; }
    .warn { font-size: 12px; color: #d32f2f; font-weight: bold; margin-top: 6px; }
    label { display:block; font-size:12px; font-weight:bold; color:#555; margin-top:10px; }
</style>
</head>
<body>

<div class="box">
    <h3>세금계산서 등록</h3>

    <div class="notice">
        본 접수된 건의 <b>작성자성함 / 전화번호</b>로 접수된 건에 한해서, 구입 시 세금계산서는 매월 1일 자동 발행됩니다.
        <div class="warn">※ 작성자 성함 또는 전화번호가 바뀐 경우, 필히 다시 신청해주세요.</div>
    </div>

    <input type="hidden" id="docId">

    <label>상품 구입시 작성자 성함</label>
    <input type="text" id="name" placeholder="작성자 성함">
    <label>상품 구입시 전화번호</label>
    <input type="text" id="phone" placeholder="전화번호 (숫자만)">

    <label>사업자 등록번호</label>
    <input type="text" id="bizNum" placeholder="사업자 등록번호">
    <label>업태</label>
    <input type="text" id="bizType" placeholder="업태">
    <label>종목</label>
    <input type="text" id="bizItem" placeholder="종목">
    <label>상호명</label>
    <input type="text" id="bizName" placeholder="상호명">
    <label>발행받을 이메일</label>
    <input type="email" id="email" placeholder="발행받을 이메일">
    <label>담당자 성함</label>
    <input type="text" id="manager" placeholder="담당자 성함">
    <label>담당자 연락처</label>
    <input type="text" id="managerPhone" placeholder="담당자 연락처">

    <button onclick="saveData()">신청 / 수정하기</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION_NAME = "segum1";

    // 다른 페이지(app.js)의 secretId 계산 방식과 동일한 원리:
    // 이름+전화번호로 문서 ID를 계산해서, 같은 이름+전화번호로 다시 신청하면
    // 자동으로 "그 사람의 기존 등록 정보"를 덮어쓰게(수정) 됩니다.
    // 이 ID를 모르면 남이 조회할 수 없어서, 본인만 확인 가능한 저장소 역할을 합니다.
    async function sha256Hex(text) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function normalizeName(name) { return String(name || "").trim(); }
    function normalizePhone(phone) { return String(phone || "").replace(/[^0-9]/g, ""); }
    async function computeDocId(name, phone) {
        return sha256Hex(`segum::${normalizeName(name)}::${normalizePhone(phone)}`);
    }

    window.saveData = async () => {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!name || !phone) {
            alert('작성자 성함과 전화번호는 필수입니다.');
            return;
        }

        const data = {
            name, phone, type: 'tax',
            bizNum: document.getElementById('bizNum').value.trim(),
            bizType: document.getElementById('bizType').value.trim(),
            bizItem: document.getElementById('bizItem').value.trim(),
            bizName: document.getElementById('bizName').value.trim(),
            email: document.getElementById('email').value.trim(),
            manager: document.getElementById('manager').value.trim(),
            managerPhone: document.getElementById('managerPhone').value.trim(),
            updatedAt: serverTimestamp()
        };

        if (!data.bizNum || !data.bizType || !data.bizItem || !data.bizName || !data.email || !data.manager || !data.managerPhone) {
            alert('세금계산서 발행을 위한 모든 정보를 빠짐없이 입력해주세요.');
            return;
        }

        try {
            const docId = await computeDocId(name, phone);
            // setDoc + merge: 처음 신청이면 새로 생성, 같은 이름+전화번호로 다시 신청하면 자동 수정(덮어쓰기)
            await setDoc(doc(db, COLLECTION_NAME, docId), data, { merge: true });
            alert('신청이 완료되었습니다.\n매월 1일 자동으로 세금계산서가 발행됩니다.');
            location.reload();
        } catch (e) {
            alert('저장 중 오류가 발생했습니다: ' + e.message);
        }
    };
</script>
</body>
</html>
