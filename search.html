<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <!-- 이름·전화번호·주소 등 개인 주문정보가 노출되는 페이지라 검색엔진에 안 걸리게 막음 -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>주문 조회 검색기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 우클릭(및 우클릭으로 여는 메뉴)으로 이미지/텍스트를 쉽게 저장 못 하게 최소한의 방어 */
        body{ -webkit-touch-callout: none; }

        /* ---------- 시안보기 모달 (새 창 대신 같은 페이지 안에서 열림 —
           브라우저 주소창/탭 높이 때문에 생기던 여백 문제를 원천적으로 없앰) ---------- */
        .sian-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(10,14,18,0.92);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding:24px;
            cursor:zoom-out;
        }
        .sian-modal.active{ display:flex; }
        .sian-modal img{
            max-width:100%;
            max-height:100%;
            display:block;
            cursor:default;
        }
        .sian-modal-close{
            position:fixed;
            top:18px; right:20px;
            background:rgba(255,255,255,0.12);
            color:#fff;
            border:1px solid rgba(255,255,255,0.25);
            border-radius:8px;
            padding:8px 14px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }
        .sian-modal-close:hover{ background:rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 via-slate-50 to-blue-50 p-4 sm:p-6" oncontextmenu="return false;">
    <div class="sian-modal" id="sian-modal" onclick="closeSianImage()">
        <button type="button" class="sian-modal-close" onclick="event.stopPropagation(); closeSianImage()">닫기 ✕</button>
        <img id="sian-modal-img" src="" alt="시안 이미지" onclick="event.stopPropagation()">
    </div>

    <div class="max-w-2xl mx-auto">
     <div class="bg-white/90 backdrop-blur border border-slate-200/80 p-5 sm:p-8 rounded-2xl shadow-lg shadow-slate-200/70 mb-6">
        <div class="flex items-center gap-3 mb-1">
            <div class="w-10 h-10 shrink-0 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-blue-200">ECO</div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-900">주문 내역 조회</h2>
        </div>

        <div class="mb-5 text-xs sm:text-sm text-slate-400">
            * 구입완료건 조회 / 제작상황
        </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <input type="text" id="search-name" class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:flex-grow-[2]" placeholder="이름 입력">

        <input type="text" id="search-phone" class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:w-44" placeholder="전화번호 뒤 4자리" maxlength="4">

        <button id="search-btn" class="w-full sm:w-auto shrink-0 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition text-white px-6 py-3 rounded-xl font-semibold text-sm shadow-sm shadow-blue-200">조회</button>
    </div>
</div>
        <div id="results" class="space-y-4"></div>
    </div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 우클릭(및 모바일 길게 눌러서 뜨는 메뉴) 방지 — 개인 주문정보라 이미지/텍스트를
        // 쉽게 저장/복사하지 못하도록 최소한의 방어 차원. (개발자도구 등 완전 차단은 불가능하지만
        // 일반적인 우클릭 메뉴는 막아둠)
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // 팝업 열기 함수 추가
        window.openPopup = (url) => {
            window.open(url, '_blank', 'width=590,height=830,scrollbars=yes');
        };

        // 시안보기 — 새 창 대신 같은 페이지 안 모달로 열어서, 브라우저 주소창/탭
        // 높이 때문에 생기던 회색 여백 문제를 원천적으로 없앰
        window.viewSianImage = (url) => {
            if(!url) return;
            document.getElementById('sian-modal-img').src = url;
            document.getElementById('sian-modal').classList.add('active');
        };
        window.closeSianImage = () => {
            document.getElementById('sian-modal').classList.remove('active');
            document.getElementById('sian-modal-img').src = '';
        };
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') window.closeSianImage();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
            authDomain: "board-291e3.firebaseapp.com",
            projectId: "board-291e3",
            storageBucket: "board-291e3.firebasestorage.app",
            messagingSenderId: "25881766316",
            appId: "1:25881766316:web:c03e118cf26d3fff11b209"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // cart.html이 저장하는 Firebase 프로젝트(orders 컬렉션) — 원래 검색기가 보던
        // "boards"/"jjjj"와는 완전히 다른 프로젝트라 앱 이름을 따로 줘서 같이 초기화함.
        const cartFirebaseConfig = {
            apiKey: "AIzaSyBzHogA2iaUQqOOsNVL55stsdMH8lCQ4Ek",
            authDomain: "ecogr-636c6.firebaseapp.com",
            projectId: "ecogr-636c6",
            storageBucket: "ecogr-636c6.firebasestorage.app",
            messagingSenderId: "95745358447",
            appId: "1:95745358447:web:94cde53f6b36e6be95eb9a"
        };

        const cartApp = initializeApp(cartFirebaseConfig, "cartApp");
        const cartDb = getFirestore(cartApp);

document.getElementById('search-btn').addEventListener('click', async () => {
    // [추가] 봇 방지 로직: 10회 실패 시 입력값 변조
    let failCount = parseInt(localStorage.getItem('searchFailCount') || '0');
    const phoneInput = document.getElementById('search-phone');
    if (failCount >= 15) {
        const randomDigit = Math.floor(Math.random() * 3) + 1;
        phoneInput.value = phoneInput.value.slice(0, -1) + randomDigit;
    }

    const name = document.getElementById('search-name').value.trim();
    const phone = phoneInput.value.trim(); // 수정된 phoneInput 값 사용
    const resultsDiv = document.getElementById('results');
    
    if (!name || phone.length !== 4) {
        // [추가] 입력 오류 시 카운트 증가
        localStorage.setItem('searchFailCount', parseInt(localStorage.getItem('searchFailCount') || '0') + 1);
        alert("이름과 전화번호 뒷 4자리를 정확히 입력해주세요.");
        return;
    }

    resultsDiv.innerHTML = "조회 중...";

    try {
        const qBoards = query(collection(db, "boards"), where("author", "==", name));
        const qJjjj = query(collection(db, "jjjj"), where("author", "==", name));
        const qCart = query(collection(cartDb, "orders"), where("name", "==", name));

        const [snapBoards, snapJjjj, snapCart] = await Promise.all([getDocs(qBoards), getDocs(qJjjj), getDocs(qCart)]);

        const allDocs = [
            ...snapBoards.docs.map(doc => ({ ...doc.data(), id: doc.id, isJajoo: false, source: 'board' })),
            ...snapJjjj.docs.map(doc => ({ ...doc.data(), id: doc.id, isJajoo: true, source: 'board' })),
            // cart.html의 orders 컬렉션은 필드 구조가 완전히 달라서(author 대신 name,
            // 단일 상품 대신 items 배열) 렌더링에서 쓸 공통 필드만 맞춰서 정규화함.
            ...snapCart.docs.map(doc => {
                const data = doc.data();
                return {
                    ...data,
                    id: doc.id,
                    isJajoo: false,
                    source: 'cart',
                    author: data.name,
                    phone: data.phone
                };
            })
        ];

        const filteredData = allDocs.filter(d => d.phone && d.phone.slice(-4) === phone);

        if(filteredData.length === 0) {
            // [추가] 조회 결과 없을 시 카운트 증가
            localStorage.setItem('searchFailCount', parseInt(localStorage.getItem('searchFailCount') || '0') + 1);
            resultsDiv.innerHTML = "해당하는 주문 정보를 찾을 수 없습니다."; 
            return; 
        }

        // [추가] 성공 시 카운트 초기화
        localStorage.setItem('searchFailCount', '0');

        
filteredData.sort((a, b) => {
    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
    return dateB - dateA;
});

        
        resultsDiv.innerHTML = "";
        if(filteredData.length === 0) { 
            resultsDiv.innerHTML = "해당하는 주문 정보를 찾을 수 없습니다."; 
            return; 
        }

        filteredData.forEach(d => {
            // cart.html(장바구니/결제) 쪽에서 넘어온 주문은 필드 구조가 완전히 달라서
            // (단일 상품이 아니라 items 배열) 따로 간소화된 카드로 렌더링함.
            if (d.source === 'cart') {
                const dateObjCart = d.createdAt?.toDate ? d.createdAt.toDate() : new Date(d.createdAt);
                const dateStrCart = `${dateObjCart.getFullYear()}년 ${dateObjCart.getMonth() + 1}월 ${dateObjCart.getDate()}일`;
                const items = Array.isArray(d.items) ? d.items : [];
                const totalNumber = Number(String(d.total).replace(/[^0-9.-]/g, '')) || 0;

                const itemRows = items.map(it => {
                    const priceNumber = Number(String(it.price).replace(/[^0-9.-]/g, '')) || 0;
                    const qtyLabel = `${it.qty || 1}개${it.count && it.count != 1 ? ` × ${it.count}건` : ''}`;
                    const sianLink = it.compositeImage
                        ? `<a href="javascript:void(0)" onclick="viewSianImage('${it.compositeImage}')" class="text-blue-500 underline">시안보기</a>`
                        : '<span class="text-gray-400">시안없음</span>';
                    return `
                        <div class="flex items-center justify-between text-xs bg-white border rounded px-2 py-1.5 mt-1">
                            <span>${it.item || '상품'} · ${qtyLabel} · ${priceNumber.toLocaleString()}원</span>
                            ${sianLink}
                        </div>`;
                }).join('');

                // cart.html의 saveOrderToFirestore가 저장하는 상태값: "입금대기"(무통장, 확인 전)
                // 또는 "결제완료"(카드결제는 결제 성공 시 바로 이 상태로 저장됨)
                const isPendingCart = d.status === '입금대기';
                const isBankTransferCart = d.payment === '무통장입금';
                const isCardCart = d.payment === '카드결제';

                // 여러 상품이 한 주문에 담기므로, 영수증/카드전표용 상품명·사이즈·수량은
                // 상품들을 합쳐서 하나의 문자열로 구성함
                const productNamesCart = items.map(it => it.item).filter(Boolean).join(', ') || '상품명 없음';
                const sizeLabelCart = items.map(it => (it.width && it.height) ? `${it.width}×${it.height}mm` : '').filter(Boolean).join(', ') || '-';
                const totalQtyCart = items.reduce((sum, it) => sum + ((Number(it.qty) || 1) * (Number(it.count) || 1)), 0);

                const paramsCart = new URLSearchParams({
                    product: productNamesCart, size: sizeLabelCart, qty: String(totalQtyCart || 0),
                    price: String(totalNumber), date: `작성일: ${dateStrCart}`, bizType: '기술서비스', bizItem: '광고, 대행'
                }).toString();

                const cardParamsCart = new URLSearchParams({
                    date: `${dateObjCart.getFullYear()}-${(dateObjCart.getMonth() + 1).toString().padStart(2, '0')}-${dateObjCart.getDate().toString().padStart(2, '0')}`,
                    name: productNamesCart, size: sizeLabelCart, qty: String(totalQtyCart || 0), price: String(totalNumber)
                }).toString();

                resultsDiv.innerHTML += `
                <div class="bg-blue-50 border border-blue-100 p-4 sm:p-6 rounded-2xl shadow-sm mb-4">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3">
                        <div>
                            <h2 class="font-bold text-lg mb-2">🛒 장바구니 주문 (${items.length}건)</h2>
                            <div class="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 gap-x-4 gap-y-1.5 text-sm text-gray-700">
                                <div><span class="font-semibold">작성자:</span> ${d.author || '-'}</div>
                                <div><span class="font-semibold">상태:</span> ${d.status || d.payment || '-'}</div>
                                <div><span class="font-semibold">결제방법:</span> ${d.payment || '-'}</div>
                                <div><span class="font-semibold">총 금액:</span> ${totalNumber.toLocaleString()}원</div>
                                <div><span class="font-semibold">전화번호:</span> ${d.phone || '-'}</div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 text-sm text-gray-600 border-t pt-3">
                        <div><span class="font-semibold">작성일:</span> ${dateStrCart}</div>
                        <div><span class="font-semibold">배송지:</span> ${d.address || '-'}</div>
                        <div class="mt-2"><span class="font-semibold">주문 상품:</span>${itemRows}</div>

                        ${isPendingCart ? `
                        <div class="mt-3 text-sm font-bold text-red-600 bg-red-50 p-2 rounded">
                            *무통장 계좌 : 국민 782301-01-547234 에코그래픽스 ㅣ  * 농협 352-0130-9995-53 최대환
                        </div>` : ''}

                        <div class="mt-4 flex gap-2 flex-wrap">
                            <a href="javascript:void(0)"
                               onclick="${isPendingCart ? '' : "openPopup('https://sowonnamoo.github.io/myboard/segum')"}"
                               class="border px-2 py-1 text-xs ${(isBankTransferCart && !isPendingCart) ? 'hover:bg-gray-100' : 'bg-gray-100 text-gray-400 pointer-events-none'}">계산서/현금영수증</a>

                            <a href="javascript:void(0)"
                               onclick="${isPendingCart ? '' : "openPopup('https://sowonnamoo.github.io/myboard/print3.html?" + paramsCart + "')"}"
                               class="border px-2 py-1 text-xs ${(isBankTransferCart && !isPendingCart) ? 'hover:bg-gray-100' : 'bg-gray-100 text-gray-400 pointer-events-none'}">간이영수증</a>

                            <a href="javascript:void(0)"
                               onclick="${isPendingCart ? '' : "openPopup('https://myboard-delta.vercel.app/cardf.html?" + cardParamsCart + "')"}"
                               class="border px-2 py-1 text-xs ${(isCardCart && !isPendingCart) ? 'hover:bg-gray-100' : 'bg-gray-100 text-gray-400 pointer-events-none'}">카드전표</a>

                            <a href="javascript:void(0)"
                               onclick="${d.woonso1 ? "openPopup('" + d.woonso1 + "')" : ""}"
                               class="border px-2 py-1 text-xs transition-colors duration-300
                               ${d.woonso1
                                   ? 'bg-red-500 text-white border-red-500 hover:bg-red-600 font-bold'
                                   : 'bg-gray-100 text-gray-400 pointer-events-none'
                               }">
                               ${d.woonso1 ? '출고완료/운송장보기' : '운송장'}
                            </a>

                            ${isPendingCart ? `
                            <button onclick="deleteCartOrder('${d.id}')"
                                class="border px-2 py-1 text-xs bg-gray-500 text-white hover:bg-gray-700">주문삭제</button>` : ''}
                        </div>
                    </div>
                </div>`;
                return;
            }

            // [4] 날짜 및 이미지 번호 로직
            const dateObj = d.createdAt?.toDate ? d.createdAt.toDate() : new Date(d.createdAt);
            const phoneFull = (d.phone || "").replace(/[^0-9]/g, "");
            const phonePrefix = phoneFull.slice(0, -2);    
            const year = dateObj.getFullYear().toString().slice(-2);
            const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            const day = dateObj.getDate().toString().padStart(2, '0');
            const hours = dateObj.getHours().toString().padStart(2, '0');
            const minutes = dateObj.getMinutes().toString().padStart(2, '0');
            
            const designNo = d.imgCode || `${phonePrefix}${year}${month}${day}${hours}${minutes}`;
            const dateStr = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;

            // [5] 재구입 버튼 노출 로직 (재주문 건이면 버튼 숨김)
            const reOrderBtn = d.isJajoo ? "" : `
                <button onclick="openPopup('index3.html?productName=${encodeURIComponent(d.author + '님 (' + (d.productName || '상품명') + '/' + (d.quantity || '0') + '/' + (d.size || '0') + ') ' + (d.price || '0') + '원')}&imgCode=${designNo}')" 
                class="bg-black text-white px-6 py-2 rounded font-bold">재구입</button>
            `;

            const isBankTransfer = d.status === '무통장';
            const isCard = d.status === '카드결제';
const isPending = d.status === '대기';
let statusLabel = (d.status === '대기') ? '(접수전/결제확인중)' : 
                  (d.status === '접수에러') ? '(제작보류)' : '(접수완료)';

// [추가된 로직] 시안 완료/출고 상태에 따른 문구 자동 변경
if (d.status !== '대기' && d.status !== '접수에러') {
    if (d.woonso1) {
        statusLabel += ' <span class="text-red-600 font-bold">_출고완료</span>';
    } else if (d.sian === 'done') {
        statusLabel += ' <span class="text-yellow-600 font-bold">_인쇄중</span>';
    }
}
            
            // [6] 영수증 파라미터 구성
            const params = new URLSearchParams({
                product: d.productName || '상품명 없음', size: d.size || '0', qty: d.quantity || '0',
                price: d.price || '0', date: `작성일: ${dateStr}`, bizType: '기술서비스', bizItem: '광고, 대행'
            }).toString();

            const cardParams = new URLSearchParams({
                date: `${dateObj.getFullYear()}-${(dateObj.getMonth() + 1).toString().padStart(2, '0')}-${dateObj.getDate().toString().padStart(2, '0')}`,
                name: d.productName || '상품명 없음', size: d.size || '0', qty: d.quantity || '0', price: d.price || '0'
            }).toString();

            // [7] HTML 렌더링 (누락된 항목 복구 완료)
          resultsDiv.innerHTML += `
    <div class="${d.isJajoo ? 'bg-orange-50' : 'bg-white'} border border-slate-200 p-4 sm:p-6 rounded-2xl shadow-sm mb-4">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3">
            <div>
                <h2 class="font-bold text-lg mb-2">${d.isJajoo ? '📦 재주문_결제즉시 제작시작건_ ' : ''}${d.productName || '상품명 없음'}</h2>
                <div class="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 gap-x-4 gap-y-1.5 text-sm text-gray-700">
                    <div><span class="font-semibold">작성자:</span> ${d.author}</div>
<div><span class="font-semibold">상태:</span> ${d.status || '-'} <span class="text-blue-600 font-bold">${statusLabel}</span></div>
<div><span class="font-semibold">가격:</span> ${d.price || '-'}원</div>
                    <div><span class="font-semibold">수량:</span> ${d.quantity || '-'}개</div>
                    <div><span class="font-semibold">사이즈:</span> ${d.size || '-'}</div>
                    <div><span class="font-semibold">전화번호:</span> ${d.phone || '-'}</div>
                </div>
            </div>
            <div class="flex flex-row sm:flex-col gap-2 flex-wrap">
            ${
    (!d.isJajoo && d.sian !== 'done')

window.deleteOrder = async (docId, isJajoo) => {
    // 경고 메시지 내용 변경
    if (confirm("정말로 이 주문을 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.")) {
        try {
            // isJajoo 값에 따라 컬렉션 경로를 다르게 설정
            const collectionName = isJajoo ? "jjjj" : "boards";
            await deleteDoc(doc(db, collectionName, docId));
            
            alert("삭제되었습니다.");
            document.getElementById('search-btn').click();
        } catch (error) {
            console.error("삭제 실패:", error);
            alert("삭제 중 오류가 발생했습니다.");
        }
    }
};

// 장바구니(cart.html) 쪽 주문은 별도 Firebase 프로젝트(cartDb)의 "orders" 컬렉션에
// 저장돼 있어서, 위 deleteOrder와는 별개로 따로 삭제함
window.deleteCartOrder = async (docId) => {
    if (confirm("정말로 이 주문을 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.")) {
        try {
            await deleteDoc(doc(cartDb, "orders", docId));

            alert("삭제되었습니다.");
            document.getElementById('search-btn').click();
        } catch (error) {
            console.error("삭제 실패:", error);
            alert("삭제 중 오류가 발생했습니다.");
        }
    }
};
