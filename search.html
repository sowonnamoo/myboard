<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <!-- 이름·전화번호·주소 등 개인 주문정보가 노출되는 페이지라 검색엔진에 안 걸리게 막음 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
    <script>
        // 검색/수집 봇이 접속하면 이 아래의 페이지 로딩(조회 화면, 스크립트)을 중단합니다.
        // robots 메타태그를 무시하거나 JS를 실행하는 봇까지 최대한 막기 위한 보조 장치입니다.
        // (일반 사용자 기기 이름에 우연히 걸리지 않도록 정확한 봇 이름만 검사합니다.)
        (function () {
            var botUA = /\b(googlebot|google-inspectiontool|adsbot-google|bingbot|bingpreview|msnbot|yeti|naverbot|daumoa|slurp|duckduckbot|baiduspider|yandexbot|applebot|sogou|facebookexternalhit|twitterbot|ia_archiver|semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|crawler|spider)\b/i;
            if (botUA.test(navigator.userAgent || '')) { window.stop(); }
        })();
    </script>
    <title>주문 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{ -webkit-touch-callout: none; }

        /* ---------- 시안보기 모달 (같은 페이지 안에서 열림) ---------- */
        .sian-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(10,14,18,0.92);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding:24px;
            cursor:zoom-out;
        }
        .sian-modal.active{ display:flex; }
        .sian-modal img{
            max-width:100%;
            max-height:100%;
            display:block;
            cursor:default;
        }
        .sian-modal-close{
            position:fixed;
            top:18px; right:20px;
            background:rgba(255,255,255,0.12);
            color:#fff;
            border:1px solid rgba(255,255,255,0.25);
            border-radius:8px;
            padding:8px 14px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }
        .sian-modal-close:hover{ background:rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 via-slate-50 to-blue-50 p-4 sm:p-6" oncontextmenu="return false;">

    <!-- 시안보기 모달 -->
    <div class="sian-modal" id="sian-modal" onclick="closeSianImage()">
        <button type="button" class="sian-modal-close" onclick="event.stopPropagation(); closeSianImage()">닫기 ✕</button>
        <img id="sian-modal-img" src="" alt="시안 이미지" onclick="event.stopPropagation()">
    </div>

    <!-- 카드전표 / 현금영수증 전표 이미지 모달 -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4" onclick="closeReceiptModal()">
        <div class="bg-white rounded-2xl shadow-lg max-w-[92vw] max-h-[90vh] flex flex-col" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-200 shrink-0">
                <span id="receipt-modal-title" class="font-bold text-slate-800 text-sm sm:text-base"></span>
                <div class="flex items-center gap-2">
                    <button type="button" id="receipt-print-btn" onclick="printReceiptImage()"
                        class="bg-slate-600 hover:bg-slate-700 active:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold">인쇄하기</button>
                    <button type="button" id="receipt-download-btn" onclick="downloadReceiptImage()"
                        class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold">이미지 다운로드</button>
                    <button type="button" onclick="closeReceiptModal()" class="text-slate-500 hover:text-slate-800 text-2xl leading-none px-2" aria-label="닫기">&times;</button>
                </div>
            </div>
            <div class="p-4 overflow-auto flex justify-center items-start">
                <img id="receipt-modal-img" src="" alt="전표 이미지" class="max-w-full h-auto">
            </div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto">
        <!-- 이전 페이지로 돌아가기 -->
        <button type="button" id="back-btn" onclick="goBack()"
            class="inline-flex items-center gap-3 mb-4 min-h-[56px] bg-white hover:bg-slate-50 active:scale-[0.98] transition border border-slate-300 text-slate-900 font-bold text-lg sm:text-xl px-6 py-3.5 rounded-2xl shadow-md shadow-slate-200/80 focus:outline-none focus:ring-4 focus:ring-blue-100">
            <svg class="w-7 h-7 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            이전 페이지로
        </button>

        <div class="bg-white/90 backdrop-blur border border-slate-200/80 p-5 sm:p-8 rounded-2xl shadow-lg shadow-slate-200/70 mb-6">
            <div class="flex items-center gap-3 mb-1">
                <h2 class="text-lg sm:text-xl font-bold text-slate-900">주문 내역 조회</h2>
            </div>

            <div class="mb-5 text-xs sm:text-sm text-slate-400">
                * 구입완료건 조회 / 제작상황
            </div>

            <div class="flex flex-col sm:flex-row gap-2.5">
                <input type="text" id="search-name" autocomplete="off"
                    class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:flex-grow-[2]"
                    placeholder="이름 입력">

                <input type="text" id="search-phone" maxlength="4" inputmode="numeric" autocomplete="off"
                    class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:w-44"
                    placeholder="전화번호 뒤 4자리">

                <button type="button" id="search-btn"
                    class="w-full sm:w-auto shrink-0 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition text-white px-6 py-3 rounded-xl font-semibold text-sm shadow-sm shadow-blue-200">조회</button>
            </div>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

<script>
    // 이전 페이지로 돌아가기: 방문 기록이 있으면 뒤로, 팝업/새 창으로 열렸으면 창 닫기,
    // 둘 다 아니면(주소창으로 바로 접속 등) 주문 게시판 첫 화면으로 이동
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else if (window.opener) {
            window.close();
        } else {
            window.location.href = 'https://sowonnamoo.github.io/myboard/';
        }
    }
</script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, getDoc, setDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const $ = (id) => document.getElementById(id);
    const SITE = 'https://sowonnamoo.github.io';
    const BOARD_BASE = SITE + '/myboard/';

    // ---------------- 조회 대상 제한 ----------------
    // 이 페이지는 cart.html(장바구니)로 접수·저장된 주문만 조회합니다.
    // 다른 경로(index1 직접 접수, 재주문 등)로 접수된 주문은 이름·전화번호가 맞아도 보이지 않고,
    // 주문이 없는 경우와 똑같이 "찾을 수 없음"으로 처리됩니다(블라인드).
    // 다시 모든 주문을 보이게 하려면 false 로 바꾸세요.
    const ONLY_CART_ORDERS = true;
    // cart.html 이 저장한 주문만 가진 특징: fromCart 표시 + 상품 목록(items)
    function isCartOrder(data) {
        return !!data && data.fromCart === true && Array.isArray(data.items) && data.items.length > 0;
    }

    // 첨부파일 목록에서 링크를 숨길 확장자
    const HIDDEN_FILE_EXT = ['jpg', 'jpeg', 'svg'];
    function fileExtOf(url, label) {
        const pick = (str) => {
            const m = String(str || '').split(/[?#]/)[0].match(/\.([a-z0-9]+)$/i);
            return m ? m[1].toLowerCase() : '';
        };
        let ext = pick(label);
        if (!ext) {
            try {
                const u = new URL(url);
                ext = pick(u.searchParams.get('name')) || pick(u.pathname);
            } catch (e) { ext = pick(url); }
        }
        return ext;
    }
    function isHiddenFile(url, label) {
        return HIDDEN_FILE_EXT.includes(fileExtOf(url, label));
    }

    // ---------------- 공통 유틸 ----------------
    // 주문 데이터(이름/상품명/주소 등)는 고객이 직접 입력한 값이라, 화면에 넣기 전에 반드시 이스케이프합니다.
    function esc(v) {
        return String(v ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // http(s) 주소만 허용 (javascript: 등 차단)
    function safeUrl(u) {
        return /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
    }
    function stripWon(v) { return String(v ?? '').replace(/원\s*$/, ''); }

    // 우클릭(및 모바일 길게 누르기 메뉴) 방지 — 개인 주문정보라 최소한의 방어
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.openPopup = (url) => {
        const u = safeUrl(url);
        if (!u) return;
        window.open(u, '_blank', 'width=590,height=830,scrollbars=yes');
    };

    // ---------------- 시안보기 모달 ----------------
    // 1차 이미지(R2 등)가 삭제되어 로드 실패하면 fallbackUrl(카페24)로 자동 대체
    window.viewSianImage = (url, fallbackUrl) => {
        const primary = safeUrl(url) || safeUrl(fallbackUrl);
        if (!primary) return;
        const fb = safeUrl(fallbackUrl);
        const img = $('sian-modal-img');
        img.onerror = () => {
            if (fb && img.src !== fb) {
                img.onerror = null;
                img.src = fb;
            } else {
                img.onerror = null;
            }
        };
        img.src = primary;
        $('sian-modal').classList.add('active');
    };
    window.closeSianImage = () => {
        $('sian-modal').classList.remove('active');
        $('sian-modal-img').src = '';
        $('sian-modal-img').onerror = null;
    };

    // ---------------- 카드전표 / 현금영수증 전표 이미지 모달 ----------------
    window.openReceiptModal = (url, title) => {
        const safe = safeUrl(url);
        if (!safe) return;
        const modal = $('receipt-modal');
        $('receipt-modal-img').src = safe;
        $('receipt-modal-title').textContent = title || '전표';
        modal.dataset.url = safe;
        modal.dataset.title = title || '전표';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
    };

    window.closeReceiptModal = () => {
        const modal = $('receipt-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        $('receipt-modal-img').src = '';
        document.body.style.overflow = '';
    };

    window.downloadReceiptImage = async () => {
        const modal = $('receipt-modal');
        const url = modal.dataset.url;
        if (!url) return;
        const btn = $('receipt-download-btn');
        const originalText = btn.textContent;

        // 클릭 시점(동기)에 빈 새 탭을 미리 열어둠 — fetch 실패 시 현재 화면이 사라지지 않고
        // 이 탭에 이미지를 띄울 수 있게 하기 위함
        const preOpenedTab = window.open('', '_blank');

        try {
            btn.textContent = '다운로드 중...';
            btn.disabled = true;
            const res = await fetch(url);
            if (!res.ok) throw new Error('이미지를 불러오지 못했습니다.');
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const ext = (blob.type && blob.type.split('/')[1]) ? blob.type.split('/')[1].replace('jpeg', 'jpg') : (url.split('.').pop().split('?')[0] || 'jpg');

            if (preOpenedTab) preOpenedTab.close();

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `${modal.dataset.title || '전표'}_${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
        } catch (e) {
            if (preOpenedTab) {
                preOpenedTab.location.href = url;
            } else {
                alert('팝업이 차단되어 새 창을 열 수 없습니다. 브라우저의 팝업 차단을 해제한 뒤 다시 시도해주세요.');
            }
        } finally {
            btn.textContent = originalText;
            btn.disabled = false;
        }
    };

    window.printReceiptImage = () => {
        const modal = $('receipt-modal');
        const url = modal.dataset.url;
        if (!url) return;
        const title = modal.dataset.title || '전표';

        const printWin = window.open('', '_blank', 'width=800,height=1000');
        if (!printWin) {
            alert('팝업이 차단되어 인쇄창을 열 수 없습니다. 팝업 차단을 해제해주세요.');
            return;
        }
        // 문자열을 HTML로 써넣지 않고 DOM으로 구성 (주소/제목이 마크업으로 해석되지 않도록)
        const pd = printWin.document;
        pd.title = title;
        const style = pd.createElement('style');
        style.textContent = '@media print { @page { margin: 0; } } html, body { margin: 0; padding: 0; } img { display: block; max-width: 100%; height: auto; margin: 0 auto; }';
        pd.head.appendChild(style);
        const img = pd.createElement('img');
        img.alt = title;
        img.onload = () => { printWin.focus(); printWin.print(); };
        img.onerror = () => {
            alert('이미지를 불러오지 못해 인쇄할 수 없습니다.');
            printWin.close();
        };
        img.src = url;
        pd.body.appendChild(img);
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            window.closeSianImage();
            window.closeReceiptModal();
        }
    });

    // ---------------- Firebase (index1 / index5 와 동일한 board-291e3 프로젝트) ----------------
    const firebaseConfig = {
        apiKey: "AIzaSyDU8d6ShVNtgLYEQZeyms88G-TDNnRd2aA",
        authDomain: "board-291e3.firebaseapp.com",
        projectId: "board-291e3",
        storageBucket: "board-291e3.firebasestorage.app",
        messagingSenderId: "25881766316",
        appId: "1:25881766316:web:c03e118cf26d3fff11b209"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- 개인정보 조회키(secretId) 계산 — app.js / index5 와 반드시 동일한 방식 ----
    // boards/{id}, jjjj/{id} 공개 문서에는 phone/address/message가 없고 private/{secretId} 문서에만 있어서,
    // 이름+뒷4자리로 secretId를 정확히 계산해낸 사람만 그 문서를 읽을 수 있습니다.
    async function sha256Hex(text) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function normalizeName(name) { return String(name || "").trim(); }
    function normalizePhoneLast4(phone) { return String(phone || "").replace(/[^0-9]/g, "").slice(-4); }
    async function computeSecretId(boardId, author, phone) {
        return sha256Hex(`${boardId}::${normalizeName(author)}::${normalizePhoneLast4(phone)}`);
    }

    // ---- 세금계산서/현금영수증 상호배타 판별용 ID (segum.html / app.js 와 동일) ----
    function normalizePhoneFull(phone) { return String(phone || "").replace(/[^0-9]/g, ""); }
    async function computeSegumId(name, phone) {
        return sha256Hex(`segum::${normalizeName(name)}::${normalizePhoneFull(phone)}`);
    }
    function segumBlocksCash(segumSnap, boardId, isBankTransfer) {
        if (!segumSnap || !segumSnap.exists()) return false;
        const sd = segumSnap.data() || {};
        if (Array.isArray(sd.boardIds) && sd.boardIds.length > 0) return sd.boardIds.includes(boardId);
        // boardIds 기록이 없는 예전 문서: '무통장' 주문은 막지 않음
        return !isBankTransfer;
    }

    // ---- 방문자 익명 로그인 (현금영수증 신청/파일재업로드 등에서 uid 필요) ----
    const auth = getAuth(app);
    let resolveAuthReady;
    const authReadyPromise = new Promise((resolve) => { resolveAuthReady = resolve; });
    onAuthStateChanged(auth, (user) => {
        if (user) {
            resolveAuthReady(user);
        } else {
            signInAnonymously(auth).catch((e) => console.error("익명 로그인 실패:", e));
        }
    });
    // 익명 로그인이 실패해도 영원히 멈추지 않도록 10초 후 오류 처리
    function ensureAnonymousLogin() {
        return Promise.race([
            authReadyPromise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('익명 로그인 시간 초과')), 10000))
        ]);
    }

    // ---------------- 세금계산서 / 현금영수증 / 카드전표 버튼 ----------------
    window.openSegumPageFor = (name, phone, boardId) => {
        const url = `${BOARD_BASE}segum?name=${encodeURIComponent(name || '')}&phone=${encodeURIComponent(phone || '')}&boardId=${encodeURIComponent(boardId || '')}`;
        window.open(url, '_blank', 'width=501,height=765,scrollbars=yes');
    };

    // 이름+전화번호로 계산되는 secretId(private 문서)를 직접 읽어 신청/등록 상태를 확인하므로
    // 어느 기기에서 열어도 최신 상태가 보입니다.
    window.openCashPageFor = async (boardId, secretId, isJajoo, name, phone, isBankTransfer) => {
        if (!boardId || !name || !phone) {
            alert('주문 정보를 찾을 수 없습니다.');
            return;
        }
        const col = isJajoo ? 'jjjj' : 'boards';

        // 1. 세금계산서가 이미 등록된 이름+전화번호면 현금영수증 신청 자체를 막습니다.
        try {
            const segumId = await computeSegumId(name, phone);
            const segumSnap = await getDoc(doc(db, "segum1", segumId));
            if (segumBlocksCash(segumSnap, boardId, isBankTransfer)) {
                alert('이미 세금계산서 신청이 등록되셔서 현금영수증 신청은 되지 않습니다.');
                return;
            }
        } catch (e) {
            alert('확인 중 오류가 발생했습니다: ' + e.message);
            return;
        }

        // 2. 신청/등록 상태를 private 문서에서 최신으로 확인
        const privateRef = doc(db, col, boardId, "private", secretId);
        let privateData = {};
        try {
            const privSnap = await getDoc(privateRef);
            if (privSnap.exists()) privateData = privSnap.data();
        } catch (e) {
            alert('확인 중 오류가 발생했습니다: ' + e.message);
            return;
        }

        if (privateData.cashFileUrl) {
            window.openReceiptModal(privateData.cashFileUrl, '현금영수증');
            return;
        }
        if (privateData.cashApplied) {
            alert('현금영수증이 신청되셨습니다.\n택배 발송후 1~2일후 본 버튼을 다시 눌러주시면 우클릭 다운로드 가능합니다.');
            return;
        }

        // 3. 최초 신청: 발행희망번호(사업자번호 또는 전화번호) 입력받기
        const cashNumber = prompt('현금영수증 발행희망 번호를 입력해주세요.\n(사업자등록번호 또는 전화번호 중 1개)');
        if (!cashNumber || !cashNumber.trim()) return;

        try {
            const user = await ensureAnonymousLogin();
            // 관리자 대시보드(quick_check.html)가 그대로 쓰는 컬렉션
            await setDoc(doc(db, "cashReceipt1", boardId), {
                boardId, author: name, cashNumber: cashNumber.trim(),
                fileUrl: '', createdAt: serverTimestamp(), uid: user.uid
            });
            // 다른 기기에서도 "이미 신청됨"을 확인할 수 있게 private 문서에도 기록
            await updateDoc(privateRef, {
                cashApplied: true, cashNumber: cashNumber.trim()
            }).catch(() => {});
            // segum.html 이 "이미 현금영수증 신청됨"을 확인할 수 있게 이름+전화번호 기반으로도 기록
            const cashSecretId = await computeSegumId(name, phone);
            await setDoc(doc(db, "cashSecret", cashSecretId), {
                boardId, createdAt: serverTimestamp()
            }, { merge: true });
            const segumBtnNow = $('segum-btn-' + boardId);
            if (segumBtnNow) segumBtnNow.style.display = 'none';
            alert('현금영수증이 신청되셨습니다.\n택배 발송후 1~2일후 본 버튼을 다시 눌러주시면 우클릭 다운로드 가능합니다.');
        } catch (e) {
            alert('신청 중 오류가 발생했습니다: ' + e.message);
        }
    };

    // 관리자가 등록한 카드전표 URL이 private 문서에 저장되므로 기기와 무관하게 읽을 수 있습니다.
    window.openCardPageFor = async (boardId, secretId, isJajoo) => {
        if (!boardId) {
            alert('주문 정보를 찾을 수 없습니다.');
            return;
        }
        try {
            const col = isJajoo ? 'jjjj' : 'boards';
            const privSnap = await getDoc(doc(db, col, boardId, "private", secretId));
            if (privSnap.exists() && privSnap.data().cardFileUrl) {
                window.openReceiptModal(privSnap.data().cardFileUrl, '카드전표');
            } else {
                alert('택배물 발송후 등록됩니다.');
            }
        } catch (e) {
            alert('택배물 발송후 등록됩니다.');
        }
    };

    // 이 주문의 현금영수증이 이미 신청돼 있으면 세금계산서 버튼을, 이 이름+전화번호로 세금계산서가
    // 이미 등록돼 있으면 현금영수증 버튼을 숨깁니다. (신청 여부는 조회 때 함께 불러온 private 필드로 판단)
    async function syncTaxCashButtons(d) {
        const segumBtn = $('segum-btn-' + d.id);
        const cashBtn = $('cash-btn-' + d.id);
        if (segumBtn && (d.cashApplied || d.cashFileUrl)) {
            segumBtn.style.display = 'none';
        }
        if (cashBtn) {
            try {
                const segumId = await computeSegumId(d.author, d.phone);
                const segumSnap = await getDoc(doc(db, "segum1", segumId));
                if (segumBlocksCash(segumSnap, d.id, d.status === '무통장')) cashBtn.style.display = 'none';
            } catch (e) { /* 조회 실패해도 버튼은 그대로 둠 */ }
        }
    }

    // ---------------- 제품바로가기 (장바구니로 접수된 상품) → 구매했던 상품 페이지 찾기 ----------------
    // 아이템에 productId가 있으면 그 상품 페이지로, 없으면 헤더 메뉴 데이터에서 상품명이 겹치는 항목을 찾아 연결합니다.
    const HEADER_URL = SITE + '/myjs/includes/header';
    const DEFAULT_PRODUCT_URL = SITE + '/myjs/products/01my';
    let cachedMenuData = null;

    function extractMenuData(headerText) {
        const startMarker = 'const menuData = [';
        const startIdx = headerText.indexOf(startMarker);
        if (startIdx === -1) return [];
        let i = startIdx + startMarker.length - 1;
        let depth = 0;
        for (; i < headerText.length; i++) {
            if (headerText[i] === '[') depth++;
            else if (headerText[i] === ']') { depth--; if (depth === 0) { i++; break; } }
        }
        const arrayText = headerText.slice(startIdx + startMarker.length - 1, i);
        try { return JSON.parse(arrayText); } catch (e) { console.error('menuData 파싱 실패:', e); return []; }
    }
    async function loadMenuData() {
        if (cachedMenuData) return cachedMenuData;
        try {
            const res = await fetch(HEADER_URL);
            cachedMenuData = extractMenuData(await res.text());
        } catch (e) {
            console.error('헤더 메뉴 데이터를 불러오지 못했습니다:', e);
            cachedMenuData = [];
        }
        return cachedMenuData;
    }
    function flattenMenu(items) {
        let out = [];
        (items || []).forEach(it => {
            if (it.children && it.children.length) out = out.concat(flattenMenu(it.children));
            else if (it.url && it.url !== '#') out.push({ leaf: it.name, url: it.url });
        });
        return out;
    }
    function guessProductUrl(itemName, flatList) {
        if (!itemName) return null;
        const candidates = flatList.filter(f => f.leaf && itemName.includes(f.leaf));
        if (candidates.length === 0) return null;
        candidates.sort((a, b) => b.leaf.length - a.leaf.length); // 가장 구체적인(이름이 긴) 것
        return candidates[0].url;
    }
    function toAbsoluteUrl(url) {
        if (!url) return null;
        return url.startsWith('http') ? url : SITE + url;
    }
    async function resolveProductUrl(item) {
        if (item.productId) return `${SITE}/myjs/products/${encodeURIComponent(item.productId)}`;
        const flat = flattenMenu(await loadMenuData());
        return toAbsoluteUrl(guessProductUrl(item.itemName, flat)) || DEFAULT_PRODUCT_URL;
    }

    const productGoRegistry = {};
    let productGoSeq = 0;
    window.productGoClick = async (key) => {
        const data = productGoRegistry[key];
        if (!data) return;
        const productUrl = await resolveProductUrl(data);
        window.open(productUrl, '_blank');
    };

    // ---------------- 조회 ----------------
    $('search-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('search-btn').click(); });
    $('search-phone').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('search-btn').click(); });
    $('search-phone').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

    $('search-btn').addEventListener('click', async () => {
        // 봇 방지: 이름/뒷4자리를 10회 이상 틀리면 3시간 동안 조회를 막습니다. (index5 와 동일)
        const blockUntil = localStorage.getItem('searchBlockUntil');
        const nowTime = new Date().getTime();
        if (blockUntil && nowTime < parseInt(blockUntil)) {
            const remainingSec = Math.ceil((parseInt(blockUntil) - nowTime) / 1000);
            const min = Math.floor(remainingSec / 60);
            const sec = remainingSec % 60;
            alert(`너무 많이 틀려 ${min}분 ${sec}초 동안 조회가 제한됩니다.`);
            return;
        }

        const name = $('search-name').value.trim();
        const phone = $('search-phone').value.trim();
        const resultsDiv = $('results');

        function registerFail() {
            const failCount = parseInt(localStorage.getItem('searchFailCount') || '0') + 1;
            if (failCount >= 10) {
                localStorage.setItem('searchBlockUntil', (nowTime + (3 * 60 * 60 * 1000)).toString());
                localStorage.setItem('searchFailCount', '0');
                alert("이름/전화번호를 10회 틀려 3시간 동안 조회가 제한됩니다.");
            } else {
                localStorage.setItem('searchFailCount', failCount.toString());
            }
        }

        if (!name || !/^\d{4}$/.test(phone)) {
            registerFail();
            alert("이름과 전화번호 뒷 4자리를 정확히 입력해주세요.");
            return;
        }

        resultsDiv.innerHTML = '<div class="text-sm text-slate-500 px-1">조회 중...</div>';

        try {
            try { await ensureAnonymousLogin(); } catch (e) { /* 로그인 실패해도 조회는 시도 */ }

            // 접수 때 이름의 공백/괄호는 제거되어 저장되므로, 입력값 그대로와 제거한 값 둘 다 시도합니다.
            const nameVariants = [...new Set([name, name.replace(/[\s()]/g, '')].filter(Boolean))];

            // 1. 이름으로 공개 문서만 먼저 조회 (공개 문서에는 개인정보가 없습니다)
            const candidates = [];
            for (const v of nameVariants) {
                const [snapBoards, snapJjjj] = await Promise.all([
                    getDocs(query(collection(db, "boards"), where("author", "==", v))),
                    // 재주문(jjjj)은 장바구니 경로가 아니므로 ONLY_CART_ORDERS 일 때는 조회 자체를 하지 않음
                    ONLY_CART_ORDERS ? Promise.resolve({ docs: [] }) : getDocs(query(collection(db, "jjjj"), where("author", "==", v)))
                ]);
                snapBoards.docs.forEach(d => {
                    // 장바구니 이외 경로 주문은 개인정보 문서(private)를 읽어보기 전에 여기서 걸러냄
                    if (ONLY_CART_ORDERS && !isCartOrder(d.data())) return;
                    candidates.push({ data: d.data(), id: d.id, isJajoo: false, col: "boards", nameUsed: v });
                });
                snapJjjj.docs.forEach(d => candidates.push({ data: d.data(), id: d.id, isJajoo: true, col: "jjjj", nameUsed: v }));
            }

            // 2. 각 후보에 대해 이름+뒷4자리로 secretId를 계산하고, 그 private 문서가 실제로 존재하는지로 본인 여부를 검증
            const verified = await Promise.all(candidates.map(async (c) => {
                const secretId = await computeSecretId(c.id, c.nameUsed, phone);
                const privateSnap = await getDoc(doc(db, c.col, c.id, "private", secretId));
                if (!privateSnap.exists()) return null;
                return { ...c.data, ...privateSnap.data(), id: c.id, isJajoo: c.isJajoo, secretId };
            }));

            // 상태가 '대기'(접수전/결제확인중)인 건은 표시하지 않음
            const seen = new Set();
            const filteredData = verified.filter(Boolean).filter(d => d.status !== '대기').filter(d => {
                if (seen.has(d.id)) return false;
                seen.add(d.id);
                return true;
            });

            if (filteredData.length === 0) {
                registerFail();
                resultsDiv.innerHTML = '<div class="text-sm text-slate-500 bg-white border border-slate-200 rounded-2xl p-5">해당하는 주문 정보를 찾을 수 없습니다. / 미 결제건은 조회되지 않습니다.'
                    + (ONLY_CART_ORDERS ? '<br>※ 이 페이지는 장바구니(cart)로 접수한 주문만 조회됩니다.' : '')
                    + '</div>';
                return;
            }

            localStorage.setItem('searchFailCount', '0');

            filteredData.sort((a, b) => {
                const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
                const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
                return dateB - dateA;
            });

            resultsDiv.innerHTML = filteredData.map(renderOrderCard).join('');

            // 세금계산서 ↔ 현금영수증 상호배타 상태를 화면에 반영
            filteredData.forEach(d => { syncTaxCashButtons(d); });
        } catch (error) {
            console.error(error);
            resultsDiv.innerHTML = '<div class="text-sm text-red-600 bg-white border border-red-100 rounded-2xl p-5">조회 중 오류가 발생했습니다. 다시 시도해주세요.</div>';
        }
    });

    // ---------------- 주문 카드 렌더링 ----------------
    // 접수 7일이 지난 주문은 기본적으로 접어두고, 최근(7일 이내) 주문만 펼쳐서 보여줍니다.
    const ORDER_COLLAPSE_DAYS = 7;

    function wrapCollapsible(fullHtml, isRecent, cardId, summaryLabel) {
        if (isRecent) return fullHtml;
        return `
        <div class="mb-4">
            <button type="button" data-act="toggle" data-target="${esc(cardId)}"
                class="w-full text-left bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-600 flex justify-between items-center gap-2">
                <span class="truncate">${esc(summaryLabel)}</span>
                <span id="${esc(cardId)}_arrow" class="shrink-0 text-blue-600 font-semibold">▾ 펼쳐보기</span>
            </button>
            <div id="${esc(cardId)}" style="display:none;">${fullHtml}</div>
        </div>`;
    }

    // 하단 버튼(거래명세서/세금계산서/...) 한 개를 그립니다. 비활성이면 눌리지 않는 회색 버튼으로 그립니다.
    function chip({ id = '', label, enabled, act = '', data = {}, title = '', tone = '' }) {
        const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
        const base = 'border px-2.5 py-1.5 text-xs rounded-lg font-semibold transition';
        const idAttr = id ? `id="${esc(id)}"` : '';
        const titleAttr = title ? `title="${esc(title)}"` : '';
        if (!enabled) {
            return `<button type="button" ${idAttr} disabled ${titleAttr} class="${base} bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed">${label}</button>`;
        }
        const color = tone === 'red'
            ? 'bg-red-500 text-white border-red-500 hover:bg-red-600'
            : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50';
        return `<button type="button" ${idAttr} data-act="${act}" ${attrs} ${titleAttr} class="${base} ${color}">${label}</button>`;
    }

    // 상품 옵션 어디에든 "부자재"가 들어 있으면 시안이 없는 상품이라 시안보기 버튼을 숨깁니다.
    // 상품명/용지/편집/후가공/옵션 등 어느 항목에 담겨 있어도 잡도록 글자 항목을 모두 검사하되,
    // 시안 이미지 주소와 원본 파일 목록은 파일명에 우연히 들어간 글자로 오판하지 않도록 제외합니다.
    const BUJAJAE_SKIP_KEYS = ['compositeImage', 'compositeImageFallback', 'originalImageUrls', 'originalImages'];
    function hasBujajae(it) {
        return Object.entries(it || {}).some(([k, v]) => {
            if (BUJAJAE_SKIP_KEYS.includes(k)) return false;
            let text = '';
            if (typeof v === 'string') text = v;
            else if (v && typeof v === 'object') { try { text = JSON.stringify(v); } catch (e) { text = ''; } }
            else return false;
            if (/^https?:\/\//i.test(text)) return false;
            return text.replace(/\s/g, '').includes('부자재');
        });
    }

    function renderItemRows(d, designNo, unpaid) {
        return d.items.map((it, idx) => {
            const priceNumber = Number(String(it.price).replace(/[^0-9.-]/g, '')) || 0;
            const qtyLabel = `${it.qty || 1}개${it.count && it.count != 1 ? ` × ${it.count}건` : ''}`;
            // R2 시안(compositeImage)을 1차로, 로드 실패하면 compositeImageFallback 또는 카페24 경로로 대체
            const cafe24Url = `https://sowonnamoo1005.cafe24.com/1/${designNo}${d.items.length > 1 ? `_${idx + 1}` : ''}.jpg`;
            const primary = safeUrl(it.compositeImage);
            const fallback = safeUrl(it.compositeImageFallback) || cafe24Url;

            const sianBtn = hasBujajae(it) ? '' : `<button type="button" data-act="sian" data-url="${esc(primary)}" data-fb="${esc(fallback)}" class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">시안보기</button>`;

            // 구매했던 상품 페이지로 바로가기 (productId가 없는 예전 주문은 상품명으로 상품 페이지를 추정)
            const goKey = `pg_${productGoSeq++}`;
            productGoRegistry[goKey] = { productId: it.productId || '', itemName: it.item || '' };
            const productGoBtn = `<button type="button" data-act="product-go" data-key="${goKey}" class="bg-black text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">제품바로가기</button>`;

            const detailBits = [
                (it.width && it.height) ? `${it.width}×${it.height}mm` : '',
                it.paper ? `용지: ${it.paper}` : '',
                it.ink ? `인쇄면: ${it.ink}` : '',
                it.finishings ? `후가공: ${it.finishings}` : '',
                it.weight ? `무게: ${it.weight}` : ''
            ].filter(Boolean).join(' · ');

            return `
            <div class="text-xs bg-white border border-slate-200 rounded-lg px-3 py-2.5 mt-1.5">
                <div class="font-medium text-slate-800">${esc(it.item || '상품')} · ${esc(qtyLabel)} · ${priceNumber.toLocaleString()}원</div>
                ${detailBits ? `<div class="text-slate-500 mt-1">${esc(detailBits)}</div>` : ''}
                <div class="flex items-center gap-2 mt-2 flex-wrap">${sianBtn}${productGoBtn}</div>
            </div>`;
        }).join('');
    }

    function renderOrderCard(d) {
        const dateObj = d.createdAt?.toDate ? d.createdAt.toDate() : new Date(d.createdAt);
        const phoneFull = (d.phone || '').replace(/[^0-9]/g, '');
        const phonePrefix = phoneFull.slice(0, -4); // 뒷4자리(=조회 비밀번호)가 이미지번호로 노출되지 않도록 제외
        const yy = dateObj.getFullYear().toString().slice(-2);
        const mm = (dateObj.getMonth() + 1).toString().padStart(2, '0');
        const dd = dateObj.getDate().toString().padStart(2, '0');
        const hh = dateObj.getHours().toString().padStart(2, '0');
        const mi = dateObj.getMinutes().toString().padStart(2, '0');
        const designNo = d.imgCode || `${phonePrefix}${yy}${mm}${dd}${hh}${mi}`;
        const dateStr = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;

        const st = d.status;
        const isPending = st === '대기';
        const isBankTransfer = st === '무통장';
        const isCardPay = st === '카드결제';
        // '모바일': 결제 없이 접수된 입금 확인 전 상태 / '모바일무통장': 관리자가 입금 확인 후 전환한 상태
        const isMobilePending = st === '모바일';
        const isMobileBank = st === '모바일무통장';
        const unpaid = isPending || isMobilePending;
        const isCartItems = Array.isArray(d.items) && d.items.length > 0; // 장바구니(cart)로 접수된 주문
        const trackingUrl = safeUrl(d.trackingUrl || d.woonso1);

        let statusLabel = (isPending || isMobilePending) ? '(접수전/결제확인중)'
            : (st === '접수에러') ? '(제작보류)' : '(접수완료)';
        let statusExtra = '';
        if (!isPending && st !== '접수에러') {
            if (trackingUrl) statusExtra = '<span class="text-red-600 font-bold"> _출고완료</span>';
            else if (d.sian === 'done') statusExtra = '<span class="text-yellow-600 font-bold"> _인쇄중</span>';
        }
        const statusText = (isMobilePending || isMobileBank) ? '무통장' : (st || '-');

        // 영수증/전표 파라미터 (장바구니 주문도 productName/quantity/size/price 가 합쳐져 저장되어 있어 동일하게 사용)
        const receiptParams = new URLSearchParams({
            product: d.productName || '상품명 없음', size: d.size || '0', qty: d.quantity || '0',
            price: d.price || '0', date: `작성일: ${dateStr}`, bizType: '기술서비스', bizItem: '광고, 대행'
        }).toString();

        // ---- 상단 우측 버튼 (일반 접수 주문만) ----
        let topButtons = '';
        if (!isCartItems) {
            topButtons = (!d.isJajoo && d.sian !== 'done')
                ? `<button type="button" data-act="approve" data-url="${esc(`${BOARD_BASE}index2?autoId=${d.id}&key=${d.secretId}`)}" class="bg-yellow-500 text-white px-5 py-2 rounded-lg font-bold text-sm">인쇄승인대기중</button>`
                : `<button type="button" data-act="popup" data-url="${esc(`${BOARD_BASE}photo1.html?designNo=${designNo}`)}" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold text-sm">확정시안</button>`;
            if (!d.isJajoo) {
                const reorderName = `${d.author}님 (${d.productName || '상품명'}/${d.quantity || '0'}/${d.size || '0'}) ${stripWon(d.price || '0')}원`;
                const reorderUrl = `${BOARD_BASE}index3.html?productName=${encodeURIComponent(reorderName)}&imgCode=${encodeURIComponent(designNo)}`;
                topButtons += `<button type="button" data-act="popup" data-url="${esc(reorderUrl)}" class="bg-black text-white px-5 py-2 rounded-lg font-bold text-sm">재구입</button>`;
            }
        }

        // ---- 첨부파일 ----
        // jpg / jpeg / svg 파일은 링크를 보여주지 않습니다. (파일명이 없는 항목은 보이는 것끼리 파일 1, 파일 2 순으로 번호를 매김)
        const fileList = (Array.isArray(d.originalFiles) && d.originalFiles.length)
            ? d.originalFiles.map(f => ({ url: f.url, label: f.filename, named: true }))
            : [d.file1Url, d.file2Url].filter(Boolean).map(u => ({ url: u, label: '', named: false }));
        const visibleFiles = fileList.filter(f => safeUrl(f.url) && !isHiddenFile(f.url, f.label));
        const fileLinks = visibleFiles.map((f, i) =>
            `<a href="#" data-act="download" data-url="${esc(f.url)}" ${f.url === d.file1Url ? `id="file1-link-${esc(d.id)}"` : ''} class="text-blue-500 underline text-xs break-all">${esc(f.named && f.label ? f.label : `파일 ${i + 1}`)}</a>`
        ).join('');

        const reuploadBlock = st === '접수에러' ? `
            <div class="mt-2 flex items-center gap-2 flex-wrap">
                <button type="button" id="reupload-btn-${esc(d.id)}" data-act="reupload"
                    data-doc-id="${esc(d.id)}" data-col="${d.isJajoo ? 'jjjj' : 'boards'}" data-author="${esc(d.author)}"
                    class="bg-red-600 text-white font-bold px-3 py-1.5 text-xs rounded-lg hover:bg-red-700 border border-red-700">파일재업로드</button>
                <span id="reupload-msg-${esc(d.id)}" class="text-red-600 text-xs font-semibold">
                    파일오류 사유로 접수에러 됬습니다. 내 시안&gt;에러내용 확인후 재업로드 바랍니다.
                </span>
            </div>` : '';

        // ---- 무통장 입금 안내 (입금 확인 전) ----
        const bankNotice = (isPending || isMobilePending) ? `
            <div class="mt-3 text-sm font-bold text-red-600 bg-red-50 p-3 rounded-lg">
                이 계좌번호로 입금해주세요.<br>
                무통장입금 결제지연시 주문은 삭제됩니다.<br>
                <span class="inline-flex items-center gap-2 mt-1">
                    *무통장 계좌 : 농협 352-0130-9995-53 최대환
                    <button type="button" data-act="copy" data-text="352-0130-9995-53" class="border border-red-300 bg-white text-red-600 text-xs px-2 py-0.5 rounded hover:bg-red-100">복사</button>
                </span>
            </div>` : '';

        // ---- 하단 버튼들 ----
        const chips = [
            chip({ label: '거래명세서', enabled: !unpaid, act: 'popup', data: { url: `${BOARD_BASE}print2.html?${receiptParams}` } }),
            chip({
                id: `segum-btn-${d.id}`, label: '세금계산서', enabled: !isPending && !isCardPay, act: 'segum',
                data: { name: d.author, phone: d.phone, id: d.id },
                title: isCardPay ? '카드결제 건은 카드전표를 이용해주세요.' : ''
            }),
            chip({
                id: `cash-btn-${d.id}`, label: '현금영수증',
                enabled: !(isPending || isCardPay || isMobilePending || isMobileBank || (d.isJajoo && !isBankTransfer)),
                act: 'cash',
                data: { id: d.id, secret: d.secretId, jajoo: d.isJajoo ? '1' : '0', name: d.author, phone: d.phone, bank: isBankTransfer ? '1' : '0' },
                title: (isMobilePending || isMobileBank) ? '모바일 계좌이체 건은 현금영수증 신청이 불가합니다. 세금계산서를 이용해주세요.'
                    : (d.isJajoo && !isBankTransfer) ? '재주문 건은 고객센터로 문의해주세요.'
                    : (isCardPay ? '카드결제 건은 카드전표를 이용해주세요.' : '')
            }),
            chip({ label: '간이영수증', enabled: !unpaid, act: 'popup', data: { url: `${BOARD_BASE}print3.html?${receiptParams}` } }),
            chip({
                id: `card-btn-${d.id}`, label: '카드전표',
                enabled: !(isPending || isBankTransfer || isMobilePending || isMobileBank || (d.isJajoo && !isCardPay)),
                act: 'card', data: { id: d.id, secret: d.secretId, jajoo: d.isJajoo ? '1' : '0' },
                title: (d.isJajoo && !isCardPay) ? '재주문 건은 고객센터로 문의해주세요.'
                    : (isBankTransfer || isMobileBank) ? '무통장 입금 건은 세금계산서/현금영수증을 이용해주세요.' : ''
            }),
            chip({
                label: trackingUrl ? '출고완료/운송장보기' : '운송장', enabled: !!trackingUrl,
                act: 'popup', data: { url: trackingUrl }, tone: 'red'
            }),
            (isPending || isMobilePending)
                ? `<button type="button" data-act="delete" data-id="${esc(d.id)}" data-jajoo="${d.isJajoo ? '1' : '0'}" class="border px-2.5 py-1.5 text-xs rounded-lg font-semibold bg-slate-500 border-slate-500 text-white hover:bg-slate-700">주문삭제</button>`
                : ''
        ].join('');

        // ---- 본문 ----
        const bg = isCartItems ? 'bg-blue-50 border-blue-100' : (d.isJajoo ? 'bg-orange-50 border-slate-200' : 'bg-white border-slate-200');
        const title = isCartItems
            ? '🛒 주문내역'
            : `${d.isJajoo ? '📦 재주문_결제즉시 제작시작건_ ' : ''}${esc(d.productName || '상품명 없음')}`;

        const gridExtra = isCartItems ? '' : `
            <div><span class="font-semibold">수량:</span> ${esc(d.quantity || '-')}</div>
            <div><span class="font-semibold">사이즈:</span> ${esc(d.size || '-')}</div>`;

        const itemsBlock = isCartItems
            ? `<div class="mt-2"><span class="font-semibold">주문 상품:</span>${renderItemRows(d, designNo, unpaid)}</div>`
            : '';

        // 장바구니 무통장 입금 주문은 환불계좌가 메시지 칸에 "[환불계좌] 은행명 계좌번호" 형태로 저장되므로,
        // 별도 "환불계좌" 줄로 분리해서 보여주고 메시지 줄에는 나머지 내용만 보여준다.
        const rawMessage = String(d.message || '');
        const refundMatch = rawMessage.match(/\[환불계좌\]\s*([^\n]*)/);
        let refundText = refundMatch ? refundMatch[1].trim() : '';
        // 예금주는 "(예금주: 홍길동)" 형태로 같이 저장되므로 따로 떼어 별도 줄로 보여준다. (예전 주문은 예금주 없음)
        const holderMatch = refundText.match(/\(예금주:\s*([^)]*)\)\s*$/);
        const refundHolder = holderMatch ? holderMatch[1].trim() : '';
        if (holderMatch) refundText = refundText.replace(holderMatch[0], '').trim();

        // 제작상황: 관리자가 남긴 메모(private 문서의 productionMemo)가 있을 때만 표시합니다.
        // 메모가 없거나 공백뿐이면 "제작상황" 글자를 포함해 아무것도 나오지 않습니다.
        const productionMemo = (typeof d.productionMemo === 'string') ? d.productionMemo.trim() : '';
        const memoBlock = productionMemo ? `
                <div class="mb-3 rounded-xl bg-amber-50 border border-amber-200 px-3.5 py-3">
                    <div class="text-xs font-bold text-amber-700 mb-1">제작상황</div>
                    <div class="text-sm text-slate-800 whitespace-pre-line break-words">${esc(productionMemo)}</div>
                </div>` : '';

        const cardHtml = `
        <div class="${bg} border p-4 sm:p-6 rounded-2xl shadow-sm mb-4">
            <div class="text-sm font-bold text-blue-700 mb-2">📅 작성일 : ${esc(dateStr)}</div>
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3">
                <div class="min-w-0">
                    <h2 class="font-bold text-lg mb-2 break-words">${title}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1.5 text-sm text-slate-700">
                        <div><span class="font-semibold">작성자:</span> ${esc(d.author)}</div>
                        <div><span class="font-semibold">상태:</span> ${esc(statusText)} <span class="text-blue-600 font-bold">${statusLabel}${statusExtra}</span></div>
                        <div><span class="font-semibold">${isCartItems ? '총 금액' : '가격'}:</span> ${d.price ? esc(stripWon(d.price)) : '-'}원</div>
                        ${gridExtra}
                        <div><span class="font-semibold">전화번호:</span> ${esc(d.phone || '-')}</div>
                    </div>
                </div>
                ${topButtons ? `<div class="flex flex-row sm:flex-col gap-2 flex-wrap shrink-0">${topButtons}</div>` : ''}
            </div>

            <div class="mt-3 text-sm text-slate-600 border-t border-slate-200 pt-3">
                ${memoBlock}
                <div><span class="font-semibold">배송지:</span> ${esc(d.address || '-')}</div>
                ${refundText ? `<div><span class="font-semibold">환불계좌:</span> ${esc(refundText)}${refundHolder ? ` <span class="font-semibold ml-2">예금주:</span> ${esc(refundHolder)}` : ''}</div>` : ''}
                ${itemsBlock}

                ${fileLinks ? `
                <div class="mt-2 flex items-center gap-2 flex-wrap">
                    <span class="font-semibold">첨부파일:</span>
                    ${fileLinks}
                </div>` : ''}
                ${reuploadBlock}

                ${bankNotice}

                <div class="mt-4 flex gap-2 flex-wrap">${chips}</div>
            </div>
        </div>`;

        const daysSince = (Date.now() - dateObj.getTime()) / (1000 * 60 * 60 * 24);
        const isRecent = !isNaN(daysSince) && daysSince <= ORDER_COLLAPSE_DAYS;
        const summary = `${d.author || '-'} · ${dateStr} · ${isCartItems ? `장바구니 주문(${d.items.length}건)` : (d.productName || '상품명 없음')} · ${stripWon(d.price || 0)}원`;
        return wrapCollapsible(cardHtml, isRecent, `card_${d.id}`, summary);
    }

    // ---------------- 결과 영역 클릭 처리 (버튼마다 onclick 문자열을 쓰지 않고 data 속성으로 처리) ----------------
    window.toggleOrderCard = (id) => {
        const el = $(id);
        const arrow = $(id + '_arrow');
        if (!el) return;
        const opening = el.style.display === 'none';
        el.style.display = opening ? 'block' : 'none';
        if (arrow) arrow.textContent = opening ? '▴ 접기' : '▾ 펼쳐보기';
    };

    $('results').addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled) return;
        const ds = el.dataset;
        if (el.tagName === 'A') e.preventDefault();

        switch (ds.act) {
            case 'popup': window.openPopup(ds.url); break;
            case 'approve': {
                const u = safeUrl(ds.url);
                if (u) window.open(u, '_blank', 'width=864,height=1000,scrollbars=yes');
                break;
            }
            case 'sian': window.viewSianImage(ds.url, ds.fb); break;
            case 'product-go': window.productGoClick(ds.key); break;
            case 'download': window.downloadAttached(ds.url); break;
            case 'segum': window.openSegumPageFor(ds.name, ds.phone, ds.id); break;
            case 'cash': window.openCashPageFor(ds.id, ds.secret, ds.jajoo === '1', ds.name, ds.phone, ds.bank === '1'); break;
            case 'card': window.openCardPageFor(ds.id, ds.secret, ds.jajoo === '1'); break;
            case 'reupload': window.triggerFileReupload(el); break;
            case 'delete': window.deleteOrder(ds.id, ds.jajoo === '1'); break;
            case 'toggle': window.toggleOrderCard(ds.target); break;
            case 'copy':
                navigator.clipboard.writeText(ds.text || '').then(() => alert('계좌번호가 복사되었습니다.'));
                break;
        }
    });

    // ---------------- 파일 다운로드 / 재업로드 ----------------
    // R2 주소(?name=작성자_타임스탬프_원본파일명)에서 원본 파일명을 뽑아 그 이름 그대로 저장합니다.
    window.downloadAttached = async (url) => {
        const safe = safeUrl(url);
        if (!safe) return;
        let filename = 'download';
        try {
            const name = new URL(safe).searchParams.get('name') || 'download';
            filename = (name.match(/^.*?_\d{13}_(.+)$/) || [])[1] || name;
        } catch (e) {}
        try {
            const res = await fetch(safe);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } catch (e) {
            console.error('다운로드 실패, 새 창으로 대체:', e);
            window.open(safe, '_blank');
        }
    };

    // app.js 의 uploadToR2 와 같은 방식(확장자 검사, 고유 파일명)이되 File 객체를 바로 받습니다.
    function uploadFileToR2(file, authorName) {
        return new Promise((resolve, reject) => {
            const allowedExtensions = ['jpg', 'jpeg', 'png', 'pdf', 'ai', 'psd', 'zip', 'hwp', 'eps', 'gif', 'heic', 'webp', 'xlsx', 'ppt', 'pptx']; // 반드시 소문자
            const ext = file.name.split('.').pop().toLowerCase();
            if (!allowedExtensions.includes(ext)) {
                reject(new Error("허용되지 않는 파일 형식입니다."));
                return;
            }
            const uniqueFileName = `${authorName}_${Date.now()}_${file.name}`;
            const WORKER_URL = "https://r2.ecogr.workers.dev/";

            const xhr = new XMLHttpRequest();
            xhr.open("PUT", `${WORKER_URL}?name=${encodeURIComponent(uniqueFileName)}`, true);
            xhr.setRequestHeader("Content-Type", file.type);
            xhr.setRequestHeader("X-File-Size", file.size);
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        resolve(JSON.parse(xhr.responseText).url);
                    } catch (e) {
                        reject(new Error("업로드 응답을 처리하지 못했습니다."));
                    }
                } else {
                    reject(new Error("업로드 실패: " + xhr.statusText));
                }
            };
            xhr.onerror = () => reject(new Error("업로드 중 네트워크 오류가 발생했습니다."));
            xhr.send(file);
        });
    }

    // 접수에러 상태에서 '파일재업로드' 클릭 시: 바로 파일선택창을 띄우고, 고른 파일을 R2에 올린 뒤
    // 해당 주문의 file1Url을 새 파일로 교체합니다.
    window.triggerFileReupload = function (btn) {
        if (!btn || btn.disabled) return;

        const docId = btn.dataset.docId;
        const col = btn.dataset.col;
        const authorName = btn.dataset.author || '재업로드';

        const tempInput = document.createElement('input');
        tempInput.type = 'file';
        tempInput.style.display = 'none';
        document.body.appendChild(tempInput);

        tempInput.addEventListener('change', async () => {
            const file = tempInput.files && tempInput.files[0];
            if (!file) { document.body.removeChild(tempInput); return; }

            const MAX_SIZE = 500 * 1024 * 1024;
            if (file.size > MAX_SIZE) {
                alert("⚠️ 파일 용량이 500MB를 넘습니다. 500MB 미만의 파일로 다시 접수해주세요.");
                document.body.removeChild(tempInput);
                return;
            }
            if (!confirm('선택한 파일로 다시 접수하시겠습니까?')) {
                document.body.removeChild(tempInput);
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.textContent = '업로드 중...';

            try {
                await ensureAnonymousLogin();
                const newUrl = await uploadFileToR2(file, authorName);

                await updateDoc(doc(db, col, docId), {
                    file1Url: newUrl,
                    reuploadedAt: new Date()
                });

                const now = new Date();
                const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} `
                    + `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                btn.textContent = `수정파일 접수완료(${timeStr})`;
                btn.classList.remove('bg-red-600', 'hover:bg-red-700', 'border-red-700', 'opacity-50');
                btn.classList.add('bg-slate-400', 'border-slate-400');
                btn.disabled = true;

                const msgEl = $('reupload-msg-' + docId);
                if (msgEl) msgEl.classList.add('hidden');

                const fileLink = $('file1-link-' + docId);
                if (fileLink) {
                    fileLink.dataset.url = newUrl;
                    if (isHiddenFile(newUrl, file.name)) fileLink.style.display = 'none';
                }
            } catch (e) {
                if (e.code === 'permission-denied') {
                    alert('본인이 작성한 글만 파일을 재업로드할 수 있습니다. (다른 기기/브라우저에서 작성한 글이거나, 브라우저 데이터를 지운 경우 본인 글로 인식되지 않을 수 있습니다.)');
                } else {
                    alert('재업로드 중 오류가 발생했습니다: ' + e.message);
                }
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.textContent = '파일재업로드';
            } finally {
                document.body.removeChild(tempInput);
            }
        });

        tempInput.click();
    };

    // ---------------- 주문삭제 (입금 확인 전 '대기'/'모바일' 건만 버튼이 보입니다) ----------------
    window.deleteOrder = async (docId, isJajoo) => {
        if (!confirm("정말로 이 주문을 삭제하시겠습니까?")) return;
        try {
            await ensureAnonymousLogin();
            await deleteDoc(doc(db, isJajoo ? "jjjj" : "boards", docId));
            alert("삭제되었습니다.");
            $('search-btn').click();
        } catch (error) {
            console.error("삭제 실패:", error);
            if (error.code === 'permission-denied') {
                alert("본인이 작성한 글만 삭제할 수 있습니다. (다른 기기/브라우저에서 작성한 글이거나, 브라우저 데이터를 지운 경우 본인 글로 인식되지 않을 수 있습니다.)");
            } else {
                alert("삭제 중 오류가 발생했습니다.");
            }
        }
    };
</script>
</body>
