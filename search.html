<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <!-- 이름·전화번호·주소 등 개인 주문정보가 노출되는 페이지라 검색엔진에 안 걸리게 막음 -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>주문 조회 검색기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 우클릭(및 우클릭으로 여는 메뉴)으로 이미지/텍스트를 쉽게 저장 못 하게 최소한의 방어 */
        body{ -webkit-touch-callout: none; }

        /* ---------- 시안보기 모달 (새 창 대신 같은 페이지 안에서 열림 —
           브라우저 주소창/탭 높이 때문에 생기던 여백 문제를 원천적으로 없앰) ---------- */
        .sian-modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(10,14,18,0.92);
            z-index:1000;
            align-items:center;
            justify-content:center;
            padding:24px;
            cursor:zoom-out;
        }
        .sian-modal.active{ display:flex; }
        .sian-modal img{
            max-width:100%;
            max-height:100%;
            display:block;
            cursor:default;
        }
        .sian-modal-close{
            position:fixed;
            top:18px; right:20px;
            background:rgba(255,255,255,0.12);
            color:#fff;
            border:1px solid rgba(255,255,255,0.25);
            border-radius:8px;
            padding:8px 14px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
        }
        .sian-modal-close:hover{ background:rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 via-slate-50 to-blue-50 p-4 sm:p-6" oncontextmenu="return false;">
    <div class="sian-modal" id="sian-modal" onclick="closeSianImage()">
        <button type="button" class="sian-modal-close" onclick="event.stopPropagation(); closeSianImage()">닫기 ✕</button>
        <img id="sian-modal-img" src="" alt="시안 이미지" onclick="event.stopPropagation()">
    </div>

    <div class="max-w-2xl mx-auto">
     <div class="bg-white/90 backdrop-blur border border-slate-200/80 p-5 sm:p-8 rounded-2xl shadow-lg shadow-slate-200/70 mb-6">
        <div class="flex items-center gap-3 mb-1">
            <div class="w-10 h-10 shrink-0 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-blue-200">ECO</div>
            <h2 class="text-lg sm:text-xl font-bold text-slate-900">주문 내역 조회</h2>
        </div>

        <div class="mb-5 text-xs sm:text-sm text-slate-400">
            * 구입완료건 조회 / 제작상황
        </div>

        <div class="flex items-center flex-wrap gap-2.5 mb-4 p-3 bg-blue-50/70 border border-blue-100 rounded-xl">
            <div id="g_id_button_container"></div>
            <div class="flex items-start gap-1.5 text-xs text-slate-500 leading-snug">
                <span class="text-blue-400 shrink-0 mt-0.5">ℹ️</span>
                <span>
                    한 번 <b class="text-slate-700">"구글 로그인으로 변경"</b>하면<br>
                    이후 접수 건도 <b class="text-slate-700">구글 로그인으로만 조회</b>돼요
                </span>
            </div>
            <div id="google-status" class="text-sm w-full"></div>
        </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <input type="text" id="search-name" class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:flex-grow-[2]" placeholder="이름 입력">

        <input type="text" id="search-phone" class="w-full border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition p-3 rounded-xl text-sm sm:w-44" placeholder="전화번호 뒤 4자리" maxlength="4">

        <button id="search-btn" class="w-full sm:w-auto shrink-0 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition text-white px-6 py-3 rounded-xl font-semibold text-sm shadow-sm shadow-blue-200">조회</button>
    </div>
</div>
        <div id="results" class="space-y-4"></div>
    </div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, getDoc, setDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 우클릭(및 모바일 길게 눌러서 뜨는 메뉴) 방지 — 개인 주문정보라 이미지/텍스트를
        // 쉽게 저장/복사하지 못하도록 최소한의 방어 차원. (개발자도구 등 완전 차단은 불가능하지만
        // 일반적인 우클릭 메뉴는 막아둠)
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // 팝업 열기 함수 추가
        window.openPopup = (url) => {
            window.open(url, '_blank', 'width=590,height=830,scrollbars=yes');
        };

        // cart.html은 2단 레이아웃이라 좀 더 넉넉한 창 크기로 열어줌
        window.openCartPopup = (url) => {
            window.open(url, '_blank', 'width=1040,height=860,scrollbars=yes');
        };

        // 상품 설정 페이지(01my.html 등)는 더 넓은 레이아웃이라 그에 맞는 창 크기로 열어줌
        window.openProductPopup = (url) => {
            window.open(url, '_blank', 'width=1240,height=900,scrollbars=yes');
        };

        // ---------------- 재구입 → 정확한 상품 페이지 찾기 ----------------
        // 장바구니 아이템에 productId가 저장되어 있으면(=이 검색기의 재구입 기능으로 담겼던 건)
        // 그걸로 100% 정확하게 연결하고, 없으면(예전 방식으로 담긴 주문) 헤더의 메뉴 데이터에서
        // 상품명이 겹치는 항목을 찾아 연결한다. 그마저 못 찾으면 기본 상품(01my)으로 보낸다.
        const HEADER_URL = 'https://sowonnamoo.github.io/myjs/includes/header';
        const DEFAULT_PRODUCT_URL = 'https://sowonnamoo.github.io/myjs/products/01my';
        let cachedMenuData = null;

        // "const menuData = [ ... ];" 부분을 괄호 짝을 세어가며 정확히 잘라낸 뒤 JSON으로 파싱
        function extractMenuData(headerText) {
            const startMarker = 'const menuData = [';
            const startIdx = headerText.indexOf(startMarker);
            if (startIdx === -1) return [];
            let i = startIdx + startMarker.length - 1; // '[' 위치
            let depth = 0;
            for (; i < headerText.length; i++) {
                if (headerText[i] === '[') depth++;
                else if (headerText[i] === ']') { depth--; if (depth === 0) { i++; break; } }
            }
            const arrayText = headerText.slice(startIdx + startMarker.length - 1, i);
            try { return JSON.parse(arrayText); } catch (e) { console.error('menuData 파싱 실패:', e); return []; }
        }

        async function loadMenuData() {
            if (cachedMenuData) return cachedMenuData;
            try {
                const res = await fetch(HEADER_URL);
                const text = await res.text();
                cachedMenuData = extractMenuData(text);
            } catch (e) {
                console.error('헤더 메뉴 데이터를 불러오지 못했습니다:', e);
                cachedMenuData = [];
            }
            return cachedMenuData;
        }

        // 트리 구조(menuData)를 "이름 있는 링크(leaf)"만 평평하게 펼침
        function flattenMenu(items) {
            let out = [];
            (items || []).forEach(it => {
                if (it.children && it.children.length) {
                    out = out.concat(flattenMenu(it.children));
                } else if (it.url && it.url !== '#') {
                    out.push({ leaf: it.name, url: it.url });
                }
            });
            return out;
        }

        // 저장된 상품명(itemName) 안에 메뉴의 leaf 이름이 포함되어 있으면 그 URL을 후보로 삼고,
        // 여러 개 걸리면(예: "명함"이 여러 하위 상품에 다 포함) 가장 구체적인(이름이 긴) 것을 고름
        function guessProductUrl(itemName, flatList) {
            if (!itemName) return null;
            const candidates = flatList.filter(f => f.leaf && itemName.includes(f.leaf));
            if (candidates.length === 0) return null;
            candidates.sort((a, b) => b.leaf.length - a.leaf.length);
            return candidates[0].url;
        }

        function toAbsoluteUrl(url) {
            if (!url) return null;
            return url.startsWith('http') ? url : `https://sowonnamoo.github.io${url}`;
        }

        // 장바구니 아이템 하나에 대한 재구입 상품 페이지 URL을 알아냄
        async function resolveReorderProductUrl(item) {
            if (item.productId) {
                return `https://sowonnamoo.github.io/myjs/products/${item.productId}`;
            }
            const flat = flattenMenu(await loadMenuData());
            const guessed = guessProductUrl(item.itemName, flat);
            return toAbsoluteUrl(guessed) || DEFAULT_PRODUCT_URL;
        }

        // 아이템별 재구입 정보 임시 보관소 (클릭 시점에 조회) — HTML onclick 속성에
        // 객체를 그대로 실을 수 없어서, 키만 넘기고 실제 데이터는 여기서 찾아 씀
        const reorderItemRegistry = {};
        let reorderItemSeq = 0;

        window.reorderClick = async (key) => {
            const data = reorderItemRegistry[key];
            if (!data) return;
            const productUrl = await resolveReorderProductUrl(data);
            const query = new URLSearchParams({
                reorderImage: data.compositeImage || '',
                reorderWidth: data.width || '',
                reorderHeight: data.height || '',
                reorderSide: data.side || ''
            }).toString();
            openProductPopup(`${productUrl}?${query}`);
        };
        // ---------------- 재구입 URL 찾기 끝 ----------------

        // 시안보기 — 새 창 대신 같은 페이지 안 모달로 열어서, 브라우저 주소창/탭
        // 높이 때문에 생기던 회색 여백 문제를 원천적으로 없앰.
        // fallbackUrl을 같이 넘기면, 1차 이미지(R2 등)가 삭제되어 로드 실패했을 때
        // 자동으로 카페24 경로(fallbackUrl)의 이미지로 대체해서 보여줌.
        window.viewSianImage = (url, fallbackUrl) => {
            const primary = url || fallbackUrl;
            if(!primary) return;
            const img = document.getElementById('sian-modal-img');
            img.onerror = () => {
                if (fallbackUrl && img.src !== fallbackUrl) {
                    img.onerror = null;
                    img.src = fallbackUrl;
                } else {
                    img.onerror = null;
                }
            };
            img.src = primary;
            document.getElementById('sian-modal').classList.add('active');
        };
        window.closeSianImage = () => {
            document.getElementById('sian-modal').classList.remove('active');
            document.getElementById('sian-modal-img').src = '';
            document.getElementById('sian-modal-img').onerror = null;
        };
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') window.closeSianImage();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyDU8d6Sh-TDNnRd2aA",
            authDomain: "board-291e3.firebaseapp.com",
            projectId: "board-291e3",
            storageBucket: "board-291e3.firebasestorage.app",
            messagingSenderId: "25881766316",
            appId: "1:25881766316:web:c03e118cf26d3fff11b209"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // cart.html이 저장하는 Firebase 프로젝트(orders 컬렉션) — 원래 검색기가 보던
        // "boards"/"jjjj"와는 완전히 다른 프로젝트라 앱 이름을 따로 줘서 같이 초기화함.
        const cartFirebaseConfig = {
            apiKey: "AIzaSyBzHogA2iaUQqOOsNVL55stsdMH8lCQ4Ek",
            authDomain: "ecogr-636c6.firebaseapp.com",
            projectId: "ecogr-636c6",
            storageBucket: "ecogr-636c6.firebasestorage.app",
            messagingSenderId: "95745358447",
            appId: "1:95745358447:web:94cde53f6b36e6be95eb9a"
        };

        const cartApp = initializeApp(cartFirebaseConfig, "cartApp");
        const cartDb = getFirestore(cartApp);

        // 이름으로 boards/jjjj/cart(orders) 3개 컬렉션을 모두 조회해서 공통 형태로 합쳐줌
        // (전화번호 조회, 네이버 자동 연결 양쪽에서 재사용)
        async function fetchDocsByName(name) {
            const qBoards = query(collection(db, "boards"), where("author", "==", name));
            const qJjjj = query(collection(db, "jjjj"), where("author", "==", name));
            const qCart = query(collection(cartDb, "orders"), where("name", "==", name));

            const [snapBoards, snapJjjj, snapCart] = await Promise.all([getDocs(qBoards), getDocs(qJjjj), getDocs(qCart)]);

            return [
                ...snapBoards.docs.map(doc => ({ ...doc.data(), id: doc.id, isJajoo: false, source: 'board' })),
                ...snapJjjj.docs.map(doc => ({ ...doc.data(), id: doc.id, isJajoo: true, source: 'board' })),
                // cart.html의 orders 컬렉션은 필드 구조가 완전히 달라서(author 대신 name,
                // 단일 상품 대신 items 배열) 렌더링에서 쓸 공통 필드만 맞춰서 정규화함.
                ...snapCart.docs.map(doc => {
                    const data = doc.data();
                    return {
                        ...data,
                        id: doc.id,
                        isJajoo: false,
                        source: 'cart',
                        author: data.name,
                        phone: data.phone
                    };
                })
            ];
        }

        // 주문 문서 하나를 실제로 업데이트할 때 필요한 db/컬렉션명을 판별
        function targetOf(d) {
            const targetDb = d.source === 'cart' ? cartDb : db;
            const targetCollectionName = d.source === 'cart' ? 'orders' : (d.isJajoo ? 'jjjj' : 'boards');
            return { targetDb, targetCollectionName };
        }

        // ---------------- 구글 로그인 ----------------
        // Google Cloud Console(https://console.cloud.google.com/apis/credentials)에서
        // "OAuth 클라이언트 ID" (유형: 웹 애플리케이션)를 만들고 아래 CLIENT_ID를 발급받은 값으로 바꿔주세요.
        // "승인된 자바스크립트 원본"에는 이 페이지가 실제로 서비스되는 도메인만 정확히 등록하면 됩니다.
        // (네이버처럼 경로까지 정확히 일치하는 Callback URL이 아니라, 도메인 단위라 훨씬 간단합니다.
        //  예: https://sowonnamoo.github.io — 별도 검수(심사) 절차도 없습니다.)
        const GOOGLE_CLIENT_ID = "657396405667-nrsfvjrc6e0munkbibsp9sd8glln9qi3.apps.googleusercontent.com";

        let currentGoogleUser = null; // { id, name, email }
        let isGoogleResultView = false; // 지금 화면에 뿌려진 결과가 "구글 계정으로 조회한 결과"인지 여부

        // ---- 이름+전화번호 "신원"을 구글 계정에 연결하는 방식 ----
        // 카드 하나하나를 연결하는 게 아니라, "이 이름 + 이 전화번호 뒷4자리는 이 구글 계정 것"이라는
        // 연결 정보를 googleLinks 컬렉션에 저장해둡니다. 이렇게 하면 지금 있는 주문뿐 아니라
        // 앞으로 같은 이름+전화번호로 새로 접수되는 주문도 자동으로 구글 로그인에 잡히게 됩니다.
        function linkKey(name, phone4) {
            return `${name}__${phone4}`.replace(/[\/\s'"]+/g, '_').slice(0, 190);
        }

        async function upsertGoogleLink(name, phone4) {
            await setDoc(doc(db, "googleLinks", linkKey(name, phone4)), {
                googleId: currentGoogleUser.id,
                name: name,
                phone4: phone4,
                linkedAt: new Date().toISOString()
            });
        }

        // 이 이름+전화번호가 이미 누군가의 구글 계정에 연결되어 있는지 확인 (전화번호 조회 차단용)
        async function isIdentityLinked(name, phone4) {
            try {
                const snap = await getDoc(doc(db, "googleLinks", linkKey(name, phone4)));
                return snap.exists();
            } catch (error) {
                console.error('연결 여부 확인 실패:', error);
                return false;
            }
        }

        // 이 구글 계정에 연결된 이름+전화번호 목록(신원) 전부 가져오기
        async function fetchLinkedProfiles(googleId) {
            const q = query(collection(db, "googleLinks"), where("googleId", "==", googleId));
            const snap = await getDocs(q);
            return snap.docs.map(d => d.data());
        }

        // 구글이 내려주는 JWT(credential)를 디코딩해서 payload(사용자 정보)만 꺼냄
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(
                atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
            );
            return JSON.parse(jsonPayload);
        }

        function updateGoogleStatusUI() {
            const statusEl = document.getElementById('google-status');
            if (!statusEl) return;
            if (currentGoogleUser) {
                statusEl.innerHTML = `
                    <span class="text-slate-700">구글 계정 <b>${currentGoogleUser.name || currentGoogleUser.email || '회원'}</b> 님으로 로그인됨</span>
                    <button id="google-order-search-btn" class="ml-2 text-blue-600 underline font-semibold">내 주문 조회</button>
                    <button id="google-logout-btn" class="ml-2 text-slate-400 underline">로그아웃</button>
                `;
                document.getElementById('google-order-search-btn').addEventListener('click', searchByGoogle);
                document.getElementById('google-logout-btn').addEventListener('click', () => {
                    if (typeof google !== 'undefined' && google.accounts) {
                        google.accounts.id.disableAutoSelect();
                    }
                    currentGoogleUser = null;
                    updateGoogleStatusUI();
                    document.getElementById('results').innerHTML = "";
                });
            } else {
                statusEl.innerHTML = '<span class="text-slate-400">구글 로그인 시 연동된 주문을 바로 조회할 수 있어요</span>';
            }
        }

        // 카드의 "구글 로그인으로 변경" 버튼 — 이 카드의 작성자 이름+전화번호를 구글 계정에 연결
        window.linkOrderToGoogle = (encodedName, phone4) => {
            const name = decodeURIComponent(encodedName);
            if (!currentGoogleUser) {
                // 아직 구글 로그인이 안 된 상태 → 로그인 진행 후 돌아와서 이어서 연결하도록
                // 필요한 정보를 저장해두고 구글 로그인 창을 띄움
                localStorage.setItem('pendingLinkName', name);
                localStorage.setItem('pendingLinkPhone4', phone4);
                localStorage.setItem('pendingSearchName', document.getElementById('search-name').value.trim());
                localStorage.setItem('pendingSearchPhone', document.getElementById('search-phone').value.trim());
                if (typeof google !== 'undefined' && google.accounts) {
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed && (notification.isNotDisplayed() || notification.isSkippedMoment())) {
                            alert('상단의 "Google로 로그인" 버튼을 눌러 먼저 로그인해주세요.');
                        }
                    });
                } else {
                    alert('구글 로그인 버튼을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
                }
                return;
            }
            doLinkIdentity(name, phone4, true);

        async function doLinkIdentity(name, phone4, askConfirm) {
            if (askConfirm && !confirm(`"${name}"(전화번호 뒷 ${phone4}자리) 주문 전체를 구글 계정에 연결하시겠습니까?\n연결 후에는 이 이름+전화번호로 조회되지 않고, 지금 주문뿐 아니라 앞으로 같은 이름·전화번호로 접수되는 주문도 구글 로그인으로만 조회됩니다.`)) {
                return;
            }
            try {
                await upsertGoogleLink(name, phone4);
                alert('구글 계정으로 연결되었습니다. 앞으로는 구글 로그인으로 조회해주세요.');
                location.reload();
            } catch (error) {
                console.error('구글 연결 실패:', error);
                alert('연결 중 오류가 발생했습니다.');
            }
        }

        // 구글 로그인에서 돌아온 직후, 연결 대기 중이던 신원이 있으면 자동으로 연결 처리
        async function handlePendingLink() {
            const name = localStorage.getItem('pendingLinkName');
            const phone4 = localStorage.getItem('pendingLinkPhone4');
            if (name && phone4 && currentGoogleUser) {
                localStorage.removeItem('pendingLinkName');
                localStorage.removeItem('pendingLinkPhone4');
                try {
                    await upsertGoogleLink(name, phone4);
                    alert('구글 계정으로 연결되었습니다. 앞으로는 구글 로그인으로 조회해주세요.');
                } catch (error) {
                    console.error('구글 연결 실패:', error);
                    alert('연결 중 오류가 발생했습니다.');
                }
                return true; // 연결 처리를 했음
            }
            return false;
        }

        // 원래 이름/전화번호로 조회하던 중이었다면 복원해서 재조회
        // (방금 구글로 연결한 신원은 이제 결과에서 자동으로 빠지게 됨)
        function restorePendingSearch() {
            const name = localStorage.getItem('pendingSearchName');
            const phone = localStorage.getItem('pendingSearchPhone');
            localStorage.removeItem('pendingSearchName');
            localStorage.removeItem('pendingSearchPhone');
            if (name && phone) {
                document.getElementById('search-name').value = name;
                document.getElementById('search-phone').value = phone;
                document.getElementById('search-btn').click();
            }
        }

        // 구글 계정에 연결된 모든 신원(이름+전화번호)의 주문을 전부 조회
        // — 지금 있는 주문은 물론, 나중에 같은 이름·전화번호로 새로 접수되는 주문도 여기서 다 잡힘
        async function searchByGoogle() {
            if (!currentGoogleUser) {
                alert('먼저 구글 로그인을 해주세요.');
                return;
            }
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "조회 중...";
            try {
                const profiles = await fetchLinkedProfiles(currentGoogleUser.id);

                if (profiles.length === 0) {
                    resultsDiv.innerHTML = "구글 계정에 연결된 주문 정보가 없습니다.";
                    return;
                }

                const resultsPerProfile = await Promise.all(profiles.map(async (p) => {
                    const allDocs = await fetchDocsByName(p.name);
                    return allDocs.filter(d => d.phone && d.phone.slice(-4) === p.phone4);
                }));

                const seen = new Set();
                const merged = [];
                for (const list of resultsPerProfile) {
                    for (const d of list) {
                        if (!seen.has(d.id)) {
                            seen.add(d.id);
                            merged.push(d);
                        }
                    }
                }

                if (merged.length === 0) {
                    resultsDiv.innerHTML = "구글 계정에 연결된 주문 정보가 없습니다.";
                    return;
                }
                isGoogleResultView = true;
                renderResults(merged);
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = "조회 중 오류가 발생했습니다. 다시 시도해주세요.";
            }
        }

        // 구글은 네이버와 달리 전화번호를 기본 제공하지 않기 때문에(별도의 민감 권한 심사가 필요),
        // 이미 조회창에 입력해둔 이름/전화번호가 있으면 그 신원을 그대로 구글 계정에 연결합니다.
        // (조회 → 결과 확인 → 로그인 순서로 쓰면 자연스럽게 자동 연결되고,
        //  입력값이 없으면 카드별 "구글 로그인으로 변경" 버튼으로 개별 연결하면 됩니다.)
        async function autoLinkMatchingOrders() {
            if (!currentGoogleUser) return;

            const typedName = (document.getElementById('search-name')?.value || '').trim();
            const typedPhone = (document.getElementById('search-phone')?.value || '').trim();

            if (typedName && typedPhone.length === 4) {
                try {
                    const allDocs = await fetchDocsByName(typedName);
                    const hasMatch = allDocs.some(d => d.phone && d.phone.slice(-4) === typedPhone);
                    if (hasMatch) {
                        await upsertGoogleLink(typedName, typedPhone);
                    }
                } catch (error) {
                    console.error('자동 연결 실패:', error);
                }
            }

            // 자동 연결된 게 있든 없든(예전에 이미 연결해둔 경우 포함), 구글 계정에
            // 연결된 주문을 바로 조회해서 보여줌
            searchByGoogle();
        }

        // 구글 로그인 성공 콜백 (google.accounts.id.initialize의 callback으로 등록됨)
        async function handleGoogleCredentialResponse(response) {
            try {
                const payload = parseJwt(response.credential);
                currentGoogleUser = {
                    id: payload.sub,
                    name: payload.name,
                    email: payload.email
                };
                updateGoogleStatusUI();

                const linked = await handlePendingLink();
                if (linked) {
                    restorePendingSearch();
                } else {
                    await autoLinkMatchingOrders();
                }
            } catch (error) {
                console.error('구글 로그인 처리 실패:', error);
            }
        }

        function initGoogleLogin() {
            if (typeof google === 'undefined' || !google.accounts) {
                console.warn('구글 로그인 SDK를 불러오지 못했습니다.');
                return;
            }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredentialResponse,
                auto_select: false
            });
            google.accounts.id.renderButton(
                document.getElementById('g_id_button_container'),
                { theme: 'outline', size: 'large', text: 'signin_with' }
            );
        }

        // 구글 SDK가 비동기(async defer)로 늦게 로드될 수 있어서, 로드 완료까지 짧게 재시도함
        (function waitForGoogleSdk(retries) {
            if (typeof google !== 'undefined' && google.accounts) {
                initGoogleLogin();
            } else if (retries > 0) {
                setTimeout(() => waitForGoogleSdk(retries - 1), 200);
            } else {
                console.warn('구글 로그인 SDK 로드 대기 시간 초과');
            }
        })(25);

window.deleteOrder = async (docId, isJajoo) => {
    // 경고 메시지 내용 변경
    if (confirm("정말로 이 주문을 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.")) {
        try {
            // isJajoo 값에 따라 컬렉션 경로를 다르게 설정
            const collectionName = isJajoo ? "jjjj" : "boards";
            await deleteDoc(doc(db, collectionName, docId));
            
            alert("삭제되었습니다.");
            // 구글 로그인으로 조회한 화면이었으면 구글 조회를, 아니면 이름/전화번호 조회를 다시 실행
            if (isGoogleResultView) {
                searchByGoogle();
            } else {
                document.getElementById('search-btn').click();
            }
        } catch (error) {
            console.error("삭제 실패:", error);
            alert("삭제 중 오류가 발생했습니다.");
        }
    }
};
